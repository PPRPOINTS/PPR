<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PEPS Hub">
<title>PEPS HUB — Live Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--card:#181a23;--card2:#1e2130;--bdr:#2a2d3a;--bdr2:#353849;--txt:#e8e9ed;--dim:#8b8fa3;--mut:#5d6178;--blue:#4f8cff;--green:#34d399;--red:#f87171;--amber:#fbbf24;--purple:#a78bfa;--cyan:#22d3ee;
  /* Phone zoom: scales the whole app (every tab) so more fits on screen.
     1 = off, .7 = 70%. This is the only number to change. */
  --mzoom:.7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.5}
.app{max-width:1400px;margin:0 auto;padding:24px 20px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:12px}
.hdr h1{font-size:24px;font-weight:700}.hdr h1 span{color:var(--blue)}
.hdr p{font-size:13px;color:var(--dim);margin-top:2px}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-txt{font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.tabs{display:flex;gap:4px;margin-bottom:24px;overflow-x:auto;padding-bottom:4px}
.tab{padding:9px 18px;border:1px solid var(--bdr);background:transparent;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap}
.tab:hover{background:var(--card);color:var(--txt)}.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{padding:9px 18px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:#3d7ae6}
.btn-s{background:transparent;border:1px solid var(--bdr);color:var(--dim)}.btn-s:hover{background:var(--card);color:var(--txt)}
.btn-sm{font-size:12px;padding:6px 12px}
.mg{display:grid;gap:14px;margin-bottom:24px}
.mg5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.mg4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.mg3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mg32{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}   /* three across on a computer, two on a phone */
.mg2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.mc{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:16px;transition:all .2s}
.mc:hover{border-color:var(--bdr2);background:var(--card2)}
.mc-l{font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.mc-v{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600}
.mc-s{font-size:11px;color:var(--mut);margin-top:3px}
.tw{background:var(--card);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.ts{overflow-x:auto;overflow-y:visible}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#14161f;padding:10px 14px;text-align:left;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);white-space:nowrap;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:1}
tbody td{padding:10px 14px;border-bottom:1px solid rgba(42,45,58,.5);white-space:nowrap}
tbody tr:hover{background:var(--card2)}
.cm{font-family:'JetBrains Mono',monospace;font-size:12px}
.chip{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:var(--bdr);color:var(--dim)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pill-g{background:rgba(52,211,153,.12);color:var(--green)}.pill-a{background:rgba(251,191,36,.12);color:var(--amber)}.pill-r{background:rgba(248,113,113,.12);color:var(--red)}.pill-b{background:rgba(79,140,255,.12);color:var(--blue)}.pill-p{background:rgba(167,139,250,.12);color:var(--purple)}
.trow td{font-weight:700!important;background:#14161f!important;border-top:2px solid var(--blue)!important}
.sec{display:none}.sec.on{display:block}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.sh h2{font-size:17px;font-weight:600}
.badge{font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 10px;border-radius:20px;background:rgba(79,140,255,.15);color:var(--blue)}
.ptr-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:20px}.ptr-card:hover{border-color:var(--bdr2)}
.ptr-nm{font-size:18px;font-weight:700;margin-bottom:14px}
.ptr-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(42,45,58,.5);font-size:13px}.ptr-row:last-child{border-bottom:none}
.ptr-rl{color:var(--dim)}.ptr-rv{font-family:'JetBrains Mono',monospace;font-weight:500}
.ptr-exp{margin-top:14px;padding-top:10px;border-top:1px solid var(--bdr)}
.ptr-exp-h{font-size:11px;color:var(--mut);margin-bottom:6px}
.ptr-exp-i{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.ptr-exp-il{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
.ptr-exp-iv{font-family:'JetBrains Mono',monospace;color:var(--dim);white-space:nowrap}
.ptr-exps{overflow-y:visible}
.c-pos{color:var(--green)}.c-neg{color:var(--red)}.c-warn{color:var(--amber)}.c-neut{color:var(--txt)}.c-dim{color:var(--dim)}
.c-mut{color:var(--mut)}
.pts-badge{display:inline-block;min-width:26px;padding:2px 9px;border-radius:20px;background:rgba(251,191,36,.15);color:var(--amber);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
/* Follow-Ups */
.fu-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.fu-grid{grid-template-columns:1fr 1fr}}
.fu-card{background:var(--card);border:1px solid var(--bdr);border-left-width:3px;border-radius:12px;padding:14px}
.fu-card.fu-red{border-left-color:var(--red)}
.fu-card.fu-amber{border-left-color:var(--amber)}
.fu-card.fu-green{border-left-color:var(--green)}
.fu-card.fu-quiet{border-left-color:var(--purple)}
.fu-card.fu-done{opacity:.6}
.fu-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.fu-name{font-size:15px;font-weight:700;line-height:1.2}
.fu-chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 8px}
.fu-chip{font-size:11px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:6px;line-height:1.3;white-space:nowrap}
.fu-chip-due{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.fu-chip-soon{background:rgba(251,191,36,.13);color:var(--amber)}
.fu-chip-ok{background:var(--card2);color:var(--dim)}
.fu-chip-mut{background:transparent;color:var(--mut);border:1px dashed var(--bdr)}
.fu-badge{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:4px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.fu-badge-red{background:rgba(248,113,113,.14);color:var(--red)}
.fu-badge-amber{background:rgba(251,191,36,.14);color:var(--amber)}
.fu-badge-green{background:rgba(52,211,153,.14);color:var(--green)}
.fu-badge-quiet{background:rgba(167,139,250,.14);color:var(--purple)}
.fu-meta{font-size:11px;color:var(--mut);font-family:'JetBrains Mono',monospace;margin-bottom:10px;line-height:1.5}
.fu-msg{background:var(--bg);border:1px solid var(--bdr);border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.5;color:var(--txt);margin-bottom:10px;white-space:pre-line}
.lk-copy{background:var(--card2);border:1px solid var(--bdr2);color:var(--txt);border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.lk-copy:hover{border-color:var(--blue)}
.lk-link{color:var(--blue);text-decoration:none;font-size:12px;font-family:'JetBrains Mono',monospace}
.lk-link:hover{text-decoration:underline}
.fu-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fu-pay{display:inline-flex;align-items:center;gap:0;border:1px solid var(--bdr2);border-radius:8px;overflow:hidden}
.fu-btn-pay{border:0;border-radius:0;background:transparent;color:var(--dim);padding:5px 11px;font-size:11px;font-weight:600;cursor:pointer}
.fu-btn-pay.on{background:var(--blue);color:#fff}
.fu-lastpaid{font-size:10px;color:var(--mut);padding:0 9px;border-left:1px solid var(--bdr2);white-space:nowrap}
.fu-btn{flex:1;min-width:120px;padding:9px 12px;border-radius:8px;border:1px solid var(--bdr2);background:var(--card2);color:var(--txt);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.fu-btn:active{transform:scale(.97)}
.fu-btn-copy{background:var(--blue);border-color:var(--blue);color:#fff}
.fu-btn-copy.copied{background:var(--green);border-color:var(--green)}
.fu-btn-done{background:transparent}
.fu-btn-done:hover{border-color:var(--green);color:var(--green)}
.fu-btn-reset{flex:0 0 auto;min-width:0;background:transparent;color:var(--mut);border-color:var(--bdr)}
.fu-btn-reset:hover{border-color:var(--txt);color:var(--txt)}
.fu-btn-snooze{flex:0 0 auto;min-width:0;background:transparent;color:var(--amber);border-color:rgba(251,191,36,.3)}
.fu-btn-snooze:hover{border-color:var(--amber)}
.fu-btn-owner{flex:0 0 auto;min-width:0;background:transparent;color:var(--dim);border-color:var(--bdr)}
.fu-btn-owner:hover{border-color:var(--purple);color:var(--purple)}
.fu-btn-wa{border-color:rgba(37,211,102,.45);color:#25d366;font-weight:600}
.fu-btn-wa:hover{border-color:#25d366;background:rgba(37,211,102,.12)}
.fu-btn-num{font-family:'JetBrains Mono',monospace;color:var(--mut);border-style:dashed}
.fu-btn-num:hover{color:var(--txt);border-color:var(--bdr2)}
.fu-owners{margin-top:16px;padding:12px 14px;background:var(--card);border:1px dashed var(--bdr);border-radius:10px}
.fu-owners-h{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:8px}
.fu-owners-list{display:flex;flex-wrap:wrap;gap:6px}
.fu-owner-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--card2);color:var(--dim);padding:4px 4px 4px 11px;border-radius:14px}
.fu-owner-chip button{background:transparent;border:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 5px;border-radius:50%}
.fu-owner-chip button:hover{color:var(--red)}
.fu-empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:13px}
/* ---- GST & Bank ---- */
.gst-thresh{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:16px;margin-bottom:12px}
.gst-th-h{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:12px}
.gst-bar-l{font-size:12px;color:var(--dim);margin-bottom:5px}
.gst-bar-l b{color:var(--txt);font-variant-numeric:tabular-nums}
.gst-bar{height:8px;background:var(--card2);border-radius:100px;overflow:hidden}
.gst-fill{height:100%;border-radius:100px;transition:width .5s ease}
.gst-warn{margin-top:12px;padding:9px 11px;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.3);border-radius:8px;font-size:12px;color:var(--amber);line-height:1.5}
.gst-ok{margin-top:12px;padding:9px 11px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.28);border-radius:8px;font-size:12px;color:var(--green);line-height:1.5}
.gst-note{margin-top:10px;font-size:11px;color:var(--dim);line-height:1.5}
.gst-proj{margin-top:9px;font-size:12px;color:var(--fg);line-height:1.5}
.gst-note b{color:var(--txt)}
.gst-reg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:11px 14px;font-size:12px;color:var(--dim)}
.gst-t{padding:5px 14px;border-radius:7px;border:1px solid var(--bdr2);background:var(--card2);color:var(--dim);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.gst-t.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.gst-bands{display:flex;gap:6px;flex-wrap:wrap}
.gst-band{flex:1;min-width:112px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;padding:8px 10px}
.gst-band.on{border-color:var(--amber);background:rgba(251,191,36,.07)}
.gst-band-r{display:block;font-size:14px;font-weight:700;color:var(--txt)}
.gst-band.on .gst-band-r{color:var(--amber)}
.gst-band-b{display:block;font-size:10px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.gst-date{padding:5px 9px;border-radius:7px;border:1px solid var(--bdr2);background:var(--card2);color:var(--txt);font-family:inherit;font-size:12px;color-scheme:dark}
.gst-owed{margin-left:6px;font-size:12px;color:var(--dim)}
.gst-owed b{color:var(--txt)}
.gst-owed i{color:var(--mut);font-style:normal;font-size:11px}
.gst-work{width:100%;border-collapse:collapse;font-size:12px}
.gst-work th{text-align:right;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:0 0 8px;border-bottom:1px solid var(--bdr)}
.gst-work th:first-child{text-align:left}
.gst-work td{padding:7px 0;text-align:right;color:var(--dim);font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--bdr)}
.gst-work td:first-child{text-align:left;font-family:inherit}
.gst-work td.neg{color:var(--red)}
.gst-work tr.sum td{color:var(--txt);font-weight:600;border-bottom:1px solid var(--bdr2)}
.gst-work tr.rate td{color:var(--mut);font-size:11px}
.gst-work tr.gap td{color:var(--mut);font-size:11px;font-family:inherit;text-align:right}
.gst-work tr.fin td{color:var(--amber);font-weight:700;border-bottom:0}
.gst-h{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:8px}
.gst-yes{color:var(--green)}
.gst-no{color:var(--amber)}
/* ---- Order Calculator ---- */
.oc-modes{display:inline-flex;border:1px solid var(--bdr2);border-radius:10px;padding:3px;background:var(--card);margin-bottom:6px}
.oc-mode{padding:9px 26px;border:none;border-radius:7px;background:transparent;color:var(--dim);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.oc-mode.on{background:var(--blue);color:#fff}
.oc-note{font-size:11px;color:var(--dim);margin-bottom:14px;line-height:1.5}
.oc-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.oc-list{display:flex;flex-direction:column;gap:8px}
.oc-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:11px 13px;transition:border-color .15s}
.oc-row.on{border-color:var(--blue)}
.oc-p{flex:1;min-width:0}
.oc-n{font-size:14px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.oc-str{font-size:10px;font-weight:700;color:var(--cyan);background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);padding:2px 6px;border-radius:5px;letter-spacing:.3px}
.oc-sub{font-size:11px;color:var(--mut);margin-top:2px}
.oc-warn{font-size:11px;color:var(--amber);margin-top:3px}
.oc-pr{font-size:14px;font-weight:700;color:var(--txt);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.oc-stp{display:flex;align-items:center;border:1px solid var(--bdr2);border-radius:8px;overflow:hidden;background:var(--card2)}
.oc-b{width:32px;height:34px;border:none;background:transparent;color:var(--dim);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;line-height:1}
.oc-b:hover{background:var(--bdr);color:var(--txt)}
.oc-b:active{transform:scale(.9)}
.oc-q{width:40px;height:34px;border:none;background:transparent;color:var(--txt);text-align:center;font-family:inherit;font-size:13px;font-weight:700;-moz-appearance:textfield;outline:none}
.oc-q::-webkit-outer-spin-button,.oc-q::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.oc-sum{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:16px;position:sticky;top:14px}
.oc-sum-h{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:12px}
.oc-li{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim);padding:5px 0}
.oc-li b{color:var(--txt);font-weight:600}
.oc-li span{font-variant-numeric:tabular-nums;white-space:nowrap}
.oc-hr{height:1px;background:var(--bdr);margin:10px 0}
.oc-tr{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:3px 0}
.oc-tr span{font-variant-numeric:tabular-nums}
.oc-free{color:var(--green);font-weight:600}
.oc-tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:1px solid var(--bdr2)}
.oc-tot-l{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.oc-tot-v{font-size:24px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
.oc-cust{margin-bottom:10px}
.oc-sel{width:100%;max-width:420px;background:var(--card);color:var(--txt);border:1px solid var(--bdr);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit}
.oc-sel:focus{outline:none;border-color:var(--blue)}
.oc-cust-note{font-size:11px;color:var(--dim);margin-top:5px}
.oc-struck .oc-tot-v{text-decoration:line-through;color:var(--mut);font-weight:400}
.oc-warn{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.45);color:#fca5a5;border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.5;margin-top:8px}
.oc-warn div{margin-top:2px}
.oc-nudge{margin-top:10px;padding:8px 10px;background:rgba(79,140,255,.08);border:1px solid rgba(79,140,255,.28);border-radius:8px;font-size:11px;color:var(--blue);line-height:1.45}
.oc-acts{display:flex;gap:8px;margin-top:12px}
.oc-cp{flex:1;padding:10px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.oc-cp:hover{background:#3d7ae6}
.oc-cp.copied{background:var(--green)}
.oc-cl{padding:10px 14px;border-radius:8px;border:1px solid var(--bdr2);background:var(--card2);color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.oc-cl:hover{color:var(--txt)}
.oc-none{font-size:12px;color:var(--mut);text-align:center;padding:18px 4px;line-height:1.5}
@media(max-width:860px){.oc-wrap{grid-template-columns:1fr}.oc-sum{position:static}}
.err-msg{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:16px;color:var(--red);font-size:13px;margin-bottom:20px}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--dim);font-size:14px}
.boot{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58vh;gap:22px}
.boot-mark{position:relative;width:168px;height:168px}
.boot-mark svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.boot-ring{fill:none;stroke:#2f3446;stroke-width:1.25}
.boot-inner{fill:none;stroke:#252a39;stroke-width:1;stroke-dasharray:3 9;stroke-linecap:round;
  transform-origin:60px 60px;animation:bootSpinRev 9s linear infinite}
.boot-arc{fill:none;stroke:url(#bootG);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:74 209;transform-origin:60px 60px;animation:bootSpin 1.5s cubic-bezier(.55,.15,.45,.85) infinite}
.boot-res circle{fill:#161a26;stroke:var(--blue);stroke-width:1.9;transform-origin:60px 60px;
  animation:bootRes 1.5s ease-in-out infinite}
.boot-res circle:nth-child(1){animation-delay:0s}
.boot-res circle:nth-child(2){animation-delay:.13s}
.boot-res circle:nth-child(3){animation-delay:.26s}
.boot-res circle:nth-child(4){animation-delay:.39s}
.boot-res circle:nth-child(5){animation-delay:.52s}
.boot-res circle:nth-child(6){animation-delay:.65s}
.boot-mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:35px;font-weight:800;letter-spacing:.08em;text-indent:.08em;color:#f2f3f7;
  text-shadow:0 0 22px rgba(79,140,255,.35);
  animation:bootIn .7s cubic-bezier(.2,.8,.3,1) both}
.boot-name{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--mut);
  text-indent:.34em;animation:bootIn .7s .18s cubic-bezier(.2,.8,.3,1) both}
@keyframes bootSpin{to{transform:rotate(360deg)}}
@keyframes bootSpinRev{to{transform:rotate(-360deg)}}
@keyframes bootRes{0%,100%{opacity:.28;transform:scale(.82)}45%{opacity:1;transform:scale(1)}}
@keyframes bootIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .boot-arc{animation:none;stroke-dasharray:209 74}
  .boot-inner{animation:none}
  .boot-res circle{animation:none;opacity:.75}
  .boot-mono,.boot-name{animation:none}
}
.loading::before{content:"";width:20px;height:20px;border:2px solid var(--bdr);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid rgba(42,45,58,.3);text-align:center;color:var(--mut);font-size:12px}
.foot a{color:var(--blue);text-decoration:none}
.setup{background:linear-gradient(135deg,rgba(79,140,255,.08),rgba(167,139,250,.08));border:1px solid var(--blue);border-radius:14px;padding:24px;margin-bottom:24px;display:none}
.setup h2{font-size:17px;margin-bottom:6px;color:var(--blue)}.setup p{font-size:13px;color:var(--dim);margin-bottom:14px}
.setup-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.setup input{flex:1;min-width:250px;border-radius:8px;border:1px solid var(--bdr2);background:#0f1117;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:12px;padding:10px 14px;outline:none}
@media(max-width:768px){
  /* Whole app scaled to --mzoom so every tab fits more on a phone screen.
     zoom (not transform) so the layout genuinely reflows into the freed-up space. */
  .app{zoom:var(--mzoom);padding:12px 10px}
  /* Header */
  .hdr{margin-bottom:12px;padding-bottom:10px;gap:8px}
  .hdr h1{font-size:18px}
  .hdr p{font-size:11px}
  .live-txt{font-size:10px}
  .btn-sm{font-size:10px;padding:5px 9px}
  /* Tabs - much smaller pills */
  .tabs{margin-bottom:14px;gap:3px;padding-bottom:2px}
  .tab{padding:6px 11px;font-size:11px;border-radius:7px}
  /* Section headers */
  .sh{margin-bottom:10px;gap:6px}
  .sh h2{font-size:14px}
  .badge{font-size:9px;padding:3px 7px;letter-spacing:.4px}
  /* Card defaults */
  .mc{padding:12px;border-radius:10px}
  .mc-l{font-size:9px;margin-bottom:3px;letter-spacing:.5px}
  .mc-v{font-size:16px}
  .mc-s{font-size:10px}
  /* The Stock List is a self-contained responsive page inside an iframe, so it wants the
     real viewport width, not the .app zoomed one. Cancelling the zoom here keeps frame and
     document on one coordinate system - iOS otherwise paints the inner page at 70% width. */
  #sec-stocklist{zoom:1.4285714}
  /* Grid spacing */
  .mg{gap:8px;margin-bottom:14px}
  .mg4,.mg5,.mg32{grid-template-columns:1fr 1fr}
  .mg3,.mg2{grid-template-columns:1fr}
  /* Override inline-styled large numbers across all sections */
  .mc div[style*="font-size:24px"]{font-size:18px!important}
  .mc div[style*="font-size:22px"]{font-size:16px!important}
  .mc div[style*="font-size:18px"]{font-size:14px!important}
  .mc div[style*="font-size:15px"]{font-size:13px!important}
  .mc div[style*="font-size:14px"]{font-size:12px!important}
  .mc div[style*="font-size:13px"]{font-size:11px!important}
  .mc span[style*="font-size:13px"]{font-size:11px!important}
  .mc div[style*="min-height:120px"]{min-height:0!important}
  .mc[style*="min-height:120px"]{min-height:0!important}
  /* Total Potential card - stack vertical on mobile, tighter gap */
  .mc div[style*="gap:24px"]{gap:14px!important}
  /* Partner cards */
  .ptr-card{padding:14px;border-radius:10px}
  .ptr-nm{font-size:14px;margin-bottom:10px}
  .ptr-row{font-size:11px;padding:5px 0}
  .ptr-exp{margin-top:10px;padding-top:8px}
  .ptr-exp-h{font-size:10px}
  .ptr-exp-i{font-size:10px}
  /* Tables - smaller font */
  table{font-size:11px}
  thead th{padding:7px 9px;font-size:9px}
  tbody td{padding:7px 9px}
  .cm{font-size:11px}
  /* Pill smaller */
  .pill{font-size:9px;padding:2px 8px}
  /* Foot */
  .foot{font-size:10px;margin-top:24px;padding-top:14px}
}

.ro-un{border:1px solid var(--bdr);background:transparent;color:var(--fg);border-radius:999px;padding:2px 10px;font-size:11px;cursor:pointer;margin:0 3px 3px 0}

</style>

<body>
<div class="app">
  <div class="setup" id="setupBox"><h2 id="setupTitle">Connect</h2><p id="setupSub">Paste Apps Script URL and password</p><div id="storeWarn" style="display:none;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.45);color:#fbbf24;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin:8px 0"></div><form id="setupForm" autocomplete="on" action="#" style="margin:0"><div class="setup-row"><input type="text" id="urlInput" name="username" autocomplete="username" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Apps Script URL"></div><div class="setup-row" style="margin-top:6px"><input type="password" id="keyInput" name="password" autocomplete="current-password" placeholder="Password"><button class="btn btn-p" type="submit">Connect</button></div></form><p id="saveHint" style="display:none;font-size:11.5px;opacity:.7;margin-top:8px">Tip: let your phone save this, then it fills both fields in one tap.</p></div>

<script>
// Never run inside another site's page. These pages are opened directly, so a frame can only
// mean another site is wrapping them to get at the data. Stops before anything is read.
(function(){var framed=true;try{framed=window.top!==window.self;}catch(e){}
  if(!framed)return;
  document.addEventListener("DOMContentLoaded",function(){document.body.innerHTML='<p style="padding:40px;font-family:sans-serif;color:#8b8fa3">Open this page directly.</p>';});
  throw new Error("Framed by another page, stopped");})();
// Some browsers (mobile Safari inside the Wix iframe especially) block storage outright.
// Touching it unguarded throws and takes the whole page down, so everything goes through
// these. If storage is blocked we keep the values in memory for this session instead.
const memStore={};
function lsGet(k){try{const v=localStorage.getItem(k);return v==null?(memStore[k]||null):v;}catch(e){return memStore[k]||null;}}
function lsSet(k,v){memStore[k]=v;try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
/* Does this browser actually keep what we save? Private tabs and blocked site data
   both fail here, and iOS also wipes stored data for any site untouched for 7 days. */
function storageOK(){try{localStorage.setItem("__probe","1");var v=localStorage.getItem("__probe");localStorage.removeItem("__probe");return v==="1";}catch(e){return false;}}
function bannerWarn(m){
  var b=document.getElementById("topWarn");
  if(!b){b=document.createElement("div");b.id="topWarn";
    b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:9999;background:#78350f;color:#fde68a;font-size:12.5px;line-height:1.4;padding:9px 14px;text-align:center;box-shadow:0 2px 14px rgba(0,0,0,.5)";
    b.addEventListener("click",function(){b.remove();try{document.body.style.paddingTop="";}catch(e){}});
    document.body.appendChild(b);}
  b.innerHTML=m+' <span style="opacity:.7">tap to dismiss</span>';
  try{ document.body.style.paddingTop=b.offsetHeight+"px"; }catch(e){}
}
// No endpoint baked in: an out-of-date one just makes the page retry a dead URL forever.
let SCRIPT_URL=lsGet("peps-script-url")||"";
// Secret key the Apps Script requires before it returns any data. Must match ACCESS_KEY in the Apps Script.
// The password is NOT stored in this file - this page is public, so anything in here is
// readable by anyone. You type it once and it lives in this browser only.
let SCRIPT_KEY=new URLSearchParams(location.search).get("key")||lsGet("peps-script-key")||"";
function buildUrl(fresh){return SCRIPT_URL+(SCRIPT_URL.indexOf("?")>=0?"&":"?")+"key="+encodeURIComponent(SCRIPT_KEY)+(fresh?"&fresh=1":"");}
let refreshTimer=null,activeTab="overview",D=null;
// Partner names are never hardcoded - they are read from the sheet (see partnerNamesFrom).
// This list is only used if the sheet gives us nothing at all.
const PARTNERS_FALLBACK=[];   // left empty so no names sit in this public file
const PTR_COLS=["var(--blue)","var(--purple)","var(--cyan)","var(--green)","var(--amber)","var(--red)"];
// Running costs stopped being logged on the Money tab in mid May 2026, so a $200 a month
// allowance covers consumables from June 2026 on, growing by $200 each new month.
const CONSUMABLES_A_MONTH=200, CONSUMABLES_FROM=new Date(2026,5,1);
function consumablesSoFar(now){
  const n=now||new Date();
  const m=(n.getFullYear()-CONSUMABLES_FROM.getFullYear())*12+(n.getMonth()-CONSUMABLES_FROM.getMonth())+1;
  return Math.max(0,m)*CONSUMABLES_A_MONTH;
}
const TABS=[{k:"overview",l:"Overview"},{k:"sales",l:"Sales"},{k:"followups",l:"Follow-Ups"},{k:"ordercalc",l:"Order Calculator"},{k:"points",l:"Points"},{k:"links",l:"Links"},{k:"products",l:"Products"},{k:"inventory",l:"Inventory"},{k:"gst",l:"GST & Bank"},{k:"stocklist",l:"Stock List"}];

const num=s=>{if(s==null||s===""||(typeof s==="string"&&s.startsWith("#")))return 0;let v=String(s).replace(/[$,\s%]/g,"").replace(/[−–]/g,"-").replace(/^\((.+)\)$/,"-$1");const n=parseFloat(v);return isNaN(n)?0:n;};
const fmt=n=>{if(n==null||isNaN(n))return"$0.00";const a=Math.abs(n).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});return n<0?`-$${a}`:`$${a}`;};
const pct=n=>isNaN(n)||!isFinite(n)?"—":(n*100).toFixed(1)+"%";
const esc=s=>s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"):"";
const sDate=d=>{if(!d)return"—";const s=String(d),m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m){const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return parseInt(m[1])+" "+M[parseInt(m[2])-1];}return s.slice(0,10);};
const pillCls=s=>{const l=String(s||"").toLowerCase();if(l==="active"||l==="received"||l==="paid"||l==="completed"||l==="delivered")return"pill-g";if(l==="ordered"||l==="processing"||l==="pending"||l==="packed"||l==="sent"||l==="part paid")return"pill-a";if(l==="discontinued"||l==="cancelled"||l==="unpaid")return"pill-r";return"pill-b";};

function findRow(rows,col,val){for(let i=0;i<rows.length;i++){if(rows[i]&&String(rows[i][col]||"").trim()===val)return i;}return-1;}
/* headerMap keys are the exact header text, so "random key" would not match
   "Random Key". This finds it either way. */
function colIdx(map,name){
  if(map[name]!=null)return map[name];
  const t=String(name).trim().toLowerCase().replace(/\s+/g," ");
  for(const k in map){ if(String(k).trim().toLowerCase().replace(/\s+/g," ")===t) return map[k]; }
  return null;
}
function headerMap(rows,hr){const m={};if(!rows[hr])return m;rows[hr].forEach((h,i)=>{const k=String(h||"").trim();if(k)m[k]=i;});return m;}

// Who the partners are comes from the sheet, so the dashboard follows along when the line-up
// changes. Source of truth: the Inventory_Summary header - every column sitting between
// "Storage" and "Total Units" is a partner. Backstop: names down column A of Partner_Summary.
function partnerNamesFrom(raw){
  const bad=/^(storage|total|totals|total units|grand total|sku|product|name|partner|partners|person|owner|notes?|duds|units of duds|unit cost|stock cost value|net price|potential revenue)$/i;
  const out=[],seen={};
  const add=v=>{const t=String(v||"").trim();if(!t||bad.test(t)||/[0-9$%]/.test(t)||seen[t.toLowerCase()])return;seen[t.toLowerCase()]=1;out.push(t);};
  const inv=raw.Inventory_Summary||[];
  const ih=findRow(inv,0,"SKU");
  if(ih>=0){
    const head=(inv[ih]||[]).map(h=>String(h||"").trim());
    const a=head.findIndex(h=>/^storage$/i.test(h));
    const b=head.findIndex(h=>/^total units$/i.test(h));
    if(a>=0&&b>a)for(let c=a+1;c<b;c++)add(head[c]);
  }
  if(!out.length){
    const ps=raw.Partner_Summary||[];
    let hr=-1;
    for(let i=0;i<Math.min(8,ps.length);i++){
      const row=(ps[i]||[]).map(v=>String(v||"").trim().toLowerCase());
      if(row.some(h=>/^(partner|partners|name|person|owner)$/.test(h))){hr=i;break;}
    }
    for(let i=(hr<0?0:hr+1);i<ps.length;i++)add((ps[i]||[])[0]);
  }
  return out.length?out:PARTNERS_FALLBACK.slice();
}

function parseAll(raw){
  // Dashboard
  const dash=raw.Dashboard||[];
  const d={};
  // Match labels case-insensitively, trim trailing spaces from both keys and lookups
  const dMap={"bank balance":"bankBalance","paypal":"paypal","cash on hand":"cashOnHand","total (cash and bank):":"totalCash","bank reserve required":"bankReserve","bank gap (bank balance and reserve)":"bankGap","customer owes us":"customerOwes","customer credit / overpaid":"customerCredit","pending payouts":"pendingPayouts","partners owes account":"partnersOwesAccount","partners owes storage":"partnersOwesStorage","account owes partners":"accountOwesPartners","how many units in storage":"unitsStorage","total units":"totalUnits","inventory value":"invValue","inventory value (cost ex gst)":"invValue","potential revenue":"potRevenue","potential revenue (net ex gst)":"potRevenue","total expenses":"totalExpenses","total expenses (inc gst)":"totalExpenses","total lab orders":"totalLabOrders","total lab orders (inc gst)":"totalLabOrders","lab orders not received":"labNotReceived","lab # active products":"activeProducts"};
  const partnerNames=partnerNamesFrom(raw);
  const pIndex={};partnerNames.forEach(n=>{pIndex[n.toLowerCase()]=n;});

const CACHE_KEY="peps_hub_cache_v1";

// Mobile Safari blocks this iframe's own localStorage (third-party storage partitioning), so
// on a phone our in-frame cache is often dead and every load eats the slow ~6s endpoint. Two
// defences: (1) try BOTH localStorage and sessionStorage - sometimes one works when the other
// doesn't; (2) the Wix parent, being first-party, can always store it and push it in. On boot
// we actively ask the parent for its cached copy so it paints the instant the page opens,
// rather than waiting on the network round-trip.
function readCache(){
  for(const get of [()=>localStorage,()=>sessionStorage]){
    try{const raw=JSON.parse(get().getItem(CACHE_KEY)||"null");if(raw&&raw.payload)return raw;}catch(e){}
  }
  return null;
}
function writeCache(obj){
  const s=JSON.stringify(obj);
  try{localStorage.setItem(CACHE_KEY,s);}catch(e){}
  try{sessionStorage.setItem(CACHE_KEY,s);}catch(e){}
}

  try{

// Keeps trying after a failed load. Mobile connections drop in and out, so rather than
// leaving a dead screen we retry on a timer, and immediately if the phone comes back
// online or you switch back to the tab.
let retryTimer=null, retryWait=6000;
function scheduleRetry(){
  clearTimeout(retryTimer);

  retryWait=Math.min(retryWait*1.6, 45000);   // back off, but never give up entirely

  });

async function refreshData(force){
  if(!SCRIPT_URL)return;
  if(window._pepsFetching)return;              // don't stack requests on top of each other
  window._pepsFetching=true;
  try{ await refreshDataInner(force); }
  finally{ window._pepsFetching=false; }
}
async function refreshDataInner(force){
  if(!SCRIPT_URL)return;const err=document.getElementById("errMsg");
  err.innerHTML="";
  setConn("busy", force ? "Getting the latest…" : (D ? "Updating…" : "Loading…"));
  // Fetch with a hard timeout so a slow/stalled request can't hang the page.
  const attempt=async(ms)=>{
    const ctrl=new AbortController(), timer=setTimeout(()=>ctrl.abort(),ms);
    try{const resp=await fetch(buildUrl(force),{signal:ctrl.signal});return await resp.json();}
    finally{clearTimeout(timer);}
  };
  let raw=null;
  const waits=[15000,25000];   // endpoint answers in ~1-7s; if it's slower than this, retry rather than hang
  for(let i=0;i<waits.length && raw===null;i++){
    try{raw=await attempt(waits[i]);}
    catch(e){console.error(e);
      if(i<waits.length-1)await new Promise(r=>setTimeout(r,1500));
    }
  }
  if(raw===null){
    // Couldn't get through. Keep whatever's on screen and keep trying quietly in the
    // background, so a dropout on mobile heals itself instead of sitting there dead.
    if(D){setConn("stale","Showing saved data");}
    else{err.innerHTML='<div class="err-msg">Still trying to reach your data. This will keep retrying on its own.</div>';setConn("off","Retrying…");}
    scheduleRetry();

    if(raw.error)throw new Error(raw.error);
    D=parseAll(raw);fuApplyPending();cacheSave(raw);
    setConn("live","Live · updated "+new Date().toLocaleTimeString());
    const lm=document.getElementById("loadMsg");if(lm)lm.remove();render();
  }catch(e){console.error(e);
    if(D){setConn("stale","Showing saved data");}
    else{err.innerHTML='<div class="err-msg">'+esc(e.message)+'</div>';setConn("off","Error");}
  }
}

/* Tell the Wix embed how tall we are, so it can grow the iframe to full height and let
 * the wrapper scroll natively. Older iOS Safari can't scroll reliably INSIDE an iframe —
 * it rubber-bands back — so we never ask it to.
 * Measures the bottom of the real content (.app, .foot, anything else). Deliberately NOT
 * body.scrollHeight: body has min-height:100vh, so a taller iframe would grow the viewport,
 * which grows body, which reports taller again — a loop that inflates forever. */
function postHeight(){
  try{
    const off=window.scrollY||window.pageYOffset||0;
    let bottom=0;
    const kids=document.body.children;
    for(let i=0;i<kids.length;i++){
      const el=kids[i],tag=el.tagName;
      if(tag==="SCRIPT"||tag==="STYLE"||tag==="LINK")continue;
      const b=el.getBoundingClientRect().bottom+off;
      if(b>bottom)bottom=b;
    }
    const h=Math.ceil(bottom)+16;
    if(h>0&&Math.abs(h-(postHeight._last||0))>2){postHeight._last=h;parent.postMessage({pepsHubHeight:h},"*");}
  }catch(e){}
}

// resize/observer tick thrashes the main thread - worst on mobile. Coalesce all triggers

// one-shot catch-ups after load and fonts, so nothing keeps burning CPU once things settle.
let _phQueued=false;

function rOverview(){
  // Leave the page alone while a reorder number is being typed, so a refresh cannot wipe it.
  const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains("ro-q")&&document.getElementById("roBox"))return;
  const d=D.dashboard,o=D.orders;
  // Order status counts
  // One order is one customer on one day, the way the order page writes them. These used to
  // count product lines, so a three product order counted as three orders.
  const ordKey=x=>fuNorm(x.customer)+"|"+String(x.date||"").trim();
  const named=o.filter(x=>String(x.customer||"").trim());
  // Real customer orders only, counted the way the Sales tab counts them: one client on one
  // day, with something actually sold. Partner stock pulls and free vial only drops are not
  // orders, and neither is anything cancelled or refunded.
  const custOrd={};
  named.forEach(x=>{
    if(x.ownerPurchase==="Yes"||/cancel|refund|void/i.test(String(x.fulfilment||"")+" "+String(x.payStatus||"")))return;
    const k=ordKey(x),c=custOrd[k]||(custOrd[k]={sold:0,done:false});
    if(String(x.freeVial||"").trim().toLowerCase()!=="yes")c.sold+=x.lineTotal||0;
    if((x.fulfilment==="Completed"||x.fulfilment==="Delivered")&&(x.payStatus==="Paid"||x.payStatus==="Part Paid"))c.done=true;
  });
  const realOrders=Object.values(custOrd).filter(c=>c.sold>0);
  const delivered=realOrders.filter(c=>c.done).length;
  const totalOrders=realOrders.length;

  // Three Kanban buckets — computed directly from Customer_Orders so each line always
  // shows name + products + amount (no longer reads the manually-typed Dashboard cells).
  const shortP=p=>String(p).replace(/\s*\([^)]*\)/g,"").trim();
  const buildBucket=(filterFn,amountKey)=>{
    const by={};
    o.forEach(x=>{
      if(!filterFn(x))return;
      const name=String(x.customer||"").trim();if(!name)return;
      if(!by[name])by[name]={name:fuBaseName(name)||name,items:{},amt:0};   // shown without the referral tail
      const pn=shortP(x.product)||"item";
      by[name].items[pn]=(by[name].items[pn]||0)+(x.qty||1);
      by[name].amt+=(x[amountKey]||0);
    });
    return Object.values(by).map(c=>{
      const prods=Object.entries(c.items).map(([p,q])=>q>1?p+" x"+q:p).join(", ");
      return {name:c.name,detail:prods,amt:c.amt>0?fmt(c.amt):"",raw:c.amt};
    }).sort((a,b)=>a.name.localeCompare(b.name));
  };
  const bucketTot=list=>list.reduce((s,x)=>s+(x.raw||0),0);
  const doneStatuses=["completed","delivered","sent"];   // "Sent" means it's gone, so it's finished too
  const notDone=x=>doneStatuses.indexOf(String(x.fulfilment||"").trim().toLowerCase())<0;
  // The three boxes follow an order along: not packed yet, then packed and waiting to go,
  // then sent and waiting on payment. An order is only asked for money once it has gone out.
  // Cancelled or refunded orders never need packing, sending or paying, so they stay out.
  const dead=x=>/cancel|refund|void/i.test(String(x.fulfilment||"")+" "+String(x.payStatus||""));
  const isPacked=x=>/^yes$/i.test(String(x.packed||"").trim())||String(x.fulfilment||"").trim().toLowerCase()==="packed";
  // Needs Action: not packed yet, paid or not
  const needsActionList=buildBucket(x=>!dead(x)&&notDone(x)&&!isPacked(x),"lineTotal");
  // Packed and Ready to Send: packed but not sent yet
  const packedList=buildBucket(x=>!dead(x)&&notDone(x)&&isPacked(x),"lineTotal");
  // Client Received and Requires Payment: sent or completed, still unpaid
  const readyToPayList=buildBucket(x=>!dead(x)&&!notDone(x)&&x.payStatus==="Unpaid","balanceDue");

  // Bank balance: read directly from Dashboard tab cell D6
  const adjBankBalance=(d.bankBalance||0);
  // PayPal balance from Dashboard tab cell D7
  const paypalBal=(d.paypal||0);
  // Cash on Hand from Dashboard tab cell D8
  const cashOnHand=(d.cashOnHand||0);
  // Total held: prefer Dashboard tab "Total" cell; fall back to bank+paypal+cash if blank
  const totalHeld=(d.totalCash||0)||(adjBankBalance+cashOnHand);

  const totalRevenue=o.filter(x=>x.payStatus==="Paid"||x.payStatus==="Part Paid").reduce((s,x)=>s+x.amountReceived,0);
  const totalTrueProfit=o.filter(x=>x.payStatus==="Paid"||x.payStatus==="Part Paid").reduce((s,x)=>s+x.profit,0);

  // Profit this week / this month — from PAID orders only, by Order Date
  const today=new Date();
  const dayOfWeek=(today.getDay()+6)%7; // Monday=0
  const weekStart=new Date(today);weekStart.setHours(0,0,0,0);weekStart.setDate(today.getDate()-dayOfWeek);
  const monthStart=new Date(today.getFullYear(),today.getMonth(),1);
  const orderDateObj=(s)=>{const m=String(s||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)return null;return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));};

  let weekProfit=0,monthProfit=0,weekCount=0,monthCount=0;
  let weekVials=0,monthVials=0,lifetimeVials=0;
  let weekRevenue=0,monthRevenue=0;
  let firstOrderDate=null;
  const weekBySku={},monthBySku={},lifetimeBySku={};
  const soldBySku={},soldByName={};   // lifetime vials sold, for reorder sizing (by velocity)
  o.forEach(x=>{
    if(x.payStatus!=="Paid"&&x.payStatus!=="Part Paid")return;
    const od=orderDateObj(x.date);if(!od)return;
    if(!firstOrderDate||od<firstOrderDate)firstOrderDate=od;
    const qty=x.qty||0;
    const skuName=x.product||x.sku||"Unknown";
    const vq=(x.freeVial!=="Yes"&&!slIsBac(x))?qty:0;      // vials sold: no bac water, no freebies, same as the Sales tab
    lifetimeVials+=vq;
    if(vq)lifetimeBySku[skuName]=(lifetimeBySku[skuName]||0)+vq;
    if(od>=monthStart){monthProfit+=x.profit;monthCount++;monthVials+=vq;monthRevenue+=x.amountReceived;if(vq)monthBySku[skuName]=(monthBySku[skuName]||0)+vq;}
    if(od>=weekStart){weekProfit+=x.profit;weekCount++;weekVials+=vq;weekRevenue+=x.amountReceived;if(vq)weekBySku[skuName]=(weekBySku[skuName]||0)+vq;}
  });
  // How fast stock goes out, for reordering: every line that took stock, paid or not, free
  // vials and partners included. Only cancelled or refunded lines are left out. Matched to the
  // Inventory rows the same way lab orders are, so RETAT20 counts against the 20mg row and a
  // SKU with a stray space, like Klow, still lines up.
  const stockOut={};
  o.forEach(x=>{
    if(/cancel|refund|void/i.test(String(x.fulfilment||"")+" "+String(x.payStatus||"")))return;
    const qty=x.qty||0;if(!qty)return;
    const k=String(x.sku||"").trim().toUpperCase();if(k)stockOut[k]=(stockOut[k]||0)+qty;
    const pnm=shortP(x.product);if(pnm)soldByName[pnm.toLowerCase()]=(soldByName[pnm.toLowerCase()]||0)+qty;
  });
  const invSold=i=>Object.keys(stockOut).reduce((t,k)=>t+(labMatchesInv({sku:k,product:""},i)?stockOut[k]:0),0);
  const fmtBreakdown=(obj)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);if(e.length===0)return"No vials sold yet";return e.map(([n,c])=>esc(n)+': '+c).join(', ');};
  const monthBreakdown=fmtBreakdown(monthBySku);
  const lifetimeBreakdown=fmtBreakdown(lifetimeBySku);

  // Average revenue per month since the business started (first paid order → now)
  let monthsElapsed=1;
  if(firstOrderDate){monthsElapsed=(today.getFullYear()-firstOrderDate.getFullYear())*12+(today.getMonth()-firstOrderDate.getMonth())+1;if(monthsElapsed<1)monthsElapsed=1;}

  // Weekly run rate off the actual days traded, not month/4, so it doesn't drift.
  const daysTrading=firstOrderDate?Math.max(7,Math.round((today-firstOrderDate)/86400000)+1):7;
  const avgRevPerWeek=totalRevenue/(daysTrading/7);
  // Months off the actual days traded too. Counting calendar months counted this part month
  // as a whole one, which dragged the monthly average down.
  const monthsTrading=daysTrading/30.44;
  const avgRevPerMonth=totalRevenue/monthsTrading;
  // Owners come from the Partner Summary, so this follows along if the line-up changes.
  const ownerNames=(D.partnerDetail||[]).map(x=>String(x.person||"").trim()).filter(Boolean);
  const ownerCount=Math.max(1,ownerNames.length);
  const perOwnerWeek=avgRevPerWeek/ownerCount;
  // Expenses: keep the tracked figure from the sheet, then add a $200/month estimate for
  // consumables (printing, bags, boxes, labels) from June 2026, when the Money tab stopped.
  const consumables=consumablesSoFar(today);
  const estExpenses=(d.totalExpenses||0)+consumables;
  const sinceStr=firstOrderDate?firstOrderDate.toLocaleDateString('en-AU',{month:'short',year:'numeric'}):"start";

  // ---- Reorder alert: what's low, minus what's already on the way, sized by how fast it sells ----
  // Getting low ≤15 units, critically low ≤10 units. Order today → arrives ~2 weeks out.
  const HORIZON_NOW=14, HORIZON_SOON=42, LOW_STOCK=15, LEAD_DAYS=14, COVER_MONTHS=2;
  const arriveDate=new Date(today.getTime());arriveDate.setDate(arriveDate.getDate()+LEAD_DAYS);
  const arriveStr=arriveDate.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

  // Stock already ordered from the lab and still "Processing" — don't reorder what's coming.
  // Match to inventory by SKU. Handles variant SKUs too: a lab "RETAT20" matches the 20mg
  // inventory row (SKU "RETAT") by checking the strength, so it doesn't get confused with 15mg.
  // Anything on the Lab Orders tab that has not been received yet is still on the way.
  // The sheet uses "Ordered", older rows used "Processing", so go by what is NOT finished.
  // That way a new status word still counts as incoming instead of being silently missed.
  const LAB_DONE=["received","cancelled","canceled","complete","completed","refunded","returned"];
  const processing=D.lab.filter(l=>(l.qty||0)>0 && LAB_DONE.indexOf(String(l.status||"").trim().toLowerCase())<0);
  const digits=s=>String(s||"").replace(/[^0-9]/g,"");
  function labMatchesInv(l,i){
    const ls=String(l.sku||"").trim().toUpperCase(), is=String(i.sku||"").trim().toUpperCase();
    if(!ls||!is)return false;
    if(ls===is)return true;                                   // same SKU
    if(ls.startsWith(is)){const suf=digits(ls.slice(is.length));return !!suf && digits(i.name).indexOf(suf)>=0;} // e.g. RETAT20 → 20mg row
    if(is.startsWith(ls)){const suf=digits(is.slice(ls.length));return !!suf && digits(l.product).indexOf(suf)>=0;}
    return false;
  }
  const incomingFor=(i)=>{let sum=0;processing.forEach(l=>{if(labMatchesInv(l,i))sum+=(l.qty||0);});return sum;};

  const invRows=D.inventory
    .filter(i=>String(i.name||"").trim())
    .map(i=>{
      const incoming=incomingFor(i);
      const effective=i.total+incoming;                                   // on shelf + on the way
      const sold=invSold(i)||soldByName[shortP(i.name).toLowerCase()]||0;
      const perMonth=sold/monthsTrading;                                  // average sales velocity
      const perDay=perMonth/30.44;
      const runway=perDay>0?effective/perDay:(effective<=0?0:99999);      // days of stock left at that rate
      const target=Math.max(10,Math.ceil((perMonth*COVER_MONTHS)/10)*10); // aim for ~2 months cover, in 10s
      const shortfall=target-effective;
      const orderQty=shortfall<=0?0:Math.max(10,Math.ceil(shortfall/10)*10); // 0 = already covered (incl. what's coming)
      return {name:shortP(i.name),total:i.total,incoming,effective,perMonth,runway,orderQty,unitCost:i.unitCost||0,cost:(i.unitCost||0)*orderQty,outNow:effective<=0,key:roKeyOf(i)};
    })
    .filter(s=> s.name.toLowerCase().replace(/\s+/g,"")!=="bpc" )   // drop the fallback "BPC" — we stock BPC-157
  ;
  const lowStockAll=invRows

function parseOrderDate(s){

  const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return parseInt(m[3])*10000+parseInt(m[2])*100+parseInt(m[1]);

}

function fuFmtDate(d){if(!d)return"—";const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return d.getDate()+" "+M[d.getMonth()];}

// Turn whatever gets typed into the digits-only international form wa.me needs.
// Australian mobiles are the normal case: 0412 345 678 becomes 61412345678.
// A number already starting with 61, or written +61, is left alone bar the punctuation.
// Does this look like a whole, untouched phone number? Length is the giveaway: every way a
// number gets damaged in a spreadsheet (split cell, lost digits, stray digits from the cell
// next door) changes how many digits there are.
function fuPhoneSane(raw){
  const t=String(raw||"").replace(/\u00a0/g," ").trim();
  if(!t)return false;
  if(t.charAt(0)==="#")return false;                 // #ERROR! / #REF!
  if(/E\+?\d/i.test(t))return false;                 // 4.47375E+11
  const d=t.replace(/[^\d]/g,"");
  if(t.charAt(0)==="+")return d.length>=8&&d.length<=15;
  if(d.length===10&&d.charAt(0)==="0")return true;   // 04xx xxx xxx / 07 xxxx xxxx
  if(d.length===9&&d.charAt(0)==="4")return true;    // leading 0 lost
  if(d.length===11&&d.indexOf("61")===0)return true; // AU with country code
  // No + means we are guessing, so only trust the handful of countries this business actually
  // deals with, and only at the exact length those numbers are. Anything else has to be typed
  // with a + in front, which is always believed. Better to ask than to message a stranger.
  if(d.length>=10&&d.length<=15&&d.charAt(0)!=="0"){
    return FU_BARE_CC.some(c=>d.indexOf(c[0])===0&&(d.length-c[0].length)>=c[1]&&(d.length-c[0].length)<=c[2]);
  }
  return false;
}
// [country code, min digits after it, max digits after it]
const FU_BARE_CC=[["61",9,9],["64",8,9],["44",10,10],["1",10,10]];
function fuPhoneNorm(raw){
  // "+44 (0)7375 025333" is a common way to write a number: the bracketed 0 is the trunk
  // digit you drop when dialling internationally, so strip it before anything else.
  const txt=String(raw||"").trim().replace(/\(\s*0\s*\)/g,"");
  const hadPlus=txt.charAt(0)==="+";
  const v=txt.replace(/[^\d]/g,"");
  if(!v)return "";
  // A leading + means it already carries its country code, wherever they are. Trust it.
  if(hadPlus)return v;
  if(v.indexOf("0011")===0)return v.slice(4);   // Aussie international dial-out prefix
  if(v.indexOf("00")===0)return v.slice(2);     // international prefix used most everywhere else
  if(v.charAt(0)==="0")return DEFAULT_CC+v.slice(1);      // 04xx local mobile
  if(v.length===9&&v.charAt(0)==="4")return DEFAULT_CC+v; // 4xx typed without the 0
  // Already opens with a country code we recognise, at the right length, so leave it alone.
  // Without this a bare NZ number like 6421555123 gets 61 stuck on the front.
  if(FU_BARE_CC.some(c=>v.indexOf(c[0])===0&&(v.length-c[0].length)>=c[1]&&(v.length-c[0].length)<=c[2]))return v;
  if(v.length>=11)return v;                     // long enough to already include a country code
  return DEFAULT_CC+v;                          // short and local looking, assume home
}
// Pretty version for the card, so a saved number is readable at a glance.
function fuPhoneShow(v){
  const d=fuPhoneNorm(v);
  if(!d)return "";
  if(d.indexOf(DEFAULT_CC)===0&&d.length===11){
    const local="0"+d.slice(2);
    return local.charAt(1)==="4"
      ?local.slice(0,4)+" "+local.slice(4,7)+" "+local.slice(7)   // mobile 04xx xxx xxx
      :local.slice(0,2)+" "+local.slice(2,6)+" "+local.slice(6);  // landline 0x xxxx xxxx
  }
  // Overseas: whoever typed it already spaced it sensibly, so show it as written rather than
  // guessing at grouping rules that differ country to country. Just make sure it leads with +.
  const written=String(v||"").trim();
  if(written.charAt(0)==="+")return written;
  return "+"+d;
}

    (reb[k]=reb[k]||{})[o.who]=(reb[k][o.who]||0)+1;}));
  let bk=null,bn=0;
  Object.keys(reb).forEach(k=>{const n=Object.values(reb[k]).filter(c=>c>=3).length;if(n>bn){bn=n;bk=k;}});
  if(bk&&bn>=2)add("Stock up","3 pack of "+slLabel(S,bk),bn+" clients have bought it 3 or more times",[bk],[3]);
  // 3. a starter pack from the two products new clients most often start with together
  const firstO={};sold.forEach(o=>{const f=firstO[o.who];if(!f||o.d<f.d)firstO[o.who]=o;});
  const starts=Object.values(firstO),fp={};
  starts.forEach(o=>{const ks=Object.keys(o.items).filter(k=>price(k)>0&&!slIsBac(S.prod[k]||{})).sort();
    for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const pk=ks[i]+"~"+ks[j];fp[pk]=(fp[pk]||0)+1;}});
  const tp=Object.entries(fp).filter(e=>e[1]>=2&&!used[e[0]]).sort((a,b)=>b[1]-a[1])[0];
  if(tp){const ab=tp[0].split("~").sort((x,z)=>price(z)-price(x));
    add("Starter","Starter pack: "+slLabel(S,ab[0])+" + "+slLabel(S,ab[1]),tp[1]+" of "+starts.length+" new clients started with both",ab,[1,1]);}
  return out.slice(0,3);
}
/* Money in and money back, all time, on the same figures the Overview uses. Money in is lab
   orders plus expenses, including the Overview's $200 a month consumables allowance since
   June 2026, when the Money tab stopped being kept. Money back is every paid order line, partners too. Free vials and
   anything cancelled or refunded are left out. */
function slMoney(){
  const d=D.dashboard||{},now=new Date();
  const lab=d.totalLabOrders||0,exp=(d.totalExpenses||0)+consumablesSoFar(now);
  let back=0;
  (D.orders||[]).forEach(x=>{
    if(String(x.freeVial||"").trim().toLowerCase()==="yes")return;
    if(/cancel|refund|void/i.test(String(x.fulfilment||"")+" "+String(x.payStatus||"")))return;
    back+=x.amountReceived||0;                       // already less any store credit used
  });
  let stock=d.invValue||0;
  if(!stock)(D.products||[]).forEach(p=>{stock+=(p.onHand||0)*(p.cost||0);});
  return {lab,exp,in:lab+exp,back,stock,owed:d.customerOwes||0};
}
/* The paid money numbers that used to sit on the Overview, worked out exactly as they were
   there: revenue is money actually received from paid orders, profit is after stock cost and
   store credit, and the averages run off the days since the first paid order. */
function salesSnapshot(){
  const o=D.orders||[],today=new Date();
  const paid=o.filter(x=>x.payStatus==="Paid"||x.payStatus==="Part Paid");
  const totalRevenue=paid.reduce((t,x)=>t+x.amountReceived,0),totalTrueProfit=paid.reduce((t,x)=>t+x.profit,0);
  let first=null;
  paid.forEach(x=>{const od=odObj(x.date);if(od&&(!first||od<first))first=od;});
  const daysTrading=first?Math.max(7,Math.round((today-first)/86400000)+1):7;
  const avgWeek=totalRevenue/(daysTrading/7),monthsTrading=daysTrading/30.44;
  const ownerNames=(D.partnerDetail||[]).map(x=>String(x.person||"").trim()).filter(Boolean);
  const ownerCount=Math.max(1,ownerNames.length);
  return {totalRevenue,totalTrueProfit,daysTrading,monthsTrading,avgWeek,avgMonth:totalRevenue/monthsTrading,
    ownerNames,ownerCount,perOwnerWeek:avgWeek/ownerCount,
    sinceStr:first?first.toLocaleDateString('en-AU',{month:'short',year:'numeric'}):"the start"};
}

/* ================= Referral store credit =================
 * The EARN page promises 2 referrals = $30, 3 = $50, 4 = a free vial and the count restarts.
 * Nothing in the system ever paid the dollars out, so the page contradicted its own terms.
 * This works the money out from the referral counts.
 *
 * Driven by REFERRAL COUNT, never by the "Free Vial? = Yes" flag. That flag marks any freebie
 * or replacement given out, so going off it would bank $50 nobody earned and would also wipe
 * real referral progress for anyone handed a goodwill vial.
 */
// STACKED: the 2nd referral pays $30, the 3rd pays another $50, so a full cycle banks $80.
const REF_TIER_2=30, REF_TIER_3=50, REF_CYCLE_CREDIT=REF_TIER_2+REF_TIER_3, CREDIT_CAP=200;
const PER_ORDER_CAP=100;   // most credit usable on any one order, matching the EARN terms
// Anyone on a 3 referral deal is listed in the hub script, so no names sit in this public file.
function refTargetFor(name){return ((D&&D.refTarget3)||[]).map(fuNorm).indexOf(fuNorm(fuShort(name)))>=0?3:4;}
// The referral tag carries a short name, and short names are not unique: two clients can share
// a first name. Matching on the short name alone paid the wrong one. So the tag is resolved
// against the real client list, and the referral chain inside it breaks the tie: the tag says
// which of the two came from which referrer.
function refWhoReferred(name){                              // who referred THIS person, short name
  const m=String(name||"").match(/\(\s*referral\s+(.+)\)\s*$/i);
  return m?fuNorm(fuShort(m[1])):"";
}
function refResolve(tag,clients){
  const tb=fuNorm(fuShort(tag));
  if(!tb)return "";
  const tagChain=refWhoReferred(tag);                       // eg "person c" out of "Person B (Referral Person C)"
  let best="",bestScore=-1;
  clients.forEach(full=>{
    const cb=fuNorm(fuShort(full));
    // The client name must BE the tag name or extend it on a word boundary, so a tag of "Sam"
    // can reach "Sam Smith" but can never grab "Samuel".
    if(cb!==tb && cb.indexOf(tb+" ")!==0)return;
    let sc=0;
    if(tagChain && refWhoReferred(full)===tagChain)sc+=4;    // same referral chain, strongest signal
    if(cb===tb)sc+=1;                                        // exact short name, weaker
    if(sc>bestScore){bestScore=sc;best=full;}
  });
  return best;
}
let _refCache=null,_refCacheFor=null;
function refCounts(){
  if(_refCache&&_refCacheFor===D)return _refCache;
  const seen={},clients=[];
  ((D&&D.orders)||[]).forEach(o=>{
    const nm=String(o.customer||"").trim(); if(!nm)return;
    const k=fuNorm(nm); if(seen[k])return;                  // once per person, not once per order row
    seen[k]=1; clients.push(nm);
  });
  const c={};
  clients.forEach(nm=>{
    if(!refWhoReferred(nm))return;
    const m=nm.match(/\(\s*referral\s+(.+)\)\s*$/i);       // greedy + anchored so nested tags parse
    const who=refResolve(m[1],clients);
    if(who)c[fuNorm(who)]=(c[fuNorm(who)]||0)+1;            // keyed on the FULL name, so the two Katies stay apart
  });
  _refCache=c;_refCacheFor=D;return c;
}
function refCountFor(name){return refCounts()[fuNorm(name)]||0;}
// Each completed cycle banks $80 ($30 at 2 plus $50 at 3), then the current part-cycle
// pays whatever it has reached so far. Milestones ADD, they do not replace each other.
function refCreditFor(name){
  const n=refCountFor(name), T=refTargetFor(name);
  const done=Math.floor(n/T), cyc=n-done*T;
  return done*REF_CYCLE_CREDIT+(cyc>=3?REF_TIER_2+REF_TIER_3:cyc>=2?REF_TIER_2:0);
}
// Manual credit adjustments: a "Bonus Credit ($)" column on the Dashboard points block.
// Type a dollar amount next to a person for gifts, overpayments or corrections (negatives
// allowed). If the column does not exist yet, this is just an empty map and nothing changes.
let _bonusCache=null,_bonusCacheFor=null;
function fuBonusMap(){
  if(_bonusCache&&_bonusCacheFor===D)return _bonusCache;
  // The Bonus tab: Name | Amount, typed by hand. Kept OFF the Dashboard points block on
  // purpose - that block re-sorts itself when new customers appear, so a typed value there
  // drifts onto whoever slides into the row. A separate tab cannot move under you.
  // Exact name wins; a short name (tags stripped) only pays when it matches one person.
  const m={},base={};
  ((D&&D.rawBonus)||[]).forEach(r=>{
    if(!r)return;
    const nm=String(r[0]||"").trim();
    if(!nm||/^name$/i.test(nm))return;
    const amt=num(r[1]);
    if(!amt&&String(r[1]||"").trim()!=="0")if(isNaN(parseFloat(String(r[1]))))return;
    const k=fuNorm(nm),b=fuNorm(fuBaseName(nm));
    m[k]=(m[k]||0)+amt;
    if(!base[b])base[b]={n:0,amt:0};
    base[b].n++;base[b].amt+=amt;
  });
  const out={exact:m,base:base};
  _bonusCache=out;_bonusCacheFor=D;return out;

function fuBonusFor(name){

    L.push("Total: "+fuMoney(t.total));
  }
  if(t.credit>0){
    L.push("Store credit: -"+fuMoney(t.credit));
    L.push("To pay: "+fuMoney(t.toPay));
    if(t.cr&&t.cr.available>t.credit)L.push("(You'll still have "+fuMoney(t.cr.available-t.credit)+" credit left after this)");
  }
  if(ocMode!=="cash"){
    const gap=OC_FREE_AT-t.sub;
    if(t.ship&&gap>0)L.push("","Add "+fuMoney(gap)+" more and postage is on us.");
  }
  return L.join("\n");
}
/* Totals for a what-if basket, so option B can be priced without touching the screen.
   extra = {sku:qty} added on top of what is already in the cart. */
function ocTotalsWith(extra){
  const keep=Object.assign({},ocQty);
  Object.keys(extra||{}).forEach(k=>ocQty[k]=(ocQty[k]||0)+extra[k]);
  const t=ocTotals();
  ocQty=keep;
  return t;
}
/* Same order, less credit, so there is a real amount to pay. */
function ocWithCredit(t,c){
  const credit=Math.max(0,Math.min(c,t.credit));
  return Object.assign({},t,{credit,toPay:t.total-credit,coversAll:false});
}
function ocCheapest(){
  let best=null;
  ocActive().forEach(p=>{const v=ocPrice(p);if(v>0&&(!best||v<best.v))best={v,sku:p.sku,label:ocLabel(p)};});
  return best;
}
/* The second thing to offer them, in order of what actually matters:
   1. the order breaks the terms, so it has to change
   2. free postage is within reach
   3. one more tier of credit is within reach
   4. nothing pressing, so show the cheapest top-up */
function ocOptionB(){
  const t=ocTotals();
  if(!t.lines.length)return null;
  const cheap=ocCheapest();
  if(!cheap)return null;

  if(t.coversAll){
    const usable=Math.min(t.pool,PER_ORDER_CAP);
    const need=Math.max(0,usable-t.sub+1);
    const n=Math.ceil(need/cheap.v);
    const extra={}; extra[cheap.sku]=n;
    return {why:"terms", n, cheap, t2:ocTotalsWith(extra),
            head:"Option 2 - add "+n+" x "+cheap.label+" and put the credit to work"};
  }
  if(ocMode!=="cash"&&t.ship>0){
    const gap=OC_FREE_AT-t.sub;
    if(gap>0){
      const n=Math.ceil(gap/cheap.v);
      const extra={}; extra[cheap.sku]=n;
      return {why:"postage", n, cheap, t2:ocTotalsWith(extra),
              head:"Option 2 - add "+n+" x "+cheap.label+" and postage is free"};
    }
  }
  const ms=ocMonthSpend(), nt=ptsNext(ms+t.sub);
  if(nt){
    const gap=nt.min-(ms+t.sub);
    if(gap>0&&gap<=120){
      const n=Math.ceil(gap/cheap.v);
      const extra={}; extra[cheap.sku]=n;
      return {why:"tier", n, cheap, nt, t2:ocTotalsWith(extra),
              head:"Option 2 - add "+n+" x "+cheap.label+" and earn $"+nt.pts+" credit"};
    }
  }
  const extra={}; extra[cheap.sku]=1;
  return {why:"topup", n:1, cheap, t2:ocTotalsWith(extra),
          head:"Option 2 - add 1 x "+cheap.label};
}
/* Two options for the client, and BOTH must be allowed. If the basket as it stands
   breaks the terms, option 1 becomes the fixed version rather than the broken one. */
function ocSummaryBoth(){
  const t=ocTotals();
  if(!t.lines.length)return "";
  const b=ocOptionB();

  let aT=t, aHead="Option 1", lead="", why="";
  /* Opener. If they have real credit banked, say well done for it, because they earned it.
     Then point them at the terms on their own rewards page so the rules come from there
     rather than from us telling them what they cannot do. */
  const bank=(t.cr&&t.cr.available)||0;
  const link=ocCust?earnLink(ocCust):"";   // blank until that customer has a key on the sheet
  const hi=ocCust?("Hey "+fuFirst(ocCust)+"!"):"Hey!";
  let praise="";
  if(bank>=100)      praise=" You have built up "+fuMoney(bank)+" in credit now, which is a solid effort, thank you for sticking with us.";
  else if(bank>=50)  praise=" Nice work getting your credit up to "+fuMoney(bank)+".";
  else if(bank>0)    praise=" You have "+fuMoney(bank)+" credit sitting there ready to go.";
  if(t.coversAll){
    const legal=Math.max(0,t.sub-OC_MIN_PAY);
    aT=ocWithCredit(t,legal);
    aHead = legal>0 ? "Option 1 - use "+fuMoney(legal)+" credit, pay "+fuMoney(aT.toPay)
                    : "Option 1 - pay this one in full and keep your credit";
    lead=hi+praise+" Credit is meant to sit alongside an order rather than cover one on its own, so here are two ways that work for this one:";
  }else{
    lead=hi+praise+" Two ways to do this:";
  }
  const tail=link?"\n\nAll the rewards rules are on your points page under Rewards and Referrals Terms if you ever want a look: "+link:"";
  if(!b) return lead+"\n\n"+ocSummary(aT)+tail;

  if(t.coversAll){
    const saving=aT.toPay-b.t2.toPay;
    why="Option 2 gets you "+b.n+" more "+b.cheap.label+
        (saving>0?" and you actually pay "+fuMoney(saving)+" less":"")+", since more of your credit gets used.";
  }else{
    why = b.why==="postage" ? "Option 2 gets you free postage."
        : b.why==="tier"    ? "Option 2 tips you past $"+b.nt.min+" for the month, so you bank $"+b.nt.pts+" credit."
        : "Option 2 if you want to grab one more while it is going out.";
  }
  return lead+"\n\n"+
         aHead+"\n"+ocSummary(aT)+"\n\n----------\n\n"+
         b.head+"\n"+ocSummary(b.t2)+"\n\n"+why+tail;
}
function ocCopy(btn,which){
