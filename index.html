/* ================= GST & Bank =================
 * Bank transfers only (Payment Method = "Bank transfer"), split across two accounts by a
 * switch date. Each account carries its own tax bracket, since account 1 is closed and may
 * sit in a different band to whatever account 2 ends up doing.
 * Counts money actually IN: needs Completed (col S) AND Paid (col P).
 */
const GST_THRESHOLD=75000;
const TAX_KEY_A1="peps_tax_bracket_a1_v2";
const TAX_KEY_A2="peps_tax_bracket_a2_v2";
const GST_BASIS_KEY="peps_gst_basis_v1";
const GST_SWITCH_KEY="peps_gst_switch_v2";
const GST_SWITCH_DEFAULT="2026-07-16";   // the day account 2 opened
// FY2026-27 resident rates (the 16% step dropped to 15% on 1 Jul 2026). Medicare levy is separate.
const TAX_BRACKETS=[
  {l:"0%",r:0,upTo:18200,band:"$0 - $18,200"},
  {l:"15%",r:.15,upTo:45000,band:"$18,201 - $45,000"},
  {l:"30%",r:.30,upTo:135000,band:"$45,001 - $135,000"},
  {l:"37%",r:.37,upTo:190000,band:"$135,001 - $190,000"},
  {l:"45%",r:.45,upTo:Infinity,band:"$190,001 +"}
];
// Defaults set per account, NOT auto-picked off this business alone. PEPS income stacks
// on Fund One etc, so the first dollar is never taxed at 0% - auto-picking by amount would
// show a $0 set-aside, the worst way to be wrong. Click a rate to override; it sticks.
const TAX_DEF_A1=TAX_BRACKETS[2];   // 30%
const TAX_DEF_A2=TAX_BRACKETS[3];   // 37%
function taxGet(key,def){try{const v=localStorage.getItem(key);const f=v?TAX_BRACKETS.find(b=>b.l===v):null;return f||def;}catch(e){return def;}}
function taxSetA1(l){try{localStorage.setItem(TAX_KEY_A1,l);}catch(e){}rGst();}
function taxSetA2(l){try{localStorage.setItem(TAX_KEY_A2,l);}catch(e){}rGst();}
function gstBasis(){try{return localStorage.getItem(GST_BASIS_KEY)||"transfers";}catch(e){return "transfers";}}
function gstSetBasis(b){try{localStorage.setItem(GST_BASIS_KEY,b);}catch(e){}rGst();}
function gstSwitchISO(){try{return localStorage.getItem(GST_SWITCH_KEY)||GST_SWITCH_DEFAULT;}catch(e){return GST_SWITCH_DEFAULT;}}
function gstSetSwitch(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||""))return;try{localStorage.setItem(GST_SWITCH_KEY,v);}catch(e){}rGst();}
function gstSwitchDate(){const m=gstSwitchISO().match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(2026,6,16);}
function gstDayLabel(d){return d.toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"});}

function rGst(){
  // Money actually in: order fulfilled (col S) AND payment landed (col P). Col S alone is
  // only about goods going out — "Completed" with the transfer still missing is not income.
  // Trimmed both sides: fulfilment comes off the sheet untrimmed, so a stray space in
  // col S would silently drop the order out of tax and GST entirely.
  const gstOK=o=>String(o.fulfilment||"").trim()==="Completed"&&String(o.payStatus||"").trim()==="Paid"&&o.ownerPurchase!=="Yes";
  const sales=(D.orders||[]).filter(gstOK);
  const isTransfer=o=>String(o.payMethod||"").trim().toLowerCase()==="bank transfer";
  const transfers=sales.filter(isTransfer);
  const sw=gstSwitchDate();sw.setHours(0,0,0,0);

  // Split by account. Track money in, profit after lab cost, and vials shipped.
  // o.profit is what was actually paid minus (lab cost × qty), derived off the sheet's
  // "Total after COGS" — so the cost holds whatever price tier they ended up paying.
  // Deliberately NOT the sheet's own Profit column: that one is just Total after COGS,
  // so it ignores cash/owner pricing and books a free vial at zero instead of at cost.
  let a1=0,a2=0,n1=0,n2=0,gp1=0,gp2=0,q1=0,q2=0;
  transfers.forEach(o=>{
    const d=odObj(o.date),amt=(o.lineTotal||0)-(o.creditUsed||0),prof=o.profit||0,qty=o.qty||0;
    if(d&&d<sw){a1+=amt;gp1+=prof;q1+=qty;n1++;}else{a2+=amt;gp2+=prof;q2+=qty;n2++;}
  });
  const tAmt=a1+a2;
  const allAmt=sales.reduce((s,o)=>s+(o.lineTotal||0)-(o.creditUsed||0),0);
  const lab1=a1-gp1,lab2=a2-gp2;

  // Packaging — per-vial figure off the COGS tab. Lab cost is already out via o.profit,
  // packaging isn't, so it comes off here.
  const perVial=(D.cogs&&D.cogs.perVial)||0;
  const pk1=q1*perVial,pk2=q2*perVial;

  // Running costs are NOT deducted. Money_Movements stopped being updated, so summing it
  // would quietly read zero, and the Dashboard's Total Expenses is one undated lifetime
  // figure — no honest way to split that across two separate entities. Left out on
  // purpose: it pushes the set-aside high, which is the safe direction to be wrong in.

  // Tax lands on what's left, not on turnover. Negative profit = nothing to set aside.
  const np1=gp1-pk1,np2=gp2-pk2;
  const b1=taxGet(TAX_KEY_A1,TAX_DEF_A1),b2=taxGet(TAX_KEY_A2,TAX_DEF_A2);
  const tax1=Math.max(0,np1)*b1.r,tax2=Math.max(0,np2)*b2.r;

  // Account 2 is a separate entity, so its GST threshold runs on its own turnover only —
  // nothing from account 1's entity carries across.
  const allFrom=sales.reduce((s,o)=>{const d=odObj(o.date);return s+((!d||d>=sw)?(o.lineTotal||0)-(o.creditUsed||0):0);},0);
  const basis=gstBasis(),onT=basis==="transfers";
  const counted=onT?a2:allFrom;
  const toGo=GST_THRESHOLD-counted;
  const pct=Math.min(100,Math.max(0,counted/GST_THRESHOLD*100));

  // Projection: at the rate this entity has been selling since it started, when does it hit $75k?
  const gstNow=new Date();gstNow.setHours(0,0,0,0);
  const gstDays=Math.max(1,Math.round((gstNow-sw)/86400000)+1);   // days trading so far (today counts)
  const gstPerDay=counted/gstDays;
  const gstPerMonth=gstPerDay*30.44;
  let projLine="";
  if(counted>=GST_THRESHOLD){
    projLine='<div class="gst-proj" style="color:var(--red)">Already over the $75,000 threshold.</div>';
  }else if(gstPerDay>0){
    const daysLeft=toGo/gstPerDay;
    const hit=new Date(gstNow.getTime()+daysLeft*86400000);
    const yrs=daysLeft/365.25;
    const when=yrs>=3
      ? "not for years at this rate"
      : "around "+hit.toLocaleDateString("en-AU",{month:"long",year:"numeric"});
    const mLeft=daysLeft/30.44;
    const howLong=mLeft>=12?(Math.round(mLeft/12*10)/10)+" years away":Math.round(mLeft)+" months away";
    projLine='<div class="gst-proj">On track to reach $75,000 <b>'+when+'</b>'+
      (yrs<3?', about '+howLong:'')+'. Selling <b>'+fuMoney(gstPerMonth)+'</b> a month so far'+
      (gstDays<45?' (only '+gstDays+' days in, so this will settle down)':'')+'.</div>';
  }else{
    projLine='<div class="gst-proj">No sales counted yet, so there is nothing to project from.</div>';
  }
  const mkBtns=(cur,fn)=>TAX_BRACKETS.map(x=>'<button class="gst-t'+(x.l===cur.l?" on":"")+'" onclick="'+fn+'(\''+x.l+'\')" title="'+x.band+'">'+x.l+'</button>').join("");
  const bandRef=TAX_BRACKETS.map(x=>'<div class="gst-band'+((x.l===b1.l||x.l===b2.l)?" on":"")+'"><span class="gst-band-r">'+x.l+'</span><span class="gst-band-b">'+x.band+'</span></div>').join("");
  const before=new Date(sw.getTime()-86400000);

  // Working — every step from money in to money set aside, so none of it is a black box.
  const wr=(lbl,v1,v2,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td>'+lbl+'</td><td>'+fuMoney(v1)+'</td><td>'+fuMoney(v2)+'</td><td>'+fuMoney(v1+v2)+'</td></tr>';
  const wd=(lbl,v1,v2)=>'<tr><td>'+lbl+'</td><td class="neg">-'+fuMoney(v1)+'</td><td class="neg">-'+fuMoney(v2)+'</td><td class="neg">-'+fuMoney(v1+v2)+'</td></tr>';
  const working=
    '<table class="gst-work"><thead><tr><th></th><th>Account 1</th><th>Account 2</th><th>Both</th></tr></thead><tbody>'+
      wr("Transfers in",a1,a2)+
      wd("Less lab cost",lab1,lab2)+
      wd("Less packaging"+(perVial?' &middot; '+fuMoney(perVial)+'/vial':''),pk1,pk2)+
      '<tr class="gap"><td>Less running costs</td><td colspan="3">not deducted &middot; not tracked in the sheet</td></tr>'+
      wr("Taxable profit",np1,np2,"sum")+
      '<tr class="rate"><td>Bracket</td><td>'+b1.l+'</td><td>'+b2.l+'</td><td>—</td></tr>'+
      wr("Set aside",tax1,tax2,"fin")+
    '</tbody></table>';

  document.getElementById("sec-gst").innerHTML=
    '<div class="sh"><h2>GST &amp; Bank</h2><span class="badge">'+transfers.length+' TRANSFERS</span></div>'+
    '<div class="mg mg3" style="margin-bottom:14px">'+
      '<div class="mc"><div class="mc-l">Account 1 · closed</div><div class="mc-v cm">'+fuMoney(a1)+'</div><div class="mc-s">'+n1+' transfers up to '+gstDayLabel(before)+' · profit '+fuMoney(np1)+' · tax '+b1.l+' = <b style="color:var(--amber)">'+fuMoney(tax1)+'</b></div></div>'+
      '<div class="mc" style="border-color:var(--green)"><div class="mc-l">Account 2 · live</div><div class="mc-v cm" style="color:var(--green)">'+fuMoney(a2)+'</div><div class="mc-s">'+n2+' transfers from '+gstDayLabel(sw)+' · profit '+fuMoney(np2)+' · tax '+b2.l+' = <b style="color:var(--amber)">'+fuMoney(tax2)+'</b></div></div>'+
      '<div class="mc" style="border-color:var(--amber)"><div class="mc-l">Tax set aside · both</div><div class="mc-v cm" style="color:var(--amber)">'+fuMoney(tax1+tax2)+'</div><div class="mc-s">on '+fuMoney(np1+np2)+' of profit, off '+fuMoney(tAmt)+' of transfers</div></div>'+
    '</div>'+
    '<div class="gst-reg"><span>Account 2 opened:</span>'+
      '<input type="date" class="gst-date" value="'+gstSwitchISO()+'" onchange="gstSetSwitch(this.value)">'+
      '<span class="gst-owed">Anything dated before this sits in account 1.</span></div>'+
    '<div class="gst-reg" style="margin-top:8px"><span style="min-width:150px">Account 1 bracket:</span>'+mkBtns(b1,"taxSetA1")+
      '<span class="gst-owed">'+fuMoney(np1)+' profit × '+b1.l+' = <b>'+fuMoney(tax1)+'</b></span></div>'+
    '<div class="gst-reg" style="margin-top:8px"><span style="min-width:150px">Account 2 bracket:</span>'+mkBtns(b2,"taxSetA2")+
      '<span class="gst-owed">'+fuMoney(np2)+' profit × '+b2.l+' = <b>'+fuMoney(tax2)+'</b></span></div>'+
    '<div class="gst-thresh" style="margin-top:12px">'+
      '<div class="gst-th-h">How the set-aside is built</div>'+
      working+
      '<div class="gst-note">On <b>profit</b>, not turnover. Completed and Paid orders only, owner purchases out. Reads a little high - deductibles like running costs and postage aren\'t taken out.</div>'+
    '</div>'+
    '<div class="gst-thresh" style="margin-top:12px">'+
      '<div class="gst-th-h">Where the brackets kick in - FY2026-27 (1 Jul 2026 - 30 Jun 2027)</div>'+
      '<div class="gst-bands">'+bandRef+'</div>'+
      '<div class="gst-note">Set by hand - pick the rate your <i>next</i> dollar of profit is taxed at, across all your income. +2% Medicare.</div>'+
    '</div>'+
    '<div class="gst-thresh" style="margin-top:12px">'+
      '<div class="gst-th-h">GST threshold - $75,000 · new entity, from '+gstDayLabel(sw)+'</div>'+
      '<div class="gst-reg" style="border:0;background:transparent;padding:0 0 10px 0">'+
        '<span>Count:</span>'+
        '<button class="gst-t'+(onT?" on":"")+'" onclick="gstSetBasis(\'transfers\')">Transfers only</button>'+
        '<button class="gst-t'+(!onT?" on":"")+'" onclick="gstSetBasis(\'all\')">All sales</button>'+
      '</div>'+
      '<div class="gst-bar-l">'+(onT?"Bank transfers":"All sales")+': <b>'+fuMoney(counted)+'</b> of $75,000 ('+pct.toFixed(0)+'%), '+
        (toGo>0?'<b style="color:var(--blue)">'+fuMoney(toGo)+'</b> to go':'<b style="color:var(--red)">'+fuMoney(-toGo)+'</b> over')+'</div>'+
      '<div class="gst-bar"><div class="gst-fill" style="width:'+pct+'%;background:'+(counted>=GST_THRESHOLD?"var(--red)":"var(--blue)")+'"></div></div>'+
      projLine+
      '<div class="gst-note">Account 2\'s own $75k, from '+gstDayLabel(sw)+'. Gross turnover, separate from Account 1.'+
        (onT?' All sales here total <b>'+fuMoney(allFrom)+'</b>.':' Bank transfers are <b>'+fuMoney(a2)+'</b>.')+'</div>'+
    '</div>';
}

function rFollowups(){
  const today=new Date();today.setHours(0,0,0,0);
  const DAY=86400000;
  const baseOverride=fuGetBase();
  const owners=fuGetOwners();
  // Sell prices by SKU and by product name (for the reorder cost summary)
  // Two price lists, same as the Order Calculator: transfer uses "Customer Cost",
  // cash uses the cheaper "Cash Price". Which one a client is quoted depends on how
  // they actually pay us.
  const priceBySku={},priceByName={},cashBySku={},cashByName={};
  (D.products||[]).forEach(p=>{
    const sk=String(p.sku||"").trim().toLowerCase(), nm=String(p.name||"").trim().toLowerCase();
    if(sk){priceBySku[sk]=p.netPrice;cashBySku[sk]=p.cashPrice||p.netPrice;}
    if(nm){priceByName[nm]=p.netPrice;cashByName[nm]=p.cashPrice||p.netPrice;}
  });
  // Bac water for the upsell (always shown as "Bac Water" — the sheet name is too clunky for a text)
  let bacPrice=0,bacCash=0;const bacName="Bac Water";
  (D.products||[]).forEach(p=>{if(/bacteriostatic|bac\s*water/i.test(String(p.name||""))){if(p.netPrice)bacPrice=p.netPrice;if(p.cashPrice||p.netPrice)bacCash=p.cashPrice||p.netPrice;}});
  const POSTAGE=12;        // express postage on transfer orders
  const POST_FREE_AT=199;  // transfer orders at or above this get free postage

  // How each client usually pays. Most recent order wins, since that's how they pay now.
  const payByCust={};
  (function(){
    const seen={};
    D.orders.forEach(o=>{
      const nm=String(o.customer||"").trim();if(!nm)return;
      const m=String(o.payMethod||"").trim();if(!m)return;
      const od=odObj(o.date);
      if(!seen[nm]||(od&&od>=seen[nm])){seen[nm]=od||seen[nm];payByCust[nm]=m;}
    });
  })();
  const isCashClient=n=>/^cash$/i.test(String(payByCust[String(n||"").trim()]||"").trim());
  // ---- Rewards context, mirroring what the client sees on their EARN page ----
  // Store credit comes off the Dashboard tab (same source the Points tab reads).
  const creditMap={};
  (function(){
    const dash=D.rawDashboard||[];
    let hr=-1,creditCol=-1,personCol=0;
    for(let i=0;i<dash.length;i++){
      const row=dash[i]||[];
      const ci=row.findIndex(c=>String(c||"").trim().toLowerCase()==="credit balance ($)");
      if(ci>=0){hr=i;creditCol=ci;const pi=row.findIndex(c=>String(c||"").trim().toLowerCase().startsWith("person"));personCol=pi>=0?pi:0;break;}
    }
    if(hr<0)return;
    for(let i=hr+1;i<dash.length;i++){
      const row=dash[i]||[];
      const nm=String(row[personCol]||"").trim();
      if(!nm)continue;
      creditMap[fuNorm(nm)]=num(row[creditCol]);
    }
  })();
  const nowD=new Date();const curY=nowD.getFullYear(),curM=nowD.getMonth();
  const monthSpend={},vialCount={},refCount={},seenCust={},creditUsedBy={};
  D.orders.forEach(o=>{
    const nm=String(o.customer||"").trim();if(!nm)return;
    const k=fuNorm(nm);
    creditUsedBy[k]=(creditUsedBy[k]||0)+(num(o.creditUsed)||0);
    // A bac water thrown in is a goodwill freebie, not the referral-reward vial, so it must
    // not eat anyone's referral cycle. Same rule the EARN page applies.
    if(String(o.freeVial||"").trim().toLowerCase()==="yes"&&!/bacteriostatic|bac\s*water/i.test(String(o.product||"")))vialCount[k]=(vialCount[k]||0)+Math.max(1,num(o.qty)||1); // count units, not rows: Qty 2 on one line is two vials
    if(String(o.fulfilment||"").trim().toLowerCase()==="completed"){
      const d=odObj(o.date);
      if(d&&d.getFullYear()===curY&&d.getMonth()===curM)monthSpend[k]=(monthSpend[k]||0)+o.lineTotal;
    }
    // Referrals: a client tagged "(Referral X)" counts once toward X. Greedy + anchored so nested tags parse.
    if(!seenCust[k]){
      seenCust[k]=1;
      const m=nm.match(/\(\s*referral\s+(.+)\)\s*$/i);
      if(m){const r=fuNorm(fuShort(m[1]));if(r)refCount[r]=(refCount[r]||0)+1;}
    }
  });
  // Group orders by customer → latest order date + product set (with SKUs for pricing)
  // The sheet stamps column A with the day a row is marked Completed, so on a completed row
  // the date is the day they got it. That is when their supply clock starts. An order still
  // Pending, Packed or Sent only carries the day they ordered, so it never starts the clock,
  // and anyone waiting on one is left alone until it is marked Completed. Cancelled or
  // refunded orders never happened, so they count for nothing.
  const byCust={},openBy={};
  D.orders.forEach(o=>{
    const name=String(o.customer||"").trim();if(!name)return;
    const st=String(o.fulfilment||"").trim().toLowerCase();
    if(/cancel|refund|void/i.test(st+" "+String(o.payStatus||"")))return;
    const od=odObj(o.date);
    if(st!=="completed"){
      const nk=fuNorm(name),w=openBy[nk]||(openBy[nk]={name,since:od});
      if(od&&(!w.since||od<w.since))w.since=od;
      return;
    }
    if(!byCust[name])byCust[name]={name,latest:od,lastStr:o.date,products:new Set(),skuByProd:{}};
    if(o.product){byCust[name].products.add(o.product);if(o.sku)byCust[name].skuByProd[o.product]=o.sku;}
    if(od&&(!byCust[name].latest||od>byCust[name].latest)){byCust[name].latest=od;byCust[name].lastStr=o.date;}
  });
  const all=Object.values(byCust).map(c=>{
    // Cash clients get cash pricing and never pay postage; everyone else gets
    // transfer pricing with express postage (free once the order is big enough).
    const lastPaid=isCashClient(c.name)?"cash":"transfer";
    const pick=fuPayPick[fuNorm(c.name)];
    const payCash=(pick?pick:lastPaid)==="cash";
    const pSku=payCash?cashBySku:priceBySku, pName=payCash?cashByName:priceByName;
    const aSku=payCash?priceBySku:cashBySku, aName=payCash?priceByName:cashByName;  // the other option
    const bacP=payCash?bacCash:bacPrice, bacA=payCash?bacPrice:bacCash;
    // Baseline = manual override if set, else last order date
    const ov=baseOverride[fuNorm(c.name)]?new Date(baseOverride[fuNorm(c.name)]):null;
    const baseDate=ov||c.latest;
    const adjusted=!!ov;
    // A baseline later than their last order can only come from a button press, so it means
    // we have chased this person since they last bought. That is the "reminded already" flag.
    const chased=!!(ov&&c.latest&&ov>c.latest);
    const daysSinceOrder=c.latest?Math.floor((today-c.latest)/DAY):null;
    // Per-product run-out from baseline (Bac Water excluded — not a treatment)
    const prodObjs=[...c.products].map(p=>{
      const sku=(c.skuByProd&&c.skuByProd[p])?String(c.skuByProd[p]).trim().toLowerCase():"";
      const price=(pSku[sku]!=null)?pSku[sku]:(pName[String(p).trim().toLowerCase()]||0);
      const altPrice=(aSku[sku]!=null)?aSku[sku]:(aName[String(p).trim().toLowerCase()]||0);
      const key=fuProdKey(p);
      if(key===null)return {name:p,treat:false,price,altPrice};
      const dur=fuProdDays(key);
      const runOut=baseDate?new Date(baseDate.getTime()+dur*DAY):null;
      const daysLeft=runOut?Math.round((runOut-today)/DAY):null;
      return {name:p,treat:true,key,dur,runOut,daysLeft,price,altPrice};
    });
    const treatments=prodObjs.filter(p=>p.treat&&p.daysLeft!==null);
    treatments.sort((a,b)=>a.daysLeft-b.daysLeft);
    const soonest=treatments[0]||null;
    // Colour stage from soonest days-of-supply left
    let stage="green";
    if(soonest){
      if(soonest.daysLeft<=FU_RED_DAYS)stage="red";
      else if(soonest.daysLeft<=FU_AMBER_DAYS)stage="amber";
      else stage="green";
    }
    const activeLabels=treatments.map(t=>fuShort(t.name));
    const soonLabel=soonest?fuShort(soonest.name):"order";
    const allLabel=activeLabels.length?fuJoin(activeLabels):"order";
    // What they'd reorder = treatments running low, priced up, + bac water + postage
    const lowItems=treatments.filter(t=>t.daysLeft<=FU_QUOTE_DAYS).map(t=>({label:fuShort(t.name),price:t.price||0,altPrice:t.altPrice||0,daysLeft:t.daysLeft}));
    const itemsCost=lowItems.reduce((s,it)=>s+(it.price||0),0);
    // total = what they pay (stock + bac water + postage). pointsTotal = stock only — postage never earns points.
    const stockCost=lowItems.length?(itemsCost+(bacP||0)):0;
    const post=(!lowItems.length||payCash)?0:(stockCost>=POST_FREE_AT?0:POSTAGE);
    // For a cash client, what the same order would cost on transfer with express post,
    // so the message can offer it without them having to ask.
    const altStock=lowItems.length?(lowItems.reduce((s,it)=>s+(it.altPrice||0),0)+(bacA||0)):0;
    const altPost=(!lowItems.length||!payCash)?0:(altStock>=POST_FREE_AT?0:POSTAGE);
    const cost={items:lowItems,bacName,bacPrice:bacP,postage:post,cash:payCash,
                total:lowItems.length?(stockCost+post):0,pointsTotal:stockCost,
                altTotal:lowItems.length?(altStock+altPost):0,altPost,lastPaid,mode:payCash?"cash":"transfer"};
    // Rewards state: credit balance, free vial waiting, how many referrals off the next vial
    const ck=fuNorm(c.name),cleanK=fuNorm(fuShort(c.name));
    const refs=refCountFor(c.name);                     // resolver-based, matches Points and EARN
    const T=refTargetFor(c.name);                       // 3 referrals for anyone on that deal, everyone else 4
    // Only vials their referrals could actually have earned count against the cycle. A
    // goodwill vial Jordy gave out must not wipe real referral progress. Same maths as EARN.
    const vialsGot=Math.min(vialCount[ck]||0,Math.floor(refs/T));
    const pendingVial=Math.max(0,Math.floor(refs/T)-vialsGot);
    const cycleRefs=Math.max(0,refs-vialsGot*T);
    // creditMap is the gross balance off the sheet. Quoting that in a message overstates it
    // for anyone who has already spent some, so subtract what they have used and add the
    // referral credit they were owed but never paid.
    const cr=creditFor(c.name,creditMap[ck]||0,creditUsedBy[ck]||0);
    const rew={credit:cr.available,refCredit:cr.referral,pendingVial,toVial:T-cycleRefs,refTarget:T,cycleRefs,monthSpend:monthSpend[ck]||0};
    return {
      name:c.name,stage,lastStr:c.lastStr,daysSinceOrder,baseDate,adjusted,chased,waiting:!!openBy[fuNorm(c.name)],
      products:prodObjs,soonest,isOwner:!!owners[ck],rew,cost,
      msg:fuMsg(stage,fuFirst(c.name),soonLabel,allLabel,cost,rew)+(earnLink(c.name)?"\n\nOh and here is your points and rewards page whenever you want it: "+earnLink(c.name):""),
      quietMsg:fuQuietMsg(fuFirst(c.name),fuNiceList(activeLabels),rew,earnLink(c.name))
    };
  });
  const tracked=all.filter(c=>!c.isOwner&&!c.waiting);   // waiting on an order = not due for anything
  fuOwnerList=all.filter(c=>c.isOwner);
  const nRed=tracked.filter(x=>x.stage==="red").length;
  const nAmber=tracked.filter(x=>x.stage==="amber").length;
  const nGreen=tracked.filter(x=>x.stage==="green").length;
  // Visible list = only who needs chasing (red + amber). Green = freshly stocked, hidden until due again.
  fuList=tracked.filter(c=>c.stage!=="green");
  const ordr={red:0,amber:1,green:2};
  fuList.sort((a,b)=>{
    if(ordr[a.stage]!==ordr[b.stage])return ordr[a.stage]-ordr[b.stage];
    const al=a.soonest?a.soonest.daysLeft:9999,bl=b.soonest?b.soonest.daysLeft:9999;
    return al-bl;
  });
  // Gone quiet: a month or more with no order, already chased since then, not already on the
  // reorder list above (no point messaging the same person twice), and not pushed recently.
  const nudgeMap=fuGetNudge();
  fuQuietList=tracked.filter(c=>{
    if(c.daysSinceOrder==null||c.daysSinceOrder<FU_QUIET_DAYS)return false;
    if(!c.chased)return false;
    if(fuList.indexOf(c)>=0)return false;
    const nd=nudgeMap[fuNorm(c.name)];
    if(nd){const dn=new Date(nd);if(!isNaN(dn.getTime())&&Math.floor((today-dn)/DAY)<FU_NUDGE_SNOOZE)return false;}
    return true;
  }).sort((a,b)=>b.daysSinceOrder-a.daysSinceOrder);
  // Who is waiting on an order, longest first, so nobody drops off the list without a reason.
  // Open for over three weeks usually means it arrived and was never marked Completed.
  const WAIT_LONG=21;
  const waitList=Object.keys(openBy).map(k=>openBy[k]).filter(w=>!owners[fuNorm(w.name)]&&!ptsHidden(w.name))
    .map(w=>({name:w.name,days:w.since?Math.max(0,Math.floor((today-w.since)/DAY)):0}))
    .sort((a,b)=>b.days-a.days);
  const waitNote=waitList.length
    ?'<div class="fu-wait" style="font-size:11px;color:var(--dim);margin:-6px 0 12px;line-height:1.55"><b style="color:var(--cyan)">Waiting on their order, not chasing yet:</b> '+
      waitList.map(w=>'<span style="color:'+(w.days>WAIT_LONG?'var(--amber)':'var(--fg)')+'">'+esc(fuBaseName(w.name))+', '+w.days+(w.days===1?' day':' days')+'</span>').join('. ')+
      '. Their clock starts when the order is marked Completed.'+
      (waitList.some(w=>w.days>WAIT_LONG)?' <span style="color:var(--amber)">Amber has been open over '+WAIT_LONG+' days, mark it Completed once they have it.</span>':'')+'</div>'
    :'';
  // Phone coverage across everyone on either list, so a name that does not line up with the
  // Contacts tab is obvious rather than just quietly showing "add number".
  const phoneNeeded=fuList.concat(fuQuietList);
  const phoneMissing=phoneNeeded.filter(c=>!fuPhoneFor(c.name).num).map(c=>c.name);
  const badList=(D.badPhones||[]);
  const badNote=badList.length
    ?'<div style="font-size:11px;color:var(--red);margin:-6px 0 12px">'+badList.length+' number'+(badList.length===1?" was":"s were")+' damaged in the sheet and ignored, and there is no good number for these people anywhere: <span style="color:var(--amber)">'+esc(badList.slice(0,5).join(", "))+(badList.length>5?" and "+(badList.length-5)+" more":"")+'</span>. Retype them in Contacts with the column set to plain text, or tap their WhatsApp button.</div>'
    :'';
  const phoneNote=phoneNeeded.length
    ?(phoneMissing.length
      ?'<div style="font-size:11px;color:var(--dim);margin:-6px 0 12px">Numbers found for '+(phoneNeeded.length-phoneMissing.length)+' of '+phoneNeeded.length+' on these lists. No match in Contacts for: <span style="color:var(--amber)">'+esc(phoneMissing.slice(0,6).join(", "))+(phoneMissing.length>6?" and "+(phoneMissing.length-6)+" more":"")+'</span>. Tap their WhatsApp button to type one in.</div>'
      :'<div style="font-size:11px;color:var(--dim);margin:-6px 0 12px">Numbers found for everyone on these lists.</div>')
    :'';
  const labels={red:"Reorder due",amber:"Due soon",green:"On track"};
  const cards=fuList.map((c,i)=>{
    const chips=c.products.map(p=>{
      if(!p.treat)return '<span class="fu-chip fu-chip-mut">'+esc(fuShort(p.name))+'</span>';
      let cls="fu-chip-ok";
      if(p.daysLeft<=FU_RED_DAYS)cls="fu-chip-due";
      else if(p.daysLeft<=FU_AMBER_DAYS)cls="fu-chip-soon";
      const leftTxt=p.daysLeft<=0?"out now":p.daysLeft+"d left";
      return '<span class="fu-chip '+cls+'">'+esc(fuShort(p.name))+' · ~'+fuWeeks(p.dur)+' · '+leftTxt+'</span>';
    }).join("");
    const metaBits=[];
    if(c.lastStr)metaBits.push("Last order: "+sDate(c.lastStr)+(c.daysSinceOrder!=null?" · "+c.daysSinceOrder+"d ago":""));
    if(c.soonest&&c.soonest.runOut)metaBits.push("Needs more ~"+fuFmtDate(c.soonest.runOut));
    if(c.adjusted)metaBits.push("timer adjusted");
    const pinfo=fuPhoneFor(c.name);
    const ph=pinfo.num;
    const actions=
      '<button class="fu-btn fu-btn-wa" onclick="fuWhats('+i+')" title="'+(ph?'Open WhatsApp to '+esc(fuPhoneShow(ph))+' with this message ready to send':'Add their mobile, then open WhatsApp')+'">'+(ph?'WhatsApp':'WhatsApp · add number')+'</button>'+
      (ph?'<button class="fu-btn fu-btn-num" onclick="fuPhoneEdit('+i+')" title="Change or remove this number">'+esc(fuPhoneShow(ph))+'</button>':'')+
      (c.cost&&c.cost.items&&c.cost.items.length
        ? '<span class="fu-pay" title="How this quote is priced. Defaults to however they paid last time.">'+
            '<button class="fu-btn fu-btn-pay'+(c.cost.mode==="cash"?" on":"")+'" onclick="fuSetPay('+i+',&quot;cash&quot;)">Cash</button>'+
            '<button class="fu-btn fu-btn-pay'+(c.cost.mode==="transfer"?" on":"")+'" onclick="fuSetPay('+i+',&quot;transfer&quot;)">Transfer</button>'+
            '<span class="fu-lastpaid">last paid '+c.cost.lastPaid+'</span>'+
          '</span>'
        : '')+

      '<button class="fu-btn fu-btn-done" onclick="fuContacted('+i+')" title="Restart their vial period from today">Mark contacted today</button>'+
      '<button class="fu-btn fu-btn-snooze" onclick="fuPush('+i+',7)" title="Push reminder out a week">+1 wk</button>'+
      '<button class="fu-btn fu-btn-snooze" onclick="fuPush('+i+',14)" title="Push reminder out two weeks">+2 wks</button>'+
      '<button class="fu-btn fu-btn-reset" onclick="fuResetStd('+i+')" title="Reset their reorder to about 4 weeks out — drops them off the list until it&#39;s due again">Reset · 4 wks</button>'+
      '<button class="fu-btn fu-btn-owner" onclick="fuOwner('+i+')" title="Mark as owner, stop tracking">Owner</button>';
    return '<div class="fu-card fu-'+c.stage+'">'+
      '<div class="fu-head"><div><div class="fu-name">'+esc(c.name)+'</div></div><span class="fu-badge fu-badge-'+c.stage+'">'+labels[c.stage]+'</span></div>'+
      '<div class="fu-chips">'+chips+'</div>'+
      '<div class="fu-meta">'+metaBits.join(" · ")+'</div>'+
      '<div class="fu-msg">'+esc(c.msg)+'</div>'+
      '<div class="fu-actions">'+actions+'</div>'+
    '</div>';
  }).join("");
  // Gone-quiet cards. Same look as the follow-up cards but purple, so it is obvious at a
  // glance that this is a different kind of message and not another reorder chase.
  const quietCards=fuQuietList.map((c,i)=>{
    const wks=Math.round(c.daysSinceOrder/7);
    const quietTxt=c.daysSinceOrder>=60?("~"+Math.round(c.daysSinceOrder/30.44)+" months since their last order"):("~"+wks+" weeks since their last order");
    const bits=[];
    if(c.rew&&c.rew.credit>0)bits.push('<span class="fu-chip fu-chip-ok">'+fuMoney(c.rew.credit)+' credit waiting</span>');
    if(c.rew&&c.rew.pendingVial>0)bits.push('<span class="fu-chip fu-chip-ok">free vial to claim</span>');
    else if(c.rew&&c.rew.toVial>0)bits.push('<span class="fu-chip fu-chip-mut">'+c.rew.toVial+' referral'+(c.rew.toVial===1?'':'s')+' off a free vial</span>');
    if(!bits.length)bits.push('<span class="fu-chip fu-chip-mut">no credit or vial owing</span>');
    const nd=nudgeMap[fuNorm(c.name)];
    const qpinfo=fuPhoneFor(c.name);
    const qph=qpinfo.num;
    const meta=[quietTxt];
    if(c.lastStr)meta.push("Last order: "+sDate(c.lastStr));
    if(nd)meta.push("last pushed "+nd);
    return '<div class="fu-card fu-quiet">'+
      '<div class="fu-head"><div><div class="fu-name">'+esc(c.name)+'</div></div><span class="fu-badge fu-badge-quiet">Needs a push</span></div>'+
      '<div class="fu-chips">'+bits.join("")+'</div>'+
      '<div class="fu-meta">'+esc(meta.join(" · "))+'</div>'+
      '<div class="fu-msg">'+esc(c.quietMsg)+'</div>'+
      '<div class="fu-actions">'+
        '<button class="fu-btn fu-btn-wa" onclick="fuQuietWhats('+i+')" title="'+(qph?'Open WhatsApp to '+esc(fuPhoneShow(qph))+' with this message ready to send':'Add their mobile, then open WhatsApp')+'">'+(qph?'WhatsApp':'WhatsApp · add number')+'</button>'+
        (qph?'<button class="fu-btn fu-btn-num" onclick="fuQuietPhoneEdit('+i+')" title="Change or remove this number">'+esc(fuPhoneShow(qph))+'</button>':'')+
        '<button class="fu-btn fu-btn-copy" onclick="fuQuietCopy(this,'+i+')">Copy message</button>'+
        '<button class="fu-btn fu-btn-done" onclick="fuNudged('+i+')" title="Sent the push. Drops them off this list for '+FU_NUDGE_SNOOZE+' days without touching their reorder timer.">Pushed today</button>'+
        '<button class="fu-btn fu-btn-owner" onclick="fuQuietOwner('+i+')" title="Mark as owner, stop tracking">Owner</button>'+
      '</div>'+
    '</div>';
  }).join("");
  const quietBlock=fuQuietList.length
    ?'<div class="sh" style="margin-top:18px"><h2>Gone Quiet</h2><span class="badge">'+fuQuietList.length+' TO PUSH</span>'+
       '<div style="font-size:11px;color:var(--dim);margin-top:2px;width:100%">No order for '+FU_QUIET_DAYS+'+ days and already reminded since. These are the ones the normal follow-up is not landing on, so the message leans on their credit and rewards instead of a price.</div></div>'+
     '<div class="fu-grid">'+quietCards+'</div>'
    :'';
  let ownerStrip="";
  if(fuOwnerList.length){
    ownerStrip='<div class="fu-owners"><div class="fu-owners-h">Owners · not tracked ('+fuOwnerList.length+')</div><div class="fu-owners-list">'+
      fuOwnerList.map((c,i)=>'<span class="fu-owner-chip">'+esc(c.name)+'<button onclick="fuUnowner('+i+')" title="Track again">×</button></span>').join("")+
      '</div></div>';
  }
  document.getElementById("sec-followups").innerHTML=
    '<div class="sh"><h2>Client Follow-Ups</h2><span class="badge">'+fuList.length+' DUE</span></div>'+
    '<div class="mg mg4" style="margin-bottom:14px">'+
      '<div class="mc" style="border-color:var(--red)"><div class="mc-l">Reorder Due</div><div class="mc-v cm" style="color:var(--red)">'+nRed+'</div><div class="mc-s">A week or less of supply</div></div>'+
      '<div class="mc" style="border-color:var(--amber)"><div class="mc-l">Due Soon</div><div class="mc-v cm" style="color:var(--amber)">'+nAmber+'</div><div class="mc-s">About 2 weeks of supply left</div></div>'+
      '<div class="mc" style="border-color:var(--green)"><div class="mc-l">On Track</div><div class="mc-v cm c-pos">'+nGreen+'</div><div class="mc-s">3+ weeks of supply left</div></div>'+
      '<div class="mc" style="border-color:var(--purple)"><div class="mc-l">Gone Quiet</div><div class="mc-v cm" style="color:var(--purple)">'+fuQuietList.length+'</div><div class="mc-s">Reminded, still no order in '+FU_QUIET_DAYS+'+ days</div></div>'+
    '</div>'+
    badNote+phoneNote+waitNote+
    (cards?'<div class="fu-grid">'+cards+'</div>':(tracked.length?'<div class="fu-empty">All caught up, nobody\u2019s due for a follow-up right now.</div>':'<div class="fu-empty">No clients to track yet.</div>'))+
    quietBlock+

}

// ============ POINTS / LOYALTY ============
// Tiers off lifetime completed spend. Points double as $ store credit. Edit here if tiers change.
const PTS_TIERS=[{min:100,pts:10},{min:300,pts:25},{min:500,pts:40}]; // ascending
function ptsFor(spend){let p=0;for(const t of PTS_TIERS){if(spend>=t.min)p=t.pts;}return p;}
function ptsNext(spend){for(const t of PTS_TIERS){if(spend<t.min)return t;}return null;} // null = top tier
function ptsYM(y,m){return y+"-"+String(m+1).padStart(2,"0");}
function ptsMoney0(n){return "$"+Math.round(n).toLocaleString("en-AU");}

// Names kept out of the Points tab and the calculator list: the partners and placeholder rows.
// The list lives in the hub script, HIDE_FROM_POINTS, so no names sit in this public file.
// Curly vs straight apostrophes get typed interchangeably, so flatten them before comparing.
function ptsKey(n){return String(n||"").replace(/[\u2018\u2019\u02BC]/g,"'").replace(/\s+/g," ").trim().toLowerCase();}
function ptsHidden(name){return ((D&&D.hidePoints)||[]).map(ptsKey).indexOf(ptsKey(name))>=0;}

function rPoints(){
  const now=new Date();
  const curY=now.getFullYear(), curM=now.getMonth(); // 0-based month
  // The sheet's points block is what each customer's rewards page shows, so this tab shows the
  // same total spend, this month, streak and heads up. The same person under two spellings is
  // one person here. Orders are real orders, one per customer per day, not product lines.
  const block={};
  (function(){
    const dash=D.rawDashboard||[];const col={};let hr=-1;
    for(let i=0;i<dash.length;i++){
      const row=(dash[i]||[]).map(c=>String(c||"").trim().toLowerCase());
      const ci=row.indexOf("credit balance ($)");if(ci<0)continue;
      hr=i;col.bal=ci;col.person=Math.max(0,row.findIndex(c=>c.indexOf("person")===0));
      col.spend=row.findIndex(c=>c.indexOf("total spend")===0);col.month=row.findIndex(c=>c.indexOf("this month spend")===0);
      col.streak=row.findIndex(c=>c.indexOf("streak")===0);col.heads=row.findIndex(c=>c.indexOf("heads")===0);
      break;
    }
    if(hr<0)return;
    for(let i=hr+1;i<dash.length;i++){
      const row=dash[i]||[];const nm=String(row[col.person]||"").trim();if(!nm)continue;
      const k=fuNorm(nm);if(block[k])continue;
      block[k]={bal:num(row[col.bal]),spend:col.spend>=0?num(row[col.spend]):null,month:col.month>=0?num(row[col.month]):null,
                streak:col.streak>=0?num(row[col.streak]):null,heads:col.heads>=0?String(row[col.heads]||"").trim():""};
    }
  })();
  const byCust={};
  D.orders.forEach(o=>{
    const raw=String(o.customer||"").trim();if(!raw||ptsHidden(raw))return;
    const k=fuNorm(raw);
    const c=byCust[k]||(byCust[k]={k,names:{},spend:0,monthSpend:0,months:new Set(),creditUsed:0,days:{}});
    c.names[raw]=(c.names[raw]||0)+1;
    c.creditUsed+=o.creditUsed||0;
    const ps=String(o.payStatus||"").trim().toLowerCase();
    if(ps==="unpaid"||ps.indexOf("refund")>=0||/cancel/i.test(String(o.fulfilment||"")))return;
    c.spend+=o.lineTotal;c.days[String(o.date||"").trim()]=1;
    const d=odObj(o.date);
    if(d){c.months.add(ptsYM(d.getFullYear(),d.getMonth()));if(d.getFullYear()===curY&&d.getMonth()===curM)c.monthSpend+=o.lineTotal;}
  });
  const rows=Object.values(byCust).map(c=>{
    const name=Object.keys(c.names).sort((a,b)=>c.names[b]-c.names[a])[0];
    const s=block[c.k]||null;
    const spend=s&&s.spend!=null?s.spend:c.spend,monthSpend=s&&s.month!=null?s.month:c.monthSpend;
    let streak=s&&s.streak!=null?s.streak:0;
    if(!s||s.streak==null){let y=curY,m=curM;for(let i=0;i<12;i++){if(c.months.has(ptsYM(y,m))){streak++;m--;if(m<0){m=11;y--;}}else break;}}
    const t=ptsNext(monthSpend);               // the next monthly credit tier, off this month's spend
    let heads=s&&s.heads?s.heads:"";
    if(!heads)heads=monthSpend<=0?"No order this month yet":(!t?"Maxed this month at $"+ptsFor(monthSpend):"Spend "+ptsMoney0(t.min-monthSpend)+" more this month to reach $"+t.pts);
    const hc=/^no order/i.test(heads)?"c-warn":(/maxed/i.test(heads)?"c-pos":"c-neut");
    const cr=creditFor(name,s?s.bal:0,c.creditUsed);
    return {name,spend,orders:Object.keys(c.days).length,monthSpend,points:ptsFor(monthSpend),streak,heads,hc,maxed:!t&&monthSpend>0,
            credit:cr.available,earned:cr.earned,used:cr.used,refCredit:cr.referral,refs:refCountFor(name)};
  });
  rows.sort((a,b)=>b.spend-a.spend||a.name.localeCompare(b.name));
  const totPoints=rows.reduce((s,r)=>s+r.points,0);
  const totalCredit=rows.reduce((s,r)=>s+r.credit,0);
  const withCredit=rows.filter(r=>r.credit>0).length;
  // Days left in the current month (counts today)
  const daysLeft=new Date(curY,curM+1,0).getDate()-now.getDate()+1;
  // Next monthly credit tier above a given this-month spend
  function nextTier(ms){
    if(ms<100)return{need:100-ms,credit:10};
    if(ms<300)return{need:300-ms,credit:25};
    if(ms<500)return{need:500-ms,credit:40};
    return null;
  }
  // Top 5 clients by spend (earnings)
  const top5=rows.slice().sort((a,b)=>b.spend-a.spend||a.name.localeCompare(b.name)).slice(0,5);
  // Needs a push: active clients who can still earn (more) credit this month, urgent first
  const push=rows.filter(r=>r.orders>0&&nextTier(r.monthSpend)).map(r=>{
    const t=nextTier(r.monthSpend);
    return {name:r.name,need:t.need,credit:t.credit,streak:r.streak,noBuy:r.monthSpend<=0};
  }).sort((a,b)=> a.need-b.need || b.streak-a.streak || a.name.localeCompare(b.name)).slice(0,7);
  const topTier=rows.filter(r=>r.maxed).length;
  const monthSpend=rows.reduce((s,r)=>s+r.monthSpend,0);
  const active=rows.filter(r=>r.orders>0).length;
  const body=rows.length?rows.map((r,i)=>{
    const streakCell=r.streak>0?('<span class="cm">'+r.streak+(r.streak>=2?' 🔥':'')+'</span>'):'<span class="c-mut cm">0</span>';
    const monthCell=r.monthSpend>0?'<span class="c-pos cm">'+fmt(r.monthSpend)+'</span>':'<span class="c-mut cm">$0.00</span>';
    const usedNote=r.used>0?'<span class="c-mut" style="font-size:10px"> · '+fmt(r.used)+' used</span>':'';
    const creditCell=(r.credit>0?'<span class="c-pos cm" style="font-weight:600">'+fmt(r.credit)+'</span>':'<span class="c-mut cm">$0.00</span>')+usedNote;
    return '<tr><td class="cm" style="color:var(--mut)">'+(i+1)+'</td>'+
      '<td>'+esc(r.name)+'</td>'+
      '<td class="cm" style="text-align:right">'+fmt(r.spend)+'</td>'+
      '<td class="cm" style="text-align:center">'+r.orders+'</td>'+
      '<td style="text-align:right">'+creditCell+'</td>'+
      '<td style="text-align:right">'+monthCell+'</td>'+
      '<td style="text-align:center">'+streakCell+'</td>'+
      '<td class="'+r.hc+'" style="font-size:12px">'+esc(r.heads)+'</td></tr>';
  }).join(""):'<tr><td colspan="8" style="text-align:center;color:var(--dim);padding:24px">No customers yet</td></tr>';
  const top5Body=top5.length?top5.map((r,i)=>
    '<tr><td class="cm" style="color:var(--mut);width:16px">'+(i+1)+'</td>'+
    '<td>'+esc(r.name)+'</td>'+
    '<td class="cm" style="text-align:right">'+fmt(r.spend)+'</td>'+
    '<td class="cm" style="text-align:center">'+(r.streak>0?(r.streak+(r.streak>=2?' 🔥':'')):'<span class="c-mut">0</span>')+'</td></tr>'
  ).join(""):'<tr><td colspan="4" style="color:var(--dim);text-align:center;padding:14px">No clients yet</td></tr>';
  const pushBody=push.length?push.map(r=>
    '<tr><td>'+esc(r.name)+'</td>'+
    '<td class="cm" style="text-align:right;color:var(--amber)">'+fmt(r.need)+'</td>'+
    '<td class="cm" style="text-align:right;color:var(--dim)">$'+r.credit+'</td></tr>'
  ).join(""):'<tr><td colspan="3" style="color:var(--green);text-align:center;padding:14px">Everyone\u2019s on track this month</td></tr>';
  document.getElementById("sec-points").innerHTML=
    '<div class="sh"><h2>Client Points</h2><span class="badge">'+active+' ACTIVE</span></div>'+
    '<div class="mg" style="grid-template-columns:1fr;margin-bottom:14px">'+
      '<div class="mc" style="border-color:var(--amber)"><div class="mc-l">Total Credit Outstanding</div><div class="mc-v cm" style="color:var(--amber)">'+fmt(totalCredit)+'</div><div class="mc-s">Spendable store credit owed across '+withCredit+' client'+(withCredit===1?'':'s')+'</div></div>'+
    '</div>'+
    '<div class="mg mg2" style="margin-bottom:14px">'+
      '<div class="mc">'+
        '<div class="mc-l" style="margin-bottom:8px">Top 5 Clients</div>'+
        '<table><thead><tr><th style="width:16px">#</th><th>Client</th><th style="text-align:right">Spend</th><th style="text-align:center">Streak</th></tr></thead><tbody>'+top5Body+'</tbody></table>'+
      '</div>'+
      '<div class="mc">'+
        '<div class="mc-l">Needs a Push</div>'+
        '<div style="font-size:11px;color:var(--mut);margin:2px 0 8px">'+daysLeft+' day'+(daysLeft===1?'':'s')+' left this month</div>'+
        '<table><thead><tr><th>Client</th><th style="text-align:right">Spend more</th><th style="text-align:right">Unlocks</th></tr></thead><tbody>'+pushBody+'</tbody></table>'+
      '</div>'+
    '</div>'+
    
    '<div class="tw"><div class="ts"><table><thead><tr><th>#</th><th>Person</th><th style="text-align:right">Total Spend</th><th style="text-align:center">Orders</th><th style="text-align:right">Credit Balance</th><th style="text-align:right">This Month</th><th style="text-align:center">Streak</th><th>Heads-Up</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

function setOrdersFilter(k){ordersFilter=k;rOrders();}
function setOrdersSearch(v){
  ordersSearch=v;
  const cursor=document.getElementById("ord-search")?document.getElementById("ord-search").selectionStart:v.length;
  rOrders();
  const s=document.getElementById("ord-search");
  if(s){s.focus();try{s.setSelectionRange(cursor,cursor);}catch(e){}}
}

function rOrders(){
  // Sort newest first
  const sorted=[...D.orders].sort((a,b)=>parseOrderDate(b.date)-parseOrderDate(a.date));

  // Counts (using full unfiltered set so buttons always show totals)
  const isFree=o=>String(o.freeVial||"").toLowerCase()==="yes";
  const isDelivered=o=>o.fulfilment==="Delivered"||o.fulfilment==="Completed";
  const isActionNeeded=o=>o.payStatus==="Paid"&&!isDelivered(o);
  const isUnpaid=o=>o.payStatus!=="Paid";
  const counts={
    all:D.orders.length,
    unpaid:D.orders.filter(isUnpaid).length,
    action:D.orders.filter(isActionNeeded).length,
    delivered:D.orders.filter(isDelivered).length,
    free:D.orders.filter(isFree).length
  };

  // Apply filter
  let filtered=sorted;
  if(ordersFilter==="unpaid")filtered=sorted.filter(isUnpaid);
  else if(ordersFilter==="action")filtered=sorted.filter(isActionNeeded);
  else if(ordersFilter==="delivered")filtered=sorted.filter(isDelivered);
  else if(ordersFilter==="free")filtered=sorted.filter(isFree);

  // Apply search
  if(ordersSearch){
    const q=ordersSearch.toLowerCase();
    filtered=filtered.filter(o=>String(o.customer||"").toLowerCase().includes(q)||String(o.product||"").toLowerCase().includes(q)||String(o.sku||"").toLowerCase().includes(q));
  }

  // Build rows
  const rows=filtered.length?filtered.map((o,i)=>'<tr><td class="cm">'+(i+1)+'</td><td class="cm">'+sDate(o.date)+'</td><td>'+esc(o.customer)+'</td><td>'+esc(o.product)+'</td><td class="cm" style="text-align:center">'+o.qty+'</td><td class="cm" style="text-align:right">'+fmt(o.lineTotal)+'</td><td><span class="pill '+pillCls(o.payStatus)+'">'+esc(o.payStatus)+'</span></td><td class="cm" style="text-align:right">'+fmt(o.balanceDue)+'</td><td><span class="pill '+pillCls(o.fulfilment)+'">'+esc(o.fulfilment)+'</span></td><td>'+esc(o.responsible)+'</td><td style="font-size:11px;color:var(--dim);max-width:150px;overflow:hidden;text-overflow:ellipsis">'+esc(o.notes)+'</td></tr>').join(""):'<tr><td colspan="11" style="text-align:center;color:var(--dim);padding:24px">No orders match this filter</td></tr>';

  // Filter button helper
  const btn=(k,label,n)=>'<button onclick="setOrdersFilter(\''+k+'\')" style="padding:6px 12px;border-radius:6px;border:1px solid '+(ordersFilter===k?"var(--cyan)":"var(--bd)")+';background:'+(ordersFilter===k?"rgba(34,211,238,.15)":"transparent")+';color:var(--fg);cursor:pointer;font-size:12px;font-weight:'+(ordersFilter===k?"600":"400")+'">'+label+' <span style="color:var(--dim)">('+n+')</span></button>';

  document.getElementById("sec-orders").innerHTML=
    '<div class="sh"><h2>Customer Orders</h2><span class="badge">'+filtered.length+' OF '+D.orders.length+'</span></div>'+
    '<div style="font-size:12px;color:var(--dim);margin-bottom:14px">Newest first · edit in Google Sheets → refreshes here automatically</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px">'+
      btn("all","All",counts.all)+btn("unpaid","Pending Unpaid",counts.unpaid)+btn("action","Action Needed",counts.action)+btn("delivered","Delivered",counts.delivered)+btn("free","Free Vials",counts.free)+
      '<input id="ord-search" type="text" placeholder="Search customer, product or SKU…" value="'+esc(ordersSearch)+'" oninput="setOrdersSearch(this.value)" style="flex:1;min-width:220px;padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:12px"/>'+
    '</div>'+
    '<div class="tw"><div class="ts"><table><thead><tr><th>#</th><th>Date</th><th>Customer</th><th>Product</th><th style="text-align:center">Qty</th><th style="text-align:right">Total</th><th>Payment</th><th style="text-align:right">Balance</th><th>Fulfilment</th><th>Person</th><th>Notes</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

// Find the Product that matches an Inventory_Summary row (reverse of invStockFor):
// exact SKU (trim + case), else prefix match disambiguated by the strength digits
// in the product SKU appearing in the inventory row's name.
function prodForInv(invRow, products){
  const is=String(invRow.sku||"").trim().toLowerCase();
  if(!is)return null;
  let p=products.find(pp=>String(pp.sku||"").trim().toLowerCase()===is);
  if(!p){
    const cand=products.filter(pp=>{const ps=String(pp.sku||"").trim().toLowerCase();return ps&&(ps.startsWith(is)||is.startsWith(ps));});
    if(cand.length>1){
      const nm=String(invRow.name||"").toLowerCase();
      p=cand.find(pp=>{const m=String(pp.sku||"").toLowerCase().match(/(\d+)\s*$/);return m&&nm.includes(m[1]);})||cand[0];
    } else p=cand[0]||null;
  }
  return p||null;
}
// Match a product to its Inventory_Summary stock, resilient to SKU mismatches:
//  - trims + lowercases SKUs (fixes "Klow " trailing-space vs "Klow")
//  - if no exact SKU match, falls back to prefix match and disambiguates by the
//    strength digits in the product SKU (fixes Products "RETAT20"/"RETAT15" vs
//    Inventory "RETAT" on rows named "Retatrutide 20mg"/"Retatrutide 15mg")
function invStockFor(p, inv){
  const ps=String(p.sku||"").trim().toLowerCase();
  let rows=inv.filter(i=>String(i.sku||"").trim().toLowerCase()===ps);
  if(!rows.length && ps){
    const cand=inv.filter(i=>{const is=String(i.sku||"").trim().toLowerCase();return is&&(ps.startsWith(is)||is.startsWith(ps));});
    if(cand.length>1){
      const m=ps.match(/(\d+)\s*$/);
      const narrowed=m?cand.filter(i=>String(i.name||"").toLowerCase().includes(m[1])):[];
      rows=narrowed.length?narrowed:cand;
    } else rows=cand;
  }
  let total=0,storage=0,duds=0;
  rows.forEach(i=>{total+=i.total;storage+=i.storage;duds+=(i.duds||0);});
  return {total,storage,duds};
}
function rProducts(){
  /* One card per product with just what matters: stock, cost, sell price, profit per unit and
     margin. Active products first in sheet order, paused and discontinued ones faded last. */
  const act=p=>String(p.status||"").trim().toLowerCase()==="active";
  const list=D.products.filter(act).concat(D.products.filter(p=>!act(p)));
  const cards=list.map(p=>{
    const si=invStockFor(p,D.inventory),stock=si.total,duds=si.duds||0,mismatch=stockMismatch(p);
    const cost=p.cost||0,sell=p.netPrice||0,profit=sell-cost,mPct=sell>0?Math.round(profit/sell*100):0;
    const n=ocName(p),st=ocStrength(p),on=act(p);
    const sc=stock<=0?"pr-out":stock<10?"pr-low":"pr-ok";
    const fig=(l,v,c)=>'<div><div class="pr-fl">'+l+'</div><div class="pr-fv'+(c?' '+c:'')+'">'+v+'</div></div>';
    return '<div class="mc pr'+(on?'':' pr-off')+'">'+
      '<div class="pr-top"><div style="min-width:0"><div class="pr-n">'+esc(n.main)+(st?' <span class="pr-st">'+esc(st)+'</span>':'')+'</div>'+
        '<div class="pr-sku">'+esc(p.sku)+(on?'':', '+esc(String(p.status||"").toLowerCase()))+'</div></div>'+
        '<div class="pr-stock '+sc+'"><b>'+stock+'</b> in stock</div></div>'+
      '<div class="pr-figs">'+fig('Cost',fmt(cost))+fig('Sell price',fmt(sell))+fig('Profit per unit',fmt(profit),profit>=0?'c-pos':'c-neg')+'</div>'+
      '<div class="pr-m"><div class="pr-bar"><span style="width:'+Math.max(0,Math.min(100,mPct))+'%;background:'+(mPct<50?'var(--amber)':'var(--green)')+'"></span></div>'+
        '<span class="pr-mp">'+mPct+'% margin</span></div>'+
      (duds>0?'<div class="pr-warn c-neg">'+duds+' duds</div>':'')+
      (mismatch?'<div class="pr-warn c-warn">Products tab says '+esc(String(mismatch.prod))+' in stock, check that formula</div>':'')+
    '</div>';
  }).join("");
  document.getElementById("sec-products").innerHTML='<div class="sh"><h2>Products</h2><span class="badge">'+D.products.length+' PRODUCTS</span></div><div class="mg mg3">'+cards+'</div>';
}

    topCards+

}

  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.lab.map(l=>({Date:l.date,SKU:l.sku,Product:l.product,Qty:l.qty,"Total inc GST":l.totalIncGst,Status:l.status,Notes:l.notes}))),"Lab_Orders");
  XLSX.writeFile(wb,"PEPS_HUB_Export.xlsx");
}

// Saved Stock List orders live in the sheet's SavedOrders tab. We keep a local copy so
// the iframe gets an instant answer, then write through to the sheet in the background.
let stocklistOrders=null;
function stocklistLoadOrders(){
  const out={};
  const raw=(D&&D.rawSavedOrders)||[];
  for(let i=1;i<raw.length;i++){
    const r=raw[i]||[];const nm=String(r[0]||"").trim();
    if(!nm||nm==="__reorder__")continue;   // reorder picks live here too, they are not a supplier order
    out[nm]={updated:String(r[1]||""),items:String(r[2]||"")};
  }
  return out;
}
function stocklistSendOrders(){
  const frame=document.getElementById('stocklistFrame');
  if(!frame||!frame.contentWindow)return;
  if(stocklistOrders===null)stocklistOrders=stocklistLoadOrders();
  frame.contentWindow.postMessage({type:'supplierhub-orders-data',orders:stocklistOrders},'*');
}
function stocklistWrite(params,nm,items,isDelete){
  // update our local copy first so the UI responds straight away
  if(stocklistOrders===null)stocklistOrders=stocklistLoadOrders();
  if(isDelete)delete stocklistOrders[nm];
  else stocklistOrders[nm]={updated:new Date().toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),items:items||""};
  stocklistSendOrders();
  if(!SCRIPT_URL)return;
  const u=SCRIPT_URL+(SCRIPT_URL.indexOf("?")>=0?"&":"?")+"key="+encodeURIComponent(SCRIPT_KEY)+"&"+params+"&t="+Date.now();
  (async function(){
    for(let i=0;i<3;i++){
      try{
        const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);
        const resp=await fetch(u,{signal:ctrl.signal});clearTimeout(timer);
        const j=await resp.json().catch(()=>null);
        if(j&&j.ok)return;
      }catch(e){}
      await new Promise(r=>setTimeout(r,1500));
    }
    const frame=document.getElementById('stocklistFrame');
    if(frame&&frame.contentWindow)frame.contentWindow.postMessage({type:'supplierhub-orders-error'},'*');
  })();
}

/* The Stock List page with its supplier prices put back in. The prices only ever arrive with
   the hub data, behind the password, so the public file holds the page but none of the data.
   Returns null until that data is here. */
function stocklistSrc(){
  const sl=D&&D.stockList;
  if(!sl||!Array.isArray(sl.products)||!sl.products.length)return null;
  const j=v=>JSON.stringify(v).replace(/</g,"\\u003c");   // can never close the script tag early
  const js="const products = "+j(sl.products)+";\nconst RATE = "+(Number(sl.rate)||1.4)+";\nconst SHIP_USD = "+(Number(sl.shipUsd)||0)+
           ";\nconst S_PRICES = "+j(sl.sPrices||{})+";\nconst DEFAULT_FAVS = new Set("+j(sl.favs||[])+");\n";
  const html=new TextDecoder().decode(Uint8Array.from(atob(SUPPLIER_HUB_B64),c=>c.charCodeAt(0))).replace("/*__STOCKLIST_DATA__*/",()=>js);
  const enc=new TextEncoder().encode(html);let bin="";
  for(let i=0;i<enc.length;i+=0x8000)bin+=String.fromCharCode.apply(null,enc.subarray(i,i+0x8000));
  return "data:text/html;base64,"+btoa(bin);
}
function rStocklist(){
  const sec=document.getElementById("sec-stocklist");
  // Only build the iframe once - re-rendering would lose user's cart state
  if(sec.dataset.built==="1")return;
  const slSrc=stocklistSrc();
  if(!slSrc){      // not signed in yet, or the hub script is an old one without the prices
    sec.innerHTML='<div class="sh" style="margin-bottom:12px"><h2>Stock List</h2></div><div class="mc"><div class="mc-s">The Stock List shows once the dashboard is signed in and the hub script is up to date.</div></div>';
    return;
  }
  sec.dataset.built="1";
  sec.innerHTML='<div class="sh" style="margin-bottom:12px"><h2>Stock List</h2><span class="badge">Supplier · VIP Pricing</span></div>'+
    '<div style="background:var(--bg);border:1px solid var(--bdr);border-radius:12px;overflow:hidden">'+
      '<iframe id="stocklistFrame" style="width:100%;height:600px;border:0;display:block;background:#0f1117" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" scrolling="no" src="'+slSrc+'"></iframe>'+
    '</div>';
  // Listen for height messages from the supplier hub iframe and resize accordingly
  // This eliminates the double-scroll problem (no inner scroll, parent scrolls naturally)
  if(!window._stocklistResizeBound){
    window._stocklistResizeBound=true;
    window.addEventListener('message',function(e){
      if(!e||!e.data)return;
      const sf=document.getElementById('stocklistFrame');
      if(!sf||e.source!==sf.contentWindow)return;   // only our own Stock List frame, never another page
      if(e.data.type==='supplierhub-resize'&&typeof e.data.height==='number'){
        const frame=document.getElementById('stocklistFrame');
        // Ignore implausibly small heights so the frame can never collapse into a shrinking bar
        if(frame&&e.data.height>=200){frame.style.height=(e.data.height+4)+'px';}
      }
      if(e.data.type==='supplierhub-scroll-to-cart'){
        const frame=document.getElementById('stocklistFrame');
        if(frame){
          const rect=frame.getBoundingClientRect();
          const y=window.pageYOffset+rect.top-20;
          window.scrollTo({top:y,behavior:'smooth'});
        }
      }
      // The Stock List can't use browser storage (data: URL iframe), so it asks us to
      // save and load its orders through the sheet instead.
      if(e.data.type==='supplierhub-orders'){
        const op=e.data.op, nm=e.data.name, items=e.data.items;
        if(op==='ready'){ stocklistSendOrders(); }
        else if(op==='save'||op==='delete'){
          const params="action=order&name="+encodeURIComponent(nm)+
            (op==='delete'?"&del=1":"&items="+encodeURIComponent(items||""));
          stocklistWrite(params, nm, items, op==='delete');
        }
      }
    });
  }
}

renderTabs();

if(SCRIPT_URL&&SCRIPT_KEY){document.getElementById("setupBox").style.display="none";try{fillSetup();}catch(e){}requestParentCache();cacheLoad();startRefresh();refreshData();}
else{const sb=document.getElementById("setupBox");sb.style.display="block";

  }else{const h=document.getElementById("saveHint");if(h)h.style.display="block";}
})();

/* ---------- login polish: works the same in Safari and Chrome ---------- */
(function(){
  var F=document.getElementById("lockForm")||document.getElementById("setupForm");
  if(!F)return;
  var U=document.getElementById("uIn")||document.getElementById("urlInput");
  var K=document.getElementById("kIn")||document.getElementById("keyInput");
  if(!U||!K)return;
  var go=(typeof doUnlock==="function")?doUnlock:((typeof connect==="function")?connect:null);

  /* iOS keyboard: Next on the URL, Go on the key */
  U.setAttribute("enterkeyhint","next");
  K.setAttribute("enterkeyhint","go");
  U.setAttribute("autocapitalize","off");
  U.setAttribute("autocorrect","off");

  function mini(txt,onTap){
    var b=document.createElement("button");
    b.type="button"; b.textContent=txt;
    b.style.cssText="position:absolute;right:7px;top:50%;transform:translateY(-50%);z-index:3;"+
      "background:rgba(255,255,255,.10);color:#cbd5e1;border:0;border-radius:7px;padding:6px 10px;"+
      "font-size:11px;font-weight:600;cursor:pointer;-webkit-appearance:none;line-height:1";
    b.addEventListener("click",onTap);
    return b;
  }
  function wrap(inp,btn){
    var holder=document.createElement("div");
    holder.style.cssText="position:relative;display:block;flex:1;min-width:0";
    inp.parentNode.insertBefore(holder,inp);
    holder.appendChild(inp); holder.appendChild(btn);
    inp.style.paddingRight="66px";
    inp.style.width="100%";
    inp.style.boxSizing="border-box";
  }

  /* Paste, because the Apps Script URL is far too long to type on a phone */
  wrap(U, mini("Paste", function(){
    if(navigator.clipboard&&navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){
        if(t&&t.trim()){U.value=t.trim();K.focus();}else U.focus();
      })["catch"](function(){U.focus();});
    }else U.focus();
  }));

  /* Show / hide the key, so a typo is findable */
  var eye=mini("Show", function(){
    var hidden=K.type==="password";
    K.type=hidden?"text":"password";
    eye.textContent=hidden?"Hide":"Show";
  });
  wrap(K,eye);

  /* Chrome and Android can store and refill this silently. Safari ignores it
     harmlessly and falls back to the normal keychain prompt. */
  window.__credStore=function(u,k){
    try{
      if(window.PasswordCredential&&navigator.credentials&&navigator.credentials.store){
        navigator.credentials.store(new window.PasswordCredential({id:u,password:k,name:"PPR Hub"}))["catch"](function(){});
      }
    }catch(e){}
  };

  var lockEl=document.getElementById("lock");
  var setupEl=document.getElementById("setupBox");
  var needsLogin = lockEl ? !lockEl.classList.contains("hide")
                 : (setupEl ? setupEl.style.display!=="none" : false);

  if(needsLogin){
    try{
      if(window.PasswordCredential&&navigator.credentials&&navigator.credentials.get&&!K.value){
        navigator.credentials.get({password:true,mediation:"optional"}).then(function(c){
          if(c&&c.password){ if(c.id)U.value=c.id; K.value=c.password; if(go)go(); }
        })["catch"](function(){});
      }
    }catch(e){}
  }

  /* The only thing that truly survives on an iPhone. Both Safari and Chrome on iOS
     get their saved data wiped after 7 days of not opening the site. A home screen
     copy is exempt from that. */
  var standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(iOS&&!standalone&&needsLogin&&!lsGet("peps-script-key")){
    var tip=document.createElement("p");
    tip.style.cssText="font-size:12px;line-height:1.55;margin:14px 0 0;text-align:left;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.35);border-radius:10px;padding:11px 13px";
    tip.innerHTML='<b style="color:#fbbf24">Sick of typing this in?</b><br>'+
                  'Tap Share, then Add to Home Screen, then open it from that icon from now on.<br>'+
                  'iPhone wipes the saved login for any normal site you have not opened in 7 days. A home screen copy is left alone, so it stays signed in.';
    F.parentNode.insertBefore(tip,F.nextSibling);
  }
})();



/* ---------- the real reason it keeps forgetting ---------- */
(function(){
  var embedded=false; try{ embedded = window.top!==window.self; }catch(e){ embedded=true; }
  if(!embedded) return;
  var direct = location.origin + location.pathname;
  function box(){
    var d=document.createElement("div");
    d.style.cssText="position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;background:#7f1d1d;color:#fee2e2;"+
      "border:1px solid #ef4444;border-radius:12px;padding:13px 15px;font:600 13px/1.45 -apple-system,system-ui,sans-serif;"+
      "box-shadow:0 8px 28px rgba(0,0,0,.55)";
    d.innerHTML='This page is running inside another site, so your phone will not let it remember your login. '+
      'Open it on its own and it will stick.'+
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<a id="openDirect" href="'+direct+'" target="_top" style="background:#fecaca;color:#7f1d1d;border-radius:8px;padding:8px 13px;text-decoration:none;font-weight:700">Open it properly</a>'+
      '<button id="dismissEmbed" style="background:transparent;color:#fecaca;border:1px solid #fecaca;border-radius:8px;padding:8px 13px;font-weight:600">Not now</button>'+
      '</div>';
    document.body.appendChild(d);
    d.querySelector("#dismissEmbed").addEventListener("click",function(){d.remove();});
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",box); else box();
})();
