/* ============================ STOCK LIST ============================
   Built straight into the dashboard. Every price arrives with the hub data behind the password,
   never from this public file. Four suppliers, each with its own list, cart and saved orders:
   the main supplier prices by the vial and the price drops at 50, 100 and 300 of ONE product, S sells a few
   lines at a delivered AUD price, Evolve sells boxes of 10 at one price, and the fourth sells boxes of 10
   with the box getting cheaper at 30 and 100 boxes of one product. */
const SX_TIERS=['t1','t2','t3','t4'], SX_TIER_MIN={t1:10,t2:50,t3:100,t4:300};
const SX_IDS=['main','s','evolve','zlz'];
const SX_CART={main:'__cart__',s:'__cart_s__',evolve:'__cart_evolve__',zlz:'__cart_zlz__'};
const SLX={sup:'main',cur:'aud',q:'',fav:false,open:{},carts:{main:{},s:{},evolve:{},zlz:{}},favs:null,restored:false,
  order:false,msg:'',copyText:'',armed:{},built:null,saveT:{},ship:{},shipT:null};
let SX_CACHE=null;

// Saved Stock List orders live in the sheet's SavedOrders tab. We keep a local copy so the page
// answers straight away, then write through to the sheet in the background.
let stocklistOrders=null;
function stocklistLoadOrders(){
  const out={};
  const raw=(D&&D.rawSavedOrders)||[];
  for(let i=1;i<raw.length;i++){
    const r=raw[i]||[];const nm=String(r[0]||"").trim();
    if(!nm||nm==="__reorder__")continue;   // reorder picks live here too, they are not a supplier order
    out[nm]={updated:String(r[1]||""),items:String(r[2]||"")};
  }
  return out;
}
function stocklistWrite(params,nm,items,isDelete){
  if(stocklistOrders===null)stocklistOrders=stocklistLoadOrders();
  if(isDelete)delete stocklistOrders[nm];
  else stocklistOrders[nm]={updated:new Date().toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),items:items||""};
  if(!SCRIPT_URL)return;
  const u=SCRIPT_URL+(SCRIPT_URL.indexOf("?")>=0?"&":"?")+"key="+encodeURIComponent(SCRIPT_KEY)+"&"+params+"&t="+Date.now();
  (async function(){
    for(let i=0;i<3;i++){
      try{
        const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);
        const resp=await fetch(u,{signal:ctrl.signal});clearTimeout(timer);
        const j=await resp.json().catch(()=>null);
        if(j&&j.ok)return;
      }catch(e){}
      await new Promise(r=>setTimeout(r,1500));
    }
    if(nm.indexOf("__")!==0){SLX.msg="Couldn't save just now. Check your connection and try again.";sxPaintOrder();}
  })();
}
function sxWrite(nm,items){stocklistWrite("action=order&name="+encodeURIComponent(nm)+"&items="+encodeURIComponent(items||""),nm,items,false);}
function sxDelWrite(nm){stocklistWrite("action=order&name="+encodeURIComponent(nm)+"&del=1",nm,"",true);}

/* ---------- the three suppliers, built once per load of hub data ---------- */
function sxDose(d){return String(d||"").toLowerCase().replace(/\s+/g,"");}
function sxSups(){
  const sl=D&&D.stockList;
  if(!sl||!Array.isArray(sl.products)||!sl.products.length)return null;
  if(SX_CACHE&&SX_CACHE.src===sl)return SX_CACHE.sups;
  const rate=Number(sl.rate)||1.4,names=sl.names||{},SP=sl.sPrices||{};
  const mk=(p,extra)=>Object.assign({},p,extra,{key:p.name+"|"+p.dose});
  const sups={main:{id:'main',label:names.main||'Main',tiers:true,ship:Number(sl.shipUsd)||0,
    products:sl.products.map(p=>mk(p,{box:p.box||0,moq:p.moq||1,main:p.name,mdose:p.dose}))}};
  // S: its lines come from the same prices the old vs S checks used. One combo is listed under
  // three names, so it shows once, under the blend's own name.
  const sl2=[],seen={};
  Object.keys(SP).forEach(k=>{
    const s=SP[k];if(!(s.priceAUD>0))return;
    if(s.note&&/combo/i.test(s.note)){
      const ck=s.note+"|"+s.dose+"|"+s.priceAUD;
      const blend=Object.keys(SP).find(x=>x.indexOf("+")>=0&&SP[x].note===s.note&&SP[x].dose===s.dose);
      if(seen[ck]||(blend&&blend!==k))return;
      seen[ck]=1;
    }
    const v=s.priceAUD/rate;
    sl2.push(mk({name:k,code:"",dose:s.dose,t1:v,t2:v,t3:v,t4:v},{box:0,moq:1,main:k,mdose:s.dose}));
  });
  if(sl2.length)sups.s={id:'s',label:names.s||'S',tiers:false,ship:0,delivered:true,products:sl2};
  const ev=sl.evolve;
  if(ev&&Array.isArray(ev.products)&&ev.products.length)sups.evolve={id:'evolve',label:ev.label||'Evolve',date:ev.date||'',tiers:false,
    ship:Number(ev.shipUsd)||0,products:ev.products.map(e=>{const per=e.per||10,v=e.kit/per;
      return mk({name:e.name,code:e.code,dose:e.dose,t1:v,t2:v,t3:v,t4:v},{box:per>1?per:0,moq:1,main:e.main||"",mdose:e.mdose||""});})};
  // The fourth list is priced a box at a time: kits is the box price at each break, and the breaks
  // are in boxes of ONE product, so the ladder counts boxes rather than vials.
  const z=sl.zlz;
  if(z&&Array.isArray(z.products)&&z.products.length){
    const br=(Array.isArray(z.breaks)&&z.breaks.length?z.breaks:[1,30,100]).map(Number),tk=br.map((_,i)=>'t'+(i+1)),tlab={};
    br.forEach((b,i)=>{tlab[tk[i]]=i?b+'+ boxes':'Under '+(br[1]||30)+' boxes';});
    sups.zlz={id:'zlz',label:z.label||'Supplier 4',date:z.date||'',tiers:true,byBox:true,breaks:br,tkeys:tk,tlab,ship:Number(z.shipUsd)||0,
      products:z.products.map(e=>{const per=e.per||10,ks=Array.isArray(e.kits)&&e.kits.length?e.kits:[e.kit],v=i=>(ks[i]!=null?ks[i]:ks[ks.length-1])/per;
        return mk({name:e.name,code:e.code,dose:e.dose,t1:v(0),t2:v(1),t3:v(2),t4:v(2)},{box:per>1?per:0,moq:1,main:e.main||"",mdose:e.mdose||""});})};
  }
  const idx={};
  Object.values(sups).forEach(S2=>{
    const m={};
    S2.products.forEach(p=>{
      (m[p.name]=m[p.name]||{name:p.name,vs:[]}).vs.push(p);
      if(p.main){const k=p.main+"|"+sxDose(p.mdose);(idx[k]=idx[k]||{})[S2.id]=p;}
    });
    S2.groups=Object.values(m);
  });
  SX_CACHE={src:sl,sups,rate,idx,favs:Array.isArray(sl.favs)?sl.favs:[]};
  return sups;
}

/* ---------- prices ---------- */
// Breaks are per product: the quantity of THAT product sets its price, not the order. The main
// supplier counts vials; a by the box supplier counts boxes of that product.
function sxTier(q,S2,p){
  q=q||0;
  if(S2&&S2.byBox){const n=q/((p&&p.box)||1);let t='t1';S2.breaks.forEach((b,i)=>{if(i&&n>=b)t='t'+(i+1);});return t;}
  return q>=300?'t4':q>=100?'t3':q>=50?'t2':'t1';
}
function sxTierKeys(S2){return S2.tkeys||SX_TIERS;}
function sxTierLabel(S2,t){return S2.tlab?S2.tlab[t]:SX_TIER_MIN[t]+'+';}
// The smallest quantity, in vials, that gets a tier's price.
function sxTierQty(S2,p,t){
  if(S2.byBox){const i=sxTierKeys(S2).indexOf(t);return Math.max(1,S2.breaks[i<0?0:i])*((p&&p.box)||1);}
  return SX_TIER_MIN[t]||0;
}
function sxUnit(p,S2,q){return S2.tiers?(p[sxTier(q||0,S2,p)]||p.t1):p.t1;}          // USD a vial
function sxMoney(usd){const v=SLX.cur==='aud'?usd*(SX_CACHE?SX_CACHE.rate:1.4):usd;
  return '$'+v.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sxStep(p,S2){return p.box||(S2.id==='s'||S2.byBox?1:10);}   // a by the box supplier's odd single vial line goes one at a time
function sxStart(p,S2){return sxStep(p,S2)*(p.moq||1);}
/* Shipping can be split when you go in on an order with someone: the full amount, half, or any
   amount you type. The choice is kept per supplier and saved to the sheet like the carts. */
function sxShip(sid){
  const S2=sxSups()[sid];if(!S2||S2.delivered)return 0;
  const o=SLX.ship[sid]||{},full=S2.ship||0;
  if(o.m==='half')return full/2;
  if(o.m==='custom')return Math.max(0,Number(o.usd)||0);
  return full;
}
function sxSaveShip(){clearTimeout(SLX.shipT);const v=JSON.stringify(SLX.ship);SLX.shipT=setTimeout(()=>sxWrite('__ship__',v),700);}
function sxShipHtml(S2,t){
  if(S2.delivered)return '<div class="sx-sum"><span>Shipping</span><span>Included</span></div>';
  const m=(SLX.ship[S2.id]||{}).m||'full',r=SX_CACHE?SX_CACHE.rate:1.4;
  return '<div class="sx-sum"><span>Shipping'+(m==='half'?', your half':m==='custom'?', your share':'')+'</span><span>'+
      (S2.ship||m==='custom'?sxMoney(t.ship):'Not quoted')+'</span></div>'+
    '<div class="sx-shipseg" role="group" aria-label="Shipping share">'+
      ['full','half','custom'].map(x=>'<button data-act="ship" data-m="'+x+'" class="'+(x===m?'on':'')+'">'+(x==='full'?'Full':x==='half'?'Half':'Other')+'</button>').join('')+
    '</div>'+
    (m==='custom'?'<label class="sx-shipin"><span>Your share in '+SLX.cur.toUpperCase()+'</span><input class="sx-shipv" inputmode="decimal" value="'+
      (SLX.cur==='aud'?sxShip(S2.id)*r:sxShip(S2.id)).toFixed(2)+'" aria-label="Shipping amount"></label>':'');
}
function sxTotals(sid){
  const S2=sxSups()[sid],c=SLX.carts[sid];let sub=0,vials=0;
  Object.keys(c).forEach(k=>{const p=S2.products.find(x=>x.key===k);if(!p)return;sub+=sxUnit(p,S2,c[k])*c[k];vials+=c[k];});
  const ship=Object.keys(c).length?sxShip(sid):0;
  return {sub,ship,total:sub+ship,vials};
}
/* The same product and strength at each supplier, per vial in AUD. The main supplier is priced at the break
   that product's quantity reaches, Evolve at its one list price, S delivered. */
function sxCmp(p,sid){
  if(!p.main||!SX_CACHE)return null;
  const b=SX_CACHE.idx[p.main+"|"+sxDose(p.mdose)];if(!b)return null;
  const sups=SX_CACHE.sups,rows=[];
  [sid].concat(SX_IDS.filter(x=>x!==sid)).forEach(id=>{
    const q=id===sid?p:b[id];if(!q||!sups[id])return;
    rows.push({id,label:sups[id].label,aud:sxUnit(q,sups[id],id===sid?(SLX.carts[sid][p.key]||0):0)*SX_CACHE.rate,me:id===sid});
  });
  return rows.length>1?rows:null;
}
function sxShowAud(a){const v=SLX.cur==='aud'?a:a/(SX_CACHE?SX_CACHE.rate:1.4);
  return '$'+v.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sxTag(g,sid){
  let here=0;const other={};
  g.vs.forEach(p=>{
    const rows=sxCmp(p,sid);if(!rows)return;
    const me=rows[0].aud,best=rows.reduce((a,r)=>r.aud<a.aud-0.004?r:a,rows[0]);
    if(best.me||me<=best.aud+0.004)here++;else other[best.label]=(other[best.label]||0)+1;
  });
  const ks=Object.keys(other).sort((a,b)=>other[b]-other[a]);
  if(ks.length)return '<span class="sx-tag else">Cheaper at '+esc(ks[0])+'</span>';
  return here?'<span class="sx-tag here">Best price here</span>':'';
}

/* ---------- cart, saving and saved orders ---------- */
function sxItems(sid){
  const S2=sxSups()[sid],c=SLX.carts[sid];
  return JSON.stringify(Object.keys(c).map(k=>{const p=S2.products.find(x=>x.key===k);return p?{n:p.name,d:p.dose,q:c[k],s:sid}:null;}).filter(Boolean));
}
function sxSaveCart(sid){
  clearTimeout(SLX.saveT[sid]);
  const items=sxItems(sid);               // read now, so switching supplier mid wait saves the right one
  SLX.saveT[sid]=setTimeout(()=>sxWrite(SX_CART[sid],items),700);
}
function sxCartFrom(items,sid){
  const S2=sxSups()[sid],out={};
  try{JSON.parse(items||"[]").forEach(it=>{
    const p=S2.products.find(x=>x.name===it.n&&x.dose===it.d)||S2.products.find(x=>x.name===it.n);
    if(p&&it.q>0)out[p.key]=it.q;
  });}catch(e){}
  return out;
}
function sxRestore(){
  if(SLX.restored)return;
  const sups=sxSups();if(!sups)return;
  SLX.restored=true;
  if(stocklistOrders===null)stocklistOrders=stocklistLoadOrders();
  Object.keys(SX_CART).forEach(sid=>{const o=stocklistOrders[SX_CART[sid]];if(o&&o.items&&sups[sid])SLX.carts[sid]=sxCartFrom(o.items,sid);});
  const so=stocklistOrders.__ship__;
  if(so&&so.items){try{const o=JSON.parse(so.items);if(o&&typeof o==='object'&&!Array.isArray(o))SLX.ship=o;}catch(e){}}
}
function sxSavedNames(){
  if(stocklistOrders===null)stocklistOrders=stocklistLoadOrders();
  return Object.keys(stocklistOrders).filter(n=>n.indexOf("__")!==0).sort();
}
function sxSet(k,q){
  const S2=sxSups()[SLX.sup],p=S2.products.find(x=>x.key===k);if(!p)return;
  const st=sxStep(p,S2),min=sxStart(p,S2),c=SLX.carts[SLX.sup];
  q=Math.round(q/st)*st;
  if(!(q>=min))delete c[k];else c[k]=Math.min(q,99990);
  SLX.msg="";SLX.copyText="";
  sxSaveCart(SLX.sup);sxPaint();
}
function sxSaveAs(){
  if(!Object.keys(SLX.carts[SLX.sup]).length)return;
  const nm=(prompt('Name this order, like "October restock"')||"").trim();
  if(!nm||nm.indexOf("__")===0)return;
  sxWrite(nm,sxItems(SLX.sup));
  SLX.msg="Saved as "+nm+".";sxPaintOrder();
}
function sxLoad(nm){
  const o=stocklistOrders&&stocklistOrders[nm];if(!o)return;
  let sid="main";
  try{const its=JSON.parse(o.items||"[]");if(its.length&&its[0].s&&sxSups()[its[0].s])sid=its[0].s;}catch(e){}
  SLX.sup=sid;SLX.carts[sid]=sxCartFrom(o.items,sid);sxSaveCart(sid);
  SLX.msg="Loaded "+nm+".";SLX.copyText="";sxPaint();
}
function sxDelete(nm){
  if(!SLX.armed[nm]){SLX.armed[nm]=1;sxPaintOrder();setTimeout(()=>{if(SLX.armed[nm]){delete SLX.armed[nm];sxPaintOrder();}},3000);return;}
  delete SLX.armed[nm];sxDelWrite(nm);sxPaintOrder();
}
/* The order as plain lines for a chat: name, strength and how many, no prices. */
function sxListText(){
  const sid=SLX.sup,S2=sxSups()[sid],c=SLX.carts[sid];
  return Object.keys(c).map(k=>{
    const p=S2.products.find(x=>x.key===k);if(!p)return "";
    const q=c[k],nm=String(p.name).replace(/[()]/g,"").replace(/\s+/g," ").trim();
    const qty=p.box?(q/p.box)+(q/p.box===1?" box":" boxes"):q+(q===1?" vial":" vials");
    return nm+" "+p.dose+" x "+qty;
  }).filter(Boolean).join("\n");

async function sxCopy(){
  const t=sxListText();if(!t)return;
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch(e){}
  if(!ok){
    const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand("copy");}catch(e){}
    ta.remove();
  }
  SLX.msg=ok?"Copied. Paste it into your chat.":"Copy the list below.";
  SLX.copyText=ok?"":t;
  sxPaintOrder();
}

/* ---------- taps and typing ---------- */
function sxClick(e){
  const m=document.getElementById("sxOrder");
  if(m&&e.target===m){sxCloseOrder();return;}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,k=b.dataset.k?decodeURIComponent(b.dataset.k):"",g=b.dataset.g?decodeURIComponent(b.dataset.g):"";
  const S2=sxSups()[SLX.sup];
  if(a==="star"){e.stopPropagation();SLX.favs.has(g)?SLX.favs.delete(g):SLX.favs.add(g);
    try{localStorage.setItem("peps-sx-favs",JSON.stringify([...SLX.favs]));}catch(x){}
    sxPaintList();return;}
  if(a==="toggle"){const ok=SLX.sup+"|"+g;SLX.open[ok]=!SLX.open[ok];sxPaintList();return;}
  if(a==="sup"){SLX.sup=b.dataset.s;SLX.msg="";SLX.copyText="";sxPaint();return;}
  if(a==="cur"){SLX.cur=b.dataset.c;sxPaint();return;}
  if(a==="favf"){SLX.fav=!SLX.fav;sxPaint();return;}
  if(a==="add"){const p=S2.products.find(x=>x.key===k);if(p)sxSet(k,sxStart(p,S2));return;}
  if(a==="plus"||a==="minus"){const p=S2.products.find(x=>x.key===k);if(!p)return;
    const st=sxStep(p,S2),q=SLX.carts[SLX.sup][k]||0;sxSet(k,a==="plus"?q+st:q-st);return;}
  if(a==="tier"){const p=S2.products.find(x=>x.key===k);if(p)sxSet(k,sxTierQty(S2,p,b.dataset.t));return;}
  if(a==="ship"){const sid=SLX.sup,m=b.dataset.m,was=SLX.ship[sid]||{};
    SLX.ship[sid]=m==="custom"?{m:"custom",usd:was.m==="custom"?was.usd:sxShip(sid)}:{m:m};sxSaveShip();sxPaint();return;}
  if(a==="order"){sxOpenOrder();return;}
  if(a==="close"){sxCloseOrder();return;}
  if(a==="copy"){sxCopy();return;}
  if(a==="saveas"){sxSaveAs();return;}
  if(a==="clear"){
    if(!SLX.armed.__clear){SLX.armed.__clear=1;sxPaintOrder();setTimeout(()=>{if(SLX.armed.__clear){delete SLX.armed.__clear;sxPaintOrder();}},3500);return;}
    delete SLX.armed.__clear;SLX.carts[SLX.sup]={};sxSaveCart(SLX.sup);SLX.msg="";sxPaint();return;}
  if(a==="load"){sxLoad(decodeURIComponent(b.dataset.n));return;}
  if(a==="del"){sxDelete(decodeURIComponent(b.dataset.n));return;}
}
function sxChange(e){
  const t=e.target;if(!t||!t.classList)return;
  if(t.classList.contains("sx-shipv")){const v=num(t.value),r=SX_CACHE?SX_CACHE.rate:1.4;
    SLX.ship[SLX.sup]={m:"custom",usd:Math.max(0,SLX.cur==="aud"?v/r:v)};sxSaveShip();sxPaint();return;}
  if(!t.classList.contains("sx-qty"))return;
  const k=decodeURIComponent(t.dataset.k),S2=sxSups()[SLX.sup],p=S2.products.find(x=>x.key===k);if(!p)return;
  const n=num(t.value);sxSet(k,p.box?n*p.box:n);
}

(function(){
  var embedded=false; try{ embedded = window.top!==window.self; }catch(e){ embedded=true; }

  var direct = location.origin + location.pathname;
  function box(){
    var d=document.createElement("div");
    d.style.cssText="position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;background:#7f1d1d;color:#fee2e2;"+

      'Open it on its own and it will stick.'+
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<a id="openDirect" href="'+direct+'" target="_top" style="background:#fecaca;color:#7f1d1d;border-radius:8px;padding:8px 13px;text-decoration:none;font-weight:700">Open it properly</a>'+
      '<button id="dismissEmbed" style="background:transparent;color:#fecaca;border:1px solid #fecaca;border-radius:8px;padding:8px 13px;font-weight:600">Not now</button>'+

    document.body.appendChild(d);
    d.querySelector("#dismissEmbed").addEventListener("click",function(){d.remove();});
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",box); else box();
})();
