function rOverview(){
  // Leave the page alone while a reorder number is being typed, so a refresh cannot wipe it.
  const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains("ro-q")&&document.getElementById("roBox"))return;
  const d=D.dashboard,o=D.orders;
  // Order status counts
  // One order is one customer on one day, the way the order page writes them. These used to
  // count product lines, so a three product order counted as three orders.
  const ordKey=x=>fuNorm(x.customer)+"|"+String(x.date||"").trim();
  const named=o.filter(x=>String(x.customer||"").trim());
  // Real customer orders only, counted the way the Sales tab counts them: one client on one
  // day, with something actually sold. Partner stock pulls and free vial only drops are not
  // orders, and neither is anything cancelled or refunded.
  const custOrd={};
  named.forEach(x=>{
    if(x.ownerPurchase==="Yes"||/cancel|refund|void/i.test(String(x.fulfilment||"")+" "+String(x.payStatus||"")))return;
    const k=ordKey(x),c=custOrd[k]||(custOrd[k]={sold:0,done:false});
    if(String(x.freeVial||"").trim().toLowerCase()!=="yes")c.sold+=x.lineTotal||0;
    if((x.fulfilment==="Completed"||x.fulfilment==="Delivered")&&(x.payStatus==="Paid"||x.payStatus==="Part Paid"))c.done=true;
  });
  const realOrders=Object.values(custOrd).filter(c=>c.sold>0);
  const delivered=realOrders.filter(c=>c.done).length;
  const totalOrders=realOrders.length;

  // Three Kanban buckets — computed directly from Customer_Orders so each line always
  // shows name + products + amount (no longer reads the manually-typed Dashboard cells).
  const shortP=p=>String(p).replace(/\s*\([^)]*\)/g,"").trim();
  const buildBucket=(filterFn,amountKey)=>{
    const by={};
    o.forEach(x=>{
      if(!filterFn(x))return;
      const name=String(x.customer||"").trim();if(!name)return;
      if(!by[name])by[name]={name:fuBaseName(name)||name,items:{},amt:0};   // shown without the referral tail
      const pn=shortP(x.product)||"item";
      by[name].items[pn]=(by[name].items[pn]||0)+(x.qty||1);
      by[name].amt+=(amountKey==="owed"?owed(x):(x[amountKey]||0));
    });
    return Object.values(by).map(c=>{
      const prods=Object.entries(c.items).map(([p,q])=>q>1?p+" x"+q:p).join(", ");
      return {name:c.name,detail:prods,amt:c.amt>0?fmt(c.amt):"",raw:c.amt};
    }).sort((a,b)=>a.name.localeCompare(b.name));
  };
  const bucketTot=list=>list.reduce((s,x)=>s+(x.raw||0),0);
  const doneStatuses=["completed","delivered","sent"];   // "Sent" means it's gone, so it's finished too
  const notDone=x=>doneStatuses.indexOf(String(x.fulfilment||"").trim().toLowerCase())<0;
  // The three boxes follow an order along: not packed yet, then packed and waiting to go,
  // then sent and waiting on payment. An order is only asked for money once it has gone out.
  // Cancelled or refunded orders never need packing, sending or paying, so they stay out.
  // Your own purchases stay out too: they are stock moving, not a customer order.
  const dead=x=>x.ownerPurchase==="Yes"||/cancel|refund|void/i.test(String(x.fulfilment||"")+" "+String(x.payStatus||""));
  const isPacked=x=>/^yes$/i.test(String(x.packed||"").trim())||String(x.fulfilment||"").trim().toLowerCase()==="packed";
  // What the customer actually owes on a line: nothing for a free vial, and store credit
  // already used comes off. Credit is only on one line of an order, so it is only taken off
  // once, and never below zero.
  const owed=x=>{
    const free=String(x.freeVial||"").trim().toLowerCase()==="yes";
    return Math.max(0,(free?0:(x.lineTotal||0))-(x.creditUsed||0));
  };
  // Needs Action: not packed yet, paid or not
  const needsActionList=buildBucket(x=>!dead(x)&&notDone(x)&&!isPacked(x),"owed");
  // Packed and Ready to Send: packed but not sent yet
  const packedList=buildBucket(x=>!dead(x)&&notDone(x)&&isPacked(x),"owed");
  // Client Received and Requires Payment: sent or completed, still unpaid
  const readyToPayList=buildBucket(x=>!dead(x)&&!notDone(x)&&x.payStatus==="Unpaid","owed");

  // Bank balance: read directly from Dashboard tab cell D6
  const adjBankBalance=(d.bankBalance||0);
  // PayPal balance from Dashboard tab cell D7
  const paypalBal=(d.paypal||0);
  // Cash on Hand from Dashboard tab cell D8
  const cashOnHand=(d.cashOnHand||0);
  // Total held: prefer Dashboard tab "Total" cell; fall back to bank+paypal+cash if blank
  const totalHeld=(d.totalCash||0)||(adjBankBalance+cashOnHand);

  const totalRevenue=o.filter(x=>x.payStatus==="Paid"||x.payStatus==="Part Paid").reduce((s,x)=>s+x.amountReceived,0);
  const totalTrueProfit=o.filter(x=>x.payStatus==="Paid"||x.payStatus==="Part Paid").reduce((s,x)=>s+x.profit,0);

  // Profit this week / this month — from PAID orders only, by Order Date
  const today=new Date();
  const dayOfWeek=(today.getDay()+6)%7; // Monday=0
  const weekStart=new Date(today);weekStart.setHours(0,0,0,0);weekStart.setDate(today.getDate()-dayOfWeek);
  const monthStart=new Date(today.getFullYear(),today.getMonth(),1);
  const orderDateObj=(s)=>{const m=String(s||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)return null;return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));};

  let weekProfit=0,monthProfit=0,weekCount=0,monthCount=0;
  let weekVials=0,monthVials=0,lifetimeVials=0;
  let weekRevenue=0,monthRevenue=0;
  let firstOrderDate=null;
  const weekBySku={},monthBySku={},lifetimeBySku={};
  const soldBySku={},soldByName={};   // lifetime vials sold, for reorder sizing (by velocity)
  o.forEach(x=>{
    if(x.payStatus!=="Paid"&&x.payStatus!=="Part Paid")return;
    const od=orderDateObj(x.date);if(!od)return;
    if(!firstOrderDate||od<firstOrderDate)firstOrderDate=od;
    const qty=x.qty||0;
    const skuName=x.product||x.sku||"Unknown";
    const vq=(x.freeVial!=="Yes"&&!slIsBac(x))?qty:0;      // vials sold: no bac water, no freebies, same as the Sales tab
    lifetimeVials+=vq;
    if(vq)lifetimeBySku[skuName]=(lifetimeBySku[skuName]||0)+vq;
    if(od>=monthStart){monthProfit+=x.profit;monthCount++;monthVials+=vq;monthRevenue+=x.amountReceived;if(vq)monthBySku[skuName]=(monthBySku[skuName]||0)+vq;}
    if(od>=weekStart){weekProfit+=x.profit;weekCount++;weekVials+=vq;weekRevenue+=x.amountReceived;if(vq)weekBySku[skuName]=(weekBySku[skuName]||0)+vq;}
  });
  // How fast stock goes out, for reordering: every line that took stock, paid or not, free
  // vials and partners included. Only cancelled or refunded lines are left out. Matched to the
  // Inventory rows the same way lab orders are, so RETAT20 counts against the 20mg row and a
  // SKU with a stray space, like Klow, still lines up.
  const stockOut={};
  o.forEach(x=>{
    if(/cancel|refund|void/i.test(String(x.fulfilment||"")+" "+String(x.payStatus||"")))return;
    const qty=x.qty||0;if(!qty)return;
    const k=String(x.sku||"").trim().toUpperCase();if(k)stockOut[k]=(stockOut[k]||0)+qty;
    const pnm=shortP(x.product);if(pnm)soldByName[pnm.toLowerCase()]=(soldByName[pnm.toLowerCase()]||0)+qty;
  });
  const invSold=i=>Object.keys(stockOut).reduce((t,k)=>t+(labMatchesInv({sku:k,product:""},i)?stockOut[k]:0),0);
  const fmtBreakdown=(obj)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);if(e.length===0)return"No vials sold yet";return e.map(([n,c])=>esc(n)+': '+c).join(', ');};
  const monthBreakdown=fmtBreakdown(monthBySku);
  const lifetimeBreakdown=fmtBreakdown(lifetimeBySku);

  // Average revenue per month since the business started (first paid order → now)
  let monthsElapsed=1;
  if(firstOrderDate){monthsElapsed=(today.getFullYear()-firstOrderDate.getFullYear())*12+(today.getMonth()-firstOrderDate.getMonth())+1;if(monthsElapsed<1)monthsElapsed=1;}

  // Weekly run rate off the actual days traded, not month/4, so it doesn't drift.
  const daysTrading=firstOrderDate?Math.max(7,Math.round((today-firstOrderDate)/86400000)+1):7;
  const avgRevPerWeek=totalRevenue/(daysTrading/7);
  // Months off the actual days traded too. Counting calendar months counted this part month
  // as a whole one, which dragged the monthly average down.
  const monthsTrading=daysTrading/30.44;
  const avgRevPerMonth=totalRevenue/monthsTrading;
  // Owners come from the Partner Summary, so this follows along if the line-up changes.
  const ownerNames=(D.partnerDetail||[]).map(x=>String(x.person||"").trim()).filter(Boolean);
  const ownerCount=Math.max(1,ownerNames.length);
  const perOwnerWeek=avgRevPerWeek/ownerCount;
  // Expenses: keep the tracked figure from the sheet, then add a $200/month estimate for
  // consumables (printing, bags, boxes, labels) from June 2026, when the Money tab stopped.
  const consumables=consumablesSoFar(today);
  const estExpenses=(d.totalExpenses||0)+consumables;
  const sinceStr=firstOrderDate?firstOrderDate.toLocaleDateString('en-AU',{month:'short',year:'numeric'}):"start";

  // ---- Reorder alert: what's low, minus what's already on the way, sized by how fast it sells ----
  // Getting low ≤15 units, critically low ≤10 units. Order today → arrives ~2 weeks out.
  const HORIZON_NOW=14, HORIZON_SOON=42, LOW_STOCK=15, LEAD_DAYS=14, COVER_MONTHS=2;
  const arriveDate=new Date(today.getTime());arriveDate.setDate(arriveDate.getDate()+LEAD_DAYS);
  const arriveStr=arriveDate.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

  // Stock already ordered from the lab and still "Processing" — don't reorder what's coming.
  // Match to inventory by SKU. Handles variant SKUs too: a lab "RETAT20" matches the 20mg
  // inventory row (SKU "RETAT") by checking the strength, so it doesn't get confused with 15mg.
  // Anything on the Lab Orders tab that has not been received yet is still on the way.
  // The sheet uses "Ordered", older rows used "Processing", so go by what is NOT finished.
  // That way a new status word still counts as incoming instead of being silently missed.
  const LAB_DONE=["received","cancelled","canceled","complete","completed","refunded","returned"];
  const processing=D.lab.filter(l=>(l.qty||0)>0 && LAB_DONE.indexOf(String(l.status||"").trim().toLowerCase())<0);
  const digits=s=>String(s||"").replace(/[^0-9]/g,"");
  function labMatchesInv(l,i){
    const ls=String(l.sku||"").trim().toUpperCase(), is=String(i.sku||"").trim().toUpperCase();
    if(!ls||!is)return false;
    if(ls===is)return true;                                   // same SKU
    if(ls.startsWith(is)){const suf=digits(ls.slice(is.length));return !!suf && digits(i.name).indexOf(suf)>=0;} // e.g. RETAT20 → 20mg row
    if(is.startsWith(ls)){const suf=digits(is.slice(ls.length));return !!suf && digits(l.product).indexOf(suf)>=0;}
    return false;
  }
  const incomingFor=(i)=>{let sum=0;processing.forEach(l=>{if(labMatchesInv(l,i))sum+=(l.qty||0);});return sum;};

  const invRows=D.inventory
    .filter(i=>String(i.name||"").trim())
    .map(i=>{
      const incoming=incomingFor(i);
      const effective=i.total+incoming;                                   // on shelf + on the way
      const nm=shortP(i.name).toLowerCase(),sizes=D.inventory.filter(j=>shortP(j.name).toLowerCase()===nm).length;
      const sold=invSold(i)||(sizes>1?0:soldByName[nm])||0;              // by name only when there is one size
      const perMonth=sold/monthsTrading;                                  // average sales velocity
      const perDay=perMonth/30.44;
      const runway=perDay>0?effective/perDay:(effective<=0?0:99999);      // days of stock left at that rate
      const target=Math.max(10,Math.ceil((perMonth*COVER_MONTHS)/10)*10); // aim for ~2 months cover, in 10s
      const shortfall=target-effective;
      const orderQty=shortfall<=0?0:Math.max(10,Math.ceil(shortfall/10)*10); // 0 = already covered (incl. what's coming)
      return {name:roName(i),total:i.total,incoming,effective,perMonth,runway,orderQty,unitCost:i.unitCost||0,cost:(i.unitCost||0)*orderQty,outNow:effective<=0,key:roKeyOf(i)};
    })
  ;
  const lowStockAll=invRows
    .filter(s=> s.outNow || s.effective<=LOW_STOCK || s.runway<=HORIZON_SOON )   // low on the shelf, or running down, or out
    .sort((a,b)=>a.runway-b.runway);
  // Already on order from the lab, or already covered, so it does not belong on a buy list.
  // Kept in a short line underneath so nothing disappears without a reason.
  // Built from the whole inventory, not just the low list, because a well covered item
  // drops out of the low list entirely once its incoming stock is counted.
  const onOrder=D.inventory.filter(i=>String(i.name||"").trim())
    .map(i=>({name:roName(i),incoming:incomingFor(i)}))
    .filter(x=>x.incoming>0);
  const lowStock=lowStockAll.filter(s=>s.incoming<=0 && s.orderQty>0);
  const onOrderNote=onOrder.length
    ?'<div style="font-size:13px;color:var(--cyan);padding-top:9px;margin-top:5px;border-top:1px solid var(--bd)"><span style="font-weight:600">Already on order, left out:</span> <span style="color:var(--mut)">'+onOrder.map(x=>esc(x.name)+' +'+x.incoming).join(', ')+'</span></div>'
    :'';
  const orderTotal=lowStock.reduce((s,x)=>s+(x.cost||0),0);              // AUD to buy the order-now + top-up items
  const missingCost=lowStock.some(x=>x.orderQty>0 && !x.unitCost);       // a product with no cost on file
  RO={all:invRows,suggest:lowStock,onOrderNote:onOrderNote,now:HORIZON_NOW};
  // How many of each product sold each month, per strength, on the Sales tab's rule: customer
  // orders, no bac water, freebies, partner buys or cancelled orders. Newest month first.
  const soldHtml=(function(){
    const S=slData();if(!S.first)return "";
    S.famCache={};
    const ms=[];for(let i=0;i<6;i++){const a=new Date(today.getFullYear(),today.getMonth()-i,1);if(new Date(a.getFullYear(),a.getMonth()+1,1)<=S.first)break;ms.push(a);}
    const mk=x=>x.getFullYear()*12+x.getMonth(),rows={};
    S.lines.forEach(L=>{
      if(L.free||L.bac)return;
      const f=slFam(S,L.k,L.name),label=f.label+(f.strength?" "+f.strength:"");
      const q=rows[label]||(rows[label]={label,by:{},sum:0,avg:0});
      const k=mk(L.d);q.by[k]=(q.by[k]||0)+L.qty;
    });
    const keys=ms.map(mk),full=ms.slice(1);          // the first month is this one, still going
    const list=Object.values(rows).map(q=>{
      q.sum=keys.reduce((t,k)=>t+(q.by[k]||0),0);
      q.avg=full.length?full.reduce((t,a)=>t+(q.by[mk(a)]||0),0)/full.length:(q.by[keys[0]]||0);
      return q;}).filter(q=>q.sum>0).sort((a,b)=>b.sum-a.sum||a.label.localeCompare(b.label));
    if(!list.length)return "";
    const cell=v=>'<td class="cm" style="text-align:center'+(v?'':';color:var(--mut)')+'">'+slNum(v)+'</td>';
    return '<div class="sh" style="margin-top:8px"><h2>Sold Each Month</h2><div style="font-size:13px;color:var(--dim);margin-top:2px">Vials sold of each product, same count as the Sales tab. '+
      SL_MON[today.getMonth()]+' is so far this month. Avg is a month, over the full months shown.</div></div>'+
      '<div class="tw sold-m"><div class="ts"><table><thead><tr><th>Product</th>'+
      ms.map((a,i)=>'<th style="text-align:center">'+SL_MON[a.getMonth()]+(i===0?'<div style="font-weight:400;font-size:11px;color:var(--mut)">so far</div>':'')+'</th>').join('')+
      '<th style="text-align:center">Avg</th></tr></thead><tbody>'+
      list.map(q=>'<tr><td>'+esc(q.label)+'</td>'+keys.map(k=>cell(q.by[k]||0)).join('')+'<td class="cm" style="text-align:center;color:var(--cyan)">'+slOne(q.avg)+'</td></tr>').join('')+
      '</tbody></table></div></div>';
  })();

  // Free vial stats
  const freeVials=o.filter(x=>x.freeVial==="Yes");
  const freeVialCount=freeVials.reduce((s,x)=>s+x.qty,0);
  const freeVialValue=freeVials.reduce((s,x)=>s+(x.unitCost!=null?(x.qty||0)*x.unitCost:(x.lineTotal||0)),0);   // what they cost us
  const freeByPerson={};
  freeVials.forEach(x=>{const p=x.responsible||"Unknown";freeByPerson[p]=(freeByPerson[p]||0)+x.qty;});
  // who gave them out, only when the sheet actually says; otherwise it just read Unknown
  const freeByStr=Object.entries(freeByPerson).filter(([p])=>p!=="Unknown").map(([p,c])=>esc(p)+': '+c).join(', ');

  // Stock holdings per person, straight off the Inventory_Summary columns.
  // All values displayed ex-GST
  const priceBySku={};D.products.forEach(p=>{priceBySku[p.sku]={cost:p.cost,sellPrice:p.netPrice};});
  const holdPeople=["Storage"].concat(D.partnerNames||[]);
  const holdings={};holdPeople.forEach(hp=>{holdings[hp]={units:0,costValue:0,sellValue:0,items:[]};});
  D.inventory.forEach(i=>{
    const pr=priceBySku[i.sku]||{cost:i.unitCost,sellPrice:i.netPrice};
    holdPeople.forEach(person=>{
      const qty=person==="Storage"?(i.storage||0):(((i.held||{})[person])||0);
      if(qty>0){
        holdings[person].units+=qty;
        holdings[person].costValue+=qty*pr.cost;
        holdings[person].sellValue+=qty*pr.sellPrice;
        holdings[person].items.push({sku:i.sku,name:i.name,qty,cost:qty*pr.cost,sell:qty*pr.sellPrice});
      }
    });
  });


  // Kanban bucket renderer — each item is {name, detail}
  const renderBucketList=(list,emptyMsg)=>{
    if(!list.length)return'<div style="color:var(--dim);font-size:13px;font-style:italic;padding:8px 0">'+emptyMsg+'</div>';
    return list.map(c=>'<div style="padding:4px 0;font-size:14px;color:var(--fg);line-height:1.4"><span style="font-weight:600">'+esc(c.name)+'</span>'+(c.detail?': <span style="color:var(--dim)">'+esc(c.detail)+'</span>':'')+(c.amt?' <span style="color:var(--green);font-weight:600">'+esc(c.amt)+'</span>':'')+'</div>').join('');
  };

  document.getElementById("sec-overview").innerHTML=
  // Order action cards — Kanban style
  '<div class="sh"><h2>Customer Orders</h2><span class="badge">'+totalOrders+' total</span></div>'+
  '<div class="mg mg3">'+
    '<div class="mc" style="border-color:var(--red);min-height:120px"><div class="mc-l" style="color:var(--red)">Needs Action</div><div class="mc-v c-neg cm" style="font-size:24px">'+needsActionList.length+'</div>'+(needsActionList.length?'<div class="cm" style="font-size:14px;color:var(--red);font-weight:600;margin:1px 0 5px">'+fmt(bucketTot(needsActionList))+' in orders</div>':'<div style="margin-bottom:6px"></div>')+'<div style="border-top:1px solid var(--bd);padding-top:8px">'+renderBucketList(needsActionList,"Nothing pending")+'</div></div>'+
    '<div class="mc" style="border-color:var(--amber);min-height:120px"><div class="mc-l" style="color:var(--amber)">Packed and Ready to Send</div><div class="mc-v c-warn cm" style="font-size:24px">'+packedList.length+'</div>'+(packedList.length?'<div class="cm" style="font-size:14px;color:var(--amber);font-weight:600;margin:1px 0 5px">'+fmt(bucketTot(packedList))+' in orders</div>':'<div style="margin-bottom:6px"></div>')+'<div style="border-top:1px solid var(--bd);padding-top:8px">'+renderBucketList(packedList,"Nothing to send")+'</div></div>'+
    '<div class="mc" style="border-color:var(--green);min-height:120px"><div class="mc-l" style="color:var(--green)">Client Received and Requires Payment</div><div class="mc-v c-pos cm" style="font-size:24px">'+readyToPayList.length+'</div>'+(readyToPayList.length?'<div class="cm" style="font-size:14px;color:var(--green);font-weight:600;margin:1px 0 5px">'+fmt(bucketTot(readyToPayList))+' to collect</div>':'<div style="margin-bottom:6px"></div>')+'<div style="border-top:1px solid var(--bd);padding-top:8px">'+renderBucketList(readyToPayList,"Nothing outstanding")+'</div></div>'+
  '</div>'+
  '<div class="mg mg2" style="margin-top:10px">'+
    '<div class="mc" style="border-color:var(--green)"><div class="mc-l">Delivered</div><div class="mc-v c-pos cm">'+delivered+'</div><div class="mc-s">Paid and completed customer orders</div></div>'+
    '<div class="mc" style="border-color:var(--purple)"><div class="mc-l">Free Vials Given</div><div class="mc-v cm" style="color:var(--purple)">'+freeVialCount+'</div><div class="mc-s">'+fmt(freeVialValue)+' in stock cost'+(freeByStr?', '+freeByStr:'')+'</div></div>'+
  '</div>'+
  // Reorder: what is low, sized by how fast it sells. Change how many, skip what you will not
  // order, or add something, and the cost adds up as you go. Picks sync across devices.
  '<div class="sh" style="margin-top:8px"><h2>Reorder Alert</h2><div style="font-size:13px;color:var(--dim);margin-top:2px">Low stock to top up. Change how many, skip what you won\'t order, or add something, and the cost updates. Anything already on order from the lab is left out. Order today, arrives around '+arriveStr+'</div></div>'+
  '<div id="roBox">'+roHtml()+'</div>'+
  soldHtml+
  // Financial snapshot
  '<div class="sh" style="margin-top:8px"><h2>Financial Snapshot</h2></div>'+
  // Money held row: bank, cash and the total, all from Dashboard tab manual cells
  '<div class="mg mg3 mgk">'+
    '<div class="mc" style="background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(34,197,94,.02));border-color:rgba(34,197,94,.25)"><div class="mc-l">Bank Balance</div><div class="mc-v '+(adjBankBalance<0?"c-neg":"c-pos")+' cm">'+fmt(adjBankBalance)+'</div><div class="mc-s">Money in the bank account</div></div>'+
    '<div class="mc" style="background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(34,211,238,.02));border-color:rgba(34,211,238,.25)"><div class="mc-l">Cash on Hand</div><div class="mc-v c-pos cm">'+fmt(cashOnHand)+'</div><div class="mc-s">Physical cash held</div></div>'+
    '<div class="mc" style="background:linear-gradient(135deg,rgba(168,139,250,.1),rgba(168,139,250,.03));border-color:rgba(168,139,250,.35)"><div class="mc-l">Total Held</div><div class="mc-v cm" style="color:var(--purple)">'+fmt(totalHeld)+'</div><div class="mc-s">Bank + cash</div></div>'+
  '</div>'+
  '<div class="mg mg4" style="margin-top:8px">'+
    '<div class="mc"><div class="mc-l">Owes Partners</div><div class="mc-v c-warn cm">'+fmt(d.accountOwesPartners)+'</div></div>'+
    '<div class="mc"><div class="mc-l">Total Expenses</div><div class="mc-v c-neut cm">'+fmt(estExpenses)+'</div><div class="mc-s">'+fmt(d.totalExpenses||0)+' tracked plus '+fmt(consumables)+' consumables, $'+CONSUMABLES_A_MONTH+' a month since '+CONSUMABLES_FROM.toLocaleDateString('en-AU',{month:'long'})+'</div></div>'+
    '<div class="mc"><div class="mc-l">Total Lab Cost</div><div class="mc-v c-pos cm">'+fmt(d.totalLabOrders)+'</div><div class="mc-s">Lifetime lab spend, received + pending</div></div>'+
    '<div class="mc"><div class="mc-l">Stock at Sell Price</div><div class="mc-v c-pos cm">'+fmt(d.potRevenue)+'</div><div class="mc-s">'+(d.totalUnits||0)+' units on shelf at sell price</div></div>'+
    '<div class="mc"><div class="mc-l">Active Products</div><div class="mc-v c-neut cm">'+D.products.filter(p=>/^active$/i.test(String(p.status||"").trim())).length+'</div></div>'+
  '</div>'+
  // Categories
  // Partners
  '<div class="sh" style="margin-top:24px"><h2>Partner Balances & Stock</h2></div>'+
  '<div class="mg mg3">'+D.partnerDetail.map((p,pi)=>{
    const col=PTR_COLS[pi%PTR_COLS.length];
    const h=holdings[p.person]||{units:0,costValue:0,sellValue:0,items:[]};
    const itemsBreakdown=h.items.length?h.items.map(it=>'<div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:var(--dim)"><span>'+esc(it.name)+'</span><span class="cm">'+it.qty+' units</span></div>').join(""):'<div style="font-size:13px;color:var(--mut);font-style:italic">No stock currently held</div>';
    return'<div class="ptr-card">'+
      '<div class="ptr-nm" style="color:'+col+'">'+esc(p.person)+'</div>'+
      '<div class="ptr-row"><span class="ptr-rl">Account owes</span><span class="ptr-rv c-warn">'+fmt(p.accountOwes)+'</span></div>'+
      '<div class="ptr-row"><span class="ptr-rl">Net position</span><span class="ptr-rv c-pos">'+fmt(p.netPosition)+'</span></div>'+
      '<div class="ptr-row"><span class="ptr-rl">Units held</span><span class="ptr-rv">'+h.units+'</span></div>'+
      '<div class="ptr-row"><span class="ptr-rl">Stock at cost</span><span class="ptr-rv c-dim">'+fmt(h.costValue)+'</span></div>'+
      '<div class="ptr-row"><span class="ptr-rl">Stock at sell price</span><span class="ptr-rv c-pos">'+fmt(h.sellValue)+'</span></div>'+
      (h.items.length?'<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bdr)"><div class="ptr-exp-h">Breakdown</div>'+itemsBreakdown+'</div>':"")+
    '</div>';
  }).join("")+'</div>'+
  "";
}

let ordersFilter="all";
let ordersSearch="";

function parseOrderDate(s){
  if(!s)return 0;
  const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return parseInt(m[3])*10000+parseInt(m[2])*100+parseInt(m[1]);

/* ================= Referral store credit =================
 * The EARN page promises 2 referrals = $30, 3 = $50, 4 = a free vial and the count restarts.
 * Nothing in the system ever paid the dollars out, so the page contradicted its own terms.
 * This works the money out from the referral counts.
 *
 * Driven by REFERRAL COUNT, never by the "Free Vial? = Yes" flag. That flag marks any freebie
 * or replacement given out, so going off it would bank $50 nobody earned and would also wipe
 * real referral progress for anyone handed a goodwill vial.
 */
// STACKED: the 2nd referral pays $30, the 3rd pays another $50, so a full cycle banks $80.
const REF_TIER_2=30, REF_TIER_3=50, REF_CYCLE_CREDIT=REF_TIER_2+REF_TIER_3, CREDIT_CAP=200;
const PER_ORDER_CAP=100;   // most credit usable on any one order, matching the EARN terms
// Anyone on a 3 referral deal is listed in the hub script, so no names sit in this public file.
function refTargetFor(name){return ((D&&D.refTarget3)||[]).map(fuNorm).indexOf(fuNorm(fuShort(name)))>=0?3:4;}
// The referral tag carries a short name, and short names are not unique: two clients can share
// a first name. Matching on the short name alone paid the wrong one. So the tag is resolved
// against the real client list, and the referral chain inside it breaks the tie: the tag says
// which of the two came from which referrer.
function refWhoReferred(name){                              // who referred THIS person, short name
  const m=String(name||"").match(/\(\s*referral\s+(.+)\)\s*$/i);
  return m?fuNorm(fuShort(m[1])):"";
}
function refResolve(tag,clients){
  const tb=fuNorm(fuShort(tag));
  if(!tb)return "";
  const tagChain=refWhoReferred(tag);                       // eg "person c" out of "Person B (Referral Person C)"
  let best="",bestScore=-1;
  clients.forEach(full=>{
    const cb=fuNorm(fuShort(full));
    // The client name must BE the tag name or extend it on a word boundary, so a tag of "Sam"
    // can reach "Sam Smith" but can never grab "Samuel".
    if(cb!==tb && cb.indexOf(tb+" ")!==0)return;
    let sc=0;
    if(tagChain && refWhoReferred(full)===tagChain)sc+=4;    // same referral chain, strongest signal
    if(cb===tb)sc+=1;                                        // exact short name, weaker
    if(sc>bestScore){bestScore=sc;best=full;}
  });
  return best;
}
let _refCache=null,_refCacheFor=null;
function refCounts(){
  if(_refCache&&_refCacheFor===D)return _refCache;
  const seen={},clients=[];
  ((D&&D.orders)||[]).forEach(o=>{
    const nm=String(o.customer||"").trim(); if(!nm)return;
    const k=fuNorm(nm); if(seen[k])return;                  // once per person, not once per order row
    seen[k]=1; clients.push(nm);
  });
  const c={};
  clients.forEach(nm=>{
    if(!refWhoReferred(nm))return;
    const m=nm.match(/\(\s*referral\s+(.+)\)\s*$/i);       // greedy + anchored so nested tags parse
    const who=refResolve(m[1],clients);
    if(who)c[fuNorm(who)]=(c[fuNorm(who)]||0)+1;            // keyed on the FULL name, so the two Katies stay apart
  });
  _refCache=c;_refCacheFor=D;return c;
}
function refCountFor(name){return refCounts()[fuNorm(name)]||0;}
// Each completed cycle banks $80 ($30 at 2 plus $50 at 3), then the current part-cycle
// pays whatever it has reached so far. Milestones ADD, they do not replace each other.
function refCreditFor(name){
  const n=refCountFor(name), T=refTargetFor(name);
  const done=Math.floor(n/T), cyc=n-done*T;
  return done*REF_CYCLE_CREDIT+(cyc>=3?REF_TIER_2+REF_TIER_3:cyc>=2?REF_TIER_2:0);
}
// Manual credit adjustments: a "Bonus Credit ($)" column on the Dashboard points block.
// Type a dollar amount next to a person for gifts, overpayments or corrections (negatives
// allowed). If the column does not exist yet, this is just an empty map and nothing changes.
let _bonusCache=null,_bonusCacheFor=null;
function fuBonusMap(){
  if(_bonusCache&&_bonusCacheFor===D)return _bonusCache;
  // The Bonus tab: Name | Amount, typed by hand. Kept OFF the Dashboard points block on
  // purpose - that block re-sorts itself when new customers appear, so a typed value there
  // drifts onto whoever slides into the row. A separate tab cannot move under you.
  // Exact name wins; a short name (tags stripped) only pays when it matches one person.
  const m={},base={};
  ((D&&D.rawBonus)||[]).forEach(r=>{
    if(!r)return;
    const nm=String(r[0]||"").trim();
    if(!nm||/^name$/i.test(nm))return;
    const amt=num(r[1]);
    if(!amt&&String(r[1]||"").trim()!=="0")if(isNaN(parseFloat(String(r[1]))))return;
    const k=fuNorm(nm),b=fuNorm(fuBaseName(nm));
    m[k]=(m[k]||0)+amt;
    if(!base[b])base[b]={n:0,amt:0};
    base[b].n++;base[b].amt+=amt;
  });
  const out={exact:m,base:base};
  _bonusCache=out;_bonusCacheFor=D;return out;
}
function fuBonusFor(name){
  const b=fuBonusMap();
  const k=fuNorm(name);
  if(b.exact[k]!=null)return b.exact[k];
  // A bonus typed with a short name only pays via the base name when exactly ONE client
  // carries that base name. Two clients sharing a base name = a short row with that name pays
  // neither, rather than quietly paying both.
  const bk=fuNorm(fuBaseName(name));
  const bb=b.base[bk];
  if(!bb)return 0;
  let owners=0;const seen={};
  ((D&&D.orders)||[]).forEach(o=>{const nm=String(o.customer||"").trim();if(!nm)return;const kk=fuNorm(nm);if(seen[kk])return;seen[kk]=1;if(fuNorm(fuBaseName(nm))===bk)owners++;});
  return owners===1?bb.amt:0;
}
// The one place that decides what a client's credit is: monthly spend from the sheet, plus
// referrals, plus any typed bonus, minus whatever they have already spent. The $200 cap is on
// the balance they hold, the way their rewards page explains it, not on what they can ever
// earn, so once they use some they start earning again. Same rule as the rewards script.
function creditFor(name,sheetBalance,used){
  const referral=refCreditFor(name);
  const bonus=fuBonusFor(name);
  const earned=Math.max(0,(sheetBalance||0)+referral+bonus);
  const u=used||0,available=Math.max(0,Math.min(CREDIT_CAP,earned-u));
  return {earned,referral,bonus,used:u,available,atCap:available>=CREDIT_CAP};
}
function fuMoney(v){const r=Math.round(v*100)/100;return "$"+(r%1===0?r.toLocaleString("en-AU"):r.toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2}));}
// Plain-English runway for a quoted line, so they can see what's urgent and what's just
// topping up while we're at it.
function fuLeft(d){
  if(d==null)return "";
  if(d<=3)return " (you're about out of this one)";
  if(d<=8)return " (about a week left)";
  const w=Math.round(d/7);
  return " (about "+w+" weeks left)";
}
function fuQuote(cost){
  if(!cost||!cost.items||!cost.items.length)return "";
  const lines=cost.items.map(it=>"• "+it.label+(it.price?" for "+fuMoney(it.price):"")+fuLeft(it.daysLeft)).join("\n");
  const bac=cost.bacPrice?("\n• "+cost.bacName+" to go with it for "+fuMoney(cost.bacPrice)):"";
  if(cost.cash){
    // Cash is the discounted rate and it's pickup, so say both plainly, then offer the
    // posted option with its real price so they don't have to ask what it'd cost.
    const alt=cost.altTotal
      ? "\n\nIf you'd rather it posted, transfer pricing is "+fuMoney(cost.altTotal)+
        (cost.altPost?" including express post":" with free express post")+". Just say the word."
      : "";
    return "\n\nHere's what you'd be grabbing:\n"+lines+bac+
      "\n\nComes to about "+fuMoney(cost.total)+" all up. That's the discounted cash price for pickup."+alt;
  }
  const post="\n• "+(cost.postage?"Postage "+fuMoney(cost.postage):"Free postage on this one");
  // Cash clients were being told the transfer price but not the other way round. Even it up.
  const alt=cost.altTotal
    ? "\n\nIf you'd rather pay cash and pick up, that comes to "+fuMoney(cost.altTotal)+". Just say the word."
    : "";
  return "\n\nHere's what you'd be grabbing:\n"+lines+bac+post+"\n\nComes to about "+fuMoney(cost.total)+" all up."+alt;
}

    // alongside a purchase, so it leaves at least $20 to pay on the order being quoted.

    else if(use<rew.credit-0.005)out.push("You've also got "+fuMoney(rew.credit)+" in store credit, happy to take "+fuMoney(use)+" of it off this one.");
    else out.push("You've also got "+fuMoney(rew.credit)+" in store credit sitting there, happy to take that off this one.");
  }

  else if(rew.toVial===1)out.push("You're one referral off a free vial too - get a mate to order and it's yours.");

/* Stock on hand. Products has an "On Hand" column, but it is a lookup that can silently
 * break for a single row - Tesamorelin currently reads 0 there while Inventory_Summary says

 * invStockFor(), the same resolver the Products tab uses (it also handles RETAT15/RETAT20

 * when the product has no inventory row at all.
 * Defined lazily because invStockFor is declared further down the file. */
function stockRows_(p){
  const ps=String(p.sku||"").trim().toLowerCase();
  const inv=(D&&D.inventory)||[];
  if(!ps)return 0;
  return inv.filter(i=>{const is=String(i.sku||"").trim().toLowerCase();return is&&(is===ps||ps.startsWith(is)||is.startsWith(ps));}).length;

// "GHK-Cu (Copper Peptide)" -> {main:"GHK-Cu", sub:"Copper Peptide"}
function ocName(p){

   *    minus what they've already used)

   *  - stock only, never postage, so it can never pay for shipping

  const earnNow=(cr&&!cr.atCap)?ocFutureCredit(sub):0;

  const ok=o=>o.t2.coversAll?null:o;

  if(t.coversAll){
    const usable=Math.min(t.pool,PER_ORDER_CAP);
    const need=Math.max(0,usable-t.sub+1);
    let n=Math.max(1,Math.ceil(need/cheap.v)),t2=add(n);
    for(let i=0;i<40&&t2.coversAll;i++){n++;t2=add(n);}   // keep adding until there is something left for them to pay
    if(n<=OC_MAX_ADD)return ok({why:"terms", n, cheap, t2,
            head:"Option 2 - add "+n+" x "+cheap.label+" and put the credit to work"});
    // It would take a pile of the cheapest product to get there, which is no offer at all. Say what the
    // order has to reach instead and leave what to add up to them.
    return {why:"terms", open:true, usable,
            head:"Option 2 - add to the order and use more of your credit",
            line:"Take the order over "+fuMoney(usable)+" and you can put "+fuMoney(usable)+" of credit on it."+
                 (usable>=PER_ORDER_CAP?" That is the most on any one order.":"")};
  }
  if(ocMode!=="cash"&&t.ship>0){
    const gap=OC_FREE_AT-t.sub;
    if(gap>0){
      const n=Math.ceil(gap/cheap.v);
      // Only worth offering when it is close. Nobody adds seven bac waters to save $12.
      if(n<=OC_MAX_ADD)return ok({why:"postage", n, cheap, t2:add(n),
              head:"Option 2 - add "+n+" x "+cheap.label+" and postage is free"});
    }
  }
  const ms=ocMonthSpend(), nt=ptsNext(ms+t.sub);
  if(nt&&!(t.cr&&t.cr.atCap)){
    const gap=nt.min-(ms+t.sub);
    if(gap>0&&gap<=120){
      const n=Math.ceil(gap/cheap.v);
      const had=ptsFor(ms);   // credit already earned this month, from a lower tier
      if(n<=OC_MAX_ADD)return ok({why:"tier", n, cheap, nt, had, t2:add(n),
              head:"Option 2 - add "+n+" x "+cheap.label+(had>0?" and lift this month's credit to $"+nt.pts:" and earn $"+nt.pts+" credit")});
    }
  }
  return ok({why:"topup", n:1, cheap, t2:add(1),
          head:"Option 2 - add 1 x "+cheap.label});
}
/* Two options for the client, and BOTH must be allowed. If the basket as it stands
   breaks the terms, option 1 becomes the fixed version rather than the broken one. */
function ocSummaryBoth(){
  const t=ocTotals();
  if(!t.lines.length)return "";
  const b=ocOptionB();

  let aT=t, aHead="Option 1", lead="", why="";
  /* Opener. If they have real credit banked, say well done for it, because they earned it.
     Then point them at the terms on their own rewards page so the rules come from there
     rather than from us telling them what they cannot do. */
  const bank=(t.cr&&t.cr.available)||0;
  const link=ocCust?earnLink(ocCust):"";   // blank until that customer has a key on the sheet
  const hi=ocCust?("Hey "+fuFirst(ocCust)+"!"):"Hey!";
  let praise="";
  if(bank>=100)      praise=" You have built up "+fuMoney(bank)+" in credit now, which is a solid effort, thank you for sticking with us.";
  else if(bank>=50)  praise=" Nice work getting your credit up to "+fuMoney(bank)+".";
  else if(bank>0)    praise=" You have "+fuMoney(bank)+" credit sitting there ready to go.";
  if(t.coversAll){
    const legal=Math.max(0,t.sub-OC_MIN_PAY);
    aT=ocWithCredit(t,legal);
    aHead = legal>0 ? "Option 1 - use "+fuMoney(legal)+" credit, pay "+fuMoney(aT.toPay)
                    : "Option 1 - pay this one in full and keep your credit";
    lead=hi+praise+" Credit is meant to sit alongside an order rather than cover one on its own, so here are two ways that work for this one:";
  }else{
    lead=hi+praise+" Two ways to do this:";
  }
  const tail=link?"\n\nAll the rewards rules are on your points page under Rewards and Referrals Terms if you ever want a look: "+link:"";
  if(!b) return lead.replace("so here are two ways that work for this one:","so here is a way that works for this one:").replace(" Two ways to do this:"," Here is your order:")+"\n\n"+(t.coversAll?aHead.replace(/^Option 1 - /,"").replace(/^./,c=>c.toUpperCase())+"\n":"")+ocSummary(aT)+tail;
  if(b.open) return lead+"\n\n"+aHead+"\n"+ocSummary(aT)+"\n\n----------\n\n"+b.head+"\n"+b.line+tail;

  if(t.coversAll){
    const saving=aT.toPay-b.t2.toPay;
    why="Option 2 gets you "+b.n+" more "+b.cheap.label+
        (saving>0?" and you actually pay "+fuMoney(saving)+" less":"")+", since more of your credit gets used.";
  }else{
    why = b.why==="postage" ? "Option 2 gets you free postage."
        : b.why==="tier"    ? "Option 2 tips you past $"+b.nt.min+" for the month, so "+(b.had>0?"this month's credit goes from $"+b.had+" to $"+b.nt.pts+".":"you bank $"+b.nt.pts+" credit.")
        : "Option 2 if you want to grab one more while it is going out.";
  }
  return lead+"\n\n"+
         aHead+"\n"+ocSummary(aT)+"\n\n----------\n\n"+
         b.head+"\n"+ocSummary(b.t2)+"\n\n"+why+tail;
}
function ocCopy(btn,which){
  const text=(which==="both")?ocSummaryBoth():ocSummary();if(!text)return;
  const label=btn.dataset.label||(btn.dataset.label=btn.textContent);   // its own wording, kept the first time, never "Copied"
  const done=()=>{btn.textContent="Copied";btn.classList.add("copied");clearTimeout(btn._back);
    btn._back=setTimeout(()=>{btn.textContent=label;btn.classList.remove("copied");},1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fuFallbackCopy(text,done));}
  else fuFallbackCopy(text,done);
}

// A short fingerprint of a long piece of text, so the page can tell when the list has changed.
function ocHash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h);}
// Tapping an amount box gets it ready to type over. A 0 clears out of the way as the box is entered.

  if(el.dataset.fresh!=="1")return;

  if(el.value!==""){try{el.select();}catch(e){}}
}

/* ================= Vial Calculator =================
 * Starts from what doesn't change, the mg in the vial, and works back: the bac water to add, then
 * with a dose, the exact units to draw up and how long the vial lasts. Syringe units are U-100
 * insulin units, so 100 units is 1 ml. The water it picks gives a round number of units that's easy
 * to read, stays close to the usual mix for that vial size, and never goes past the safe fill of
 * about 85 percent. Change the water with the stepper and it warns when it's tight or won't fit.
 * The dose is always yours to put in. Everything stays on this device.
 */
const VC_KEY="peps_vial_calc_v2",VC_RANGES="peps_vial_ranges_v1",VC_SIZES=[2,3,5,10],VC_FITS=[2,3,5,10,20];

// Dose ranges are yours, one per product, in mg a dose. These starting ones are the ranges sent in for
// this dashboard, GHK-Cu 1 to 5 mg and retatrutide 1 to 12 mg, marked not checked yet. Once they've been
// checked, Save all on the Ranges screen keeps them on the device and the note goes.
const VC_START={"GHK-CU":{lo:1,hi:5},"RETAT15":{lo:1,hi:12},"RETAT20":{lo:1,hi:12}};
function vcRangesSaved(){try{return localStorage.getItem(VC_RANGES)!==null;}catch(e){return false;}}
// The starting ranges, laid onto the products as they are on the sheet right now. A starting range
// covers every vial size of its product, so the GHK-Cu one reaches the 50 mg and the 100 mg. It is
// matched on the front of the product code, exact code first. Only the starting ranges work this
// way. Ranges saved on the device belong to the one product they were saved for.
function vcStart(){
  const out={},keys=Object.keys(VC_START);let prods=[];
  try{prods=vcProds();}catch(e){}
  prods.forEach(p=>{
    const s=String(p.sku||"").toLowerCase();if(!s)return;
    const k=keys.find(x=>x.toLowerCase()===s)||keys.find(x=>s.indexOf(x.toLowerCase())===0);
    if(k)out[p.sku]={lo:VC_START[k].lo,hi:VC_START[k].hi};
  });
  return out;
}
function vcRanges(){
  try{const raw=localStorage.getItem(VC_RANGES);if(raw===null)return vcStart();
    const r=JSON.parse(raw||"{}");return r&&typeof r==="object"&&!Array.isArray(r)?r:{};}catch(e){return vcStart();}
}
function vcRangeOf(sku){
  if(!sku)return null;const all=vcRanges(),k=Object.keys(all).find(x=>x.toLowerCase()===String(sku).toLowerCase());

    ' <button type="button" class="vc2-link small" onclick="vcNoteOk()">Got it</button></div>');
  // The dose against the range you set for this product.
  const prod=VC.sku?vcProds().find(x=>x.sku===VC.sku):null,R=prod?vcRangeOf(prod.sku):null,pname=prod?vcE(ocName(prod).main):"";
  if(prod&&R){
    const rng=vcFmt(R.lo,3)+" to "+vcFmt(R.hi,3)+" mg a dose";
    if(S.dose>=R.hi*2-1e-9)notes.push('<div class="vc2-ban bad"><b>Well above the range you set.</b> Your range for '+pname+' is '+rng+', and this is '+vcMg(S.dose)+'. Check the units before anyone draws this up.</div>');
    else if(S.dose>R.hi+1e-9)notes.push('<div class="vc2-ban bad"><b>Above the range you set.</b> Your range for '+pname+' is '+rng+', and this is '+vcMg(S.dose)+'.</div>');
    else if(S.dose<R.lo-1e-9)notes.push('<div class="vc2-ban warn"><b>Below the range you set.</b> Your range for '+pname+' is '+rng+', and this is '+vcMg(S.dose)+'.</div>');
    else notes.push('<div class="vc2-ban ok">Within the range you set for '+pname+', '+rng+'.</div>');
  }
  if(S.units>100+1e-9)notes.push('<div class="vc2-ban bad"><b>More than one syringe.</b> That\'s over 100 units, more than a 1 ml syringe holds.'+
    (S.manual&&!S.inUnits?' Less water brings it down.':'')+'</div>');
  else if(S.units<2-1e-9)notes.push('<div class="vc2-ban warn"><b>Too small to measure well.</b> Under 2 units is hard to read on a syringe.'+
    (S.inUnits?'':S.water<hi-1e-9?' More water makes it easier.':' Even at the safe fill it\'s small, a bigger vial with more water helps.')+'</div>');
  const doses=S.mg/S.dose,full=Math.floor(doses+1e-9),part=!S.planned&&doses-full>.05;
  let rows='<div class="vc2-li"><span>Doses in the vial</span><b>'+(S.planned?Math.round(doses):full)+(part?', plus a part dose':'')+'</b></div>';
  if(S.week){
    rows='<div class="vc2-li"><span>Lasts</span><b>'+vcDays(doses/S.week*7)+'</b></div>'+rows;
  }else rows+='<div class="vc2-li"><span>Lasts</span><b style="color:#8e8e93">Set how often</b></div>';
  const mgTxt=vcMg(S.dose)+(VC.du==="mcg"&&!S.planned?', '+vcFmt(S.dose*1000,0)+' mcg':''),uTxt=vcU(S.units);
  draw.innerHTML='<div class="vc2-k">'+(S.planned?'Draw up, worked out from the vial':'Draw up')+'</div>'+
    (S.inUnits?'<div class="vc2-big">'+mgTxt+'</div><div class="vc2-sub">'+uTxt+' each time</div>':'<div class="vc2-big">'+uTxt+'</div><div class="vc2-sub">'+mgTxt+' each time'+
      (S.planned?', to make '+vcFmt(S.mg,2)+' mg last '+S.last+(S.last===1?' week':' weeks')+' at '+S.week+' a week, nothing left over':'')+'</div>')+
    notes.join("")+'<div class="vc2-rows">'+rows+'</div>'+vcRangeLine();
}

function vcRangeLine(){

  if(!prod)return '<div class="vc2-rset">Pick a product above to check doses against a range you set for it.</div>';
  const R=vcRangeOf(prod.sku),pname=vcE(ocName(prod).main);
  if(VC_REDIT)return '<div class="vc2-rset">Dose range for '+pname+', in mg a dose'+

    '<label class="vc2-rin"><span>High</span><input id="vcRHi" inputmode="decimal" autocomplete="off" value="'+(R?vcFmt(R.hi,3):"")+'"><b>mg</b></label></div>'+
    '<div class="vc2-racts"><button type="button" class="vc2-btn" onclick="vcRangeSave()">Save range</button><button type="button" class="vc2-link" onclick="vcRangeEdit(false)">Cancel</button>'+
    (R?'<button type="button" class="vc2-link red" onclick="vcRangeClear()">Remove</button>':'')+'</div><div id="vcRErr"></div></div>';
  if(R)return '<div class="vc2-rset">Range set for '+pname+': '+vcFmt(R.lo,3)+' to '+vcFmt(R.hi,3)+' mg a dose.'+(vcRangesSaved()?'':' <span class="vc2-unck">Not checked yet.</span>')+' <button type="button" class="vc2-link small" onclick="vcRangeEdit(true)">Change</button></div>';
  return '<div class="vc2-rset warn">No dose range set for '+pname+', so nothing is checking the dose. <button type="button" class="vc2-link small" onclick="vcRangeEdit(true)">Set range</button></div>';

/* ================= GST & Bank =================
 * Bank transfers only (Payment Method = "Bank transfer"), split across two accounts by a
 * switch date. Each account carries its own tax bracket, since account 1 is closed and may
 * sit in a different band to whatever account 2 ends up doing.
 * Counts money actually IN: needs Completed (col S) AND Paid (col P).
 */
const GST_THRESHOLD=75000;
const TAX_KEY_A1="peps_tax_bracket_a1_v2";
const TAX_KEY_A2="peps_tax_bracket_a2_v2";
const TAX_KEY_A3="peps_tax_bracket_a3_v1";
const GST_BASIS_KEY="peps_gst_basis_v1";
const GST_SWITCH_KEY="peps_gst_switch_v2";
const GST_SWITCH_DEFAULT="2026-07-16";   // the day account 2 opened
// FY2026-27 resident rates (the 16% step dropped to 15% on 1 Jul 2026). Medicare levy is separate.
const TAX_BRACKETS=[
  {l:"0%",r:0,upTo:18200,band:"$0 - $18,200"},
  {l:"15%",r:.15,upTo:45000,band:"$18,201 - $45,000"},
  {l:"30%",r:.30,upTo:135000,band:"$45,001 - $135,000"},
  {l:"37%",r:.37,upTo:190000,band:"$135,001 - $190,000"},
  {l:"45%",r:.45,upTo:Infinity,band:"$190,001 +"}
];
// Defaults set per account, NOT auto-picked off this business alone. PEPS income stacks
// on Fund One etc, so the first dollar is never taxed at 0% - auto-picking by amount would
// show a $0 set-aside, the worst way to be wrong. Click a rate to override; it sticks.
const TAX_DEF_A1=TAX_BRACKETS[2];   // 30%
const TAX_DEF_A2=TAX_BRACKETS[3];   // 37%
const TAX_DEF_A3=TAX_BRACKETS[3];   // 37%, the safe side until a rate is picked
function taxGet(key,def){try{const v=localStorage.getItem(key);const f=v?TAX_BRACKETS.find(b=>b.l===v):null;return f||def;}catch(e){return def;}}
function taxSetA1(l){try{localStorage.setItem(TAX_KEY_A1,l);}catch(e){}rGst();}
function taxSetA2(l){try{localStorage.setItem(TAX_KEY_A2,l);}catch(e){}rGst();}
function taxSetA3(l){try{localStorage.setItem(TAX_KEY_A3,l);}catch(e){}rGst();}
function gstBasis(){try{return localStorage.getItem(GST_BASIS_KEY)||"transfers";}catch(e){return "transfers";}}
function gstSetBasis(b){try{localStorage.setItem(GST_BASIS_KEY,b);}catch(e){}rGst();}
function gstSwitchISO(){try{return localStorage.getItem(GST_SWITCH_KEY)||GST_SWITCH_DEFAULT;}catch(e){return GST_SWITCH_DEFAULT;}}
function gstSetSwitch(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||""))return;try{localStorage.setItem(GST_SWITCH_KEY,v);}catch(e){}rGst();}
function gstSwitchDate(){const m=gstSwitchISO().match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(2026,6,16);}
function gstDayLabel(d){return d.toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"});}
// Which bank account an order's money went into. The Account column on the sheet wins when it's
// filled in, whatever the payment method says. Left blank, a bank transfer goes by its date:
// before account 2 opened is account 1, from that day on account 2. Blank and not a bank
// transfer means the money never went into one of these accounts, so 0 and it isn't counted.
function gstAcctOf(o,sw){
  const m=String(o.account||"").match(/([123])\s*$/);
  if(m)return +m[1];
  if(String(o.payMethod||"").trim().toLowerCase()!=="bank transfer")return 0;
  const d=odObj(o.date);
  return d&&d<sw?1:2;
}

function rGst(){
  // Money actually in: order fulfilled (col S) AND payment landed (col P). Col S alone is
  // only about goods going out — "Completed" with the transfer still missing is not income.
  // Trimmed both sides: fulfilment comes off the sheet untrimmed, so a stray space in
  // col S would silently drop the order out of tax and GST entirely.
  const gstOK=o=>String(o.fulfilment||"").trim()==="Completed"&&String(o.payStatus||"").trim()==="Paid"&&o.ownerPurchase!=="Yes";
  const sales=(D.orders||[]).filter(gstOK);
  const sw=gstSwitchDate();sw.setHours(0,0,0,0);
  const banked=sales.filter(o=>gstAcctOf(o,sw)>0);

  // Split by account. Track money in, profit after lab cost, and vials shipped.
  // o.profit is what was actually paid minus (lab cost × qty), derived off the sheet's
  // "Total after COGS" — so the cost holds whatever price tier they ended up paying.
  // Deliberately NOT the sheet's own Profit column: that one is just Total after COGS,
  // so it ignores cash/owner pricing and books a free vial at zero instead of at cost.
  let a1=0,a2=0,a3=0,n1=0,n2=0,n3=0,gp1=0,gp2=0,gp3=0,q1=0,q2=0,q3=0;
  banked.forEach(o=>{
    const k=gstAcctOf(o,sw),amt=(o.lineTotal||0)-(o.creditUsed||0),prof=o.profit||0,qty=o.qty||0;
    if(k===1){a1+=amt;gp1+=prof;q1+=qty;n1++;}
    else if(k===3){a3+=amt;gp3+=prof;q3+=qty;n3++;}
    else{a2+=amt;gp2+=prof;q2+=qty;n2++;}
  });
  const tAmt=a1+a2+a3;
  const lab1=a1-gp1,lab2=a2-gp2,lab3=a3-gp3;

  // Packaging — per-vial figure off the COGS tab. Lab cost is already out via o.profit,
  // packaging isn't, so it comes off here.
  const perVial=(D.cogs&&D.cogs.perVial)||0;
  const pk1=q1*perVial,pk2=q2*perVial,pk3=q3*perVial;

  // Running costs are NOT deducted. Money_Movements stopped being updated, so summing it
  // would quietly read zero, and the Dashboard's Total Expenses is one undated lifetime
  // figure — no honest way to split that across separate accounts. Left out on
  // purpose: it pushes the set-aside high, which is the safe direction to be wrong in.

  // Tax lands on what's left, not on turnover. Negative profit = nothing to set aside.
  const np1=gp1-pk1,np2=gp2-pk2,np3=gp3-pk3;
  const b1=taxGet(TAX_KEY_A1,TAX_DEF_A1),b2=taxGet(TAX_KEY_A2,TAX_DEF_A2),b3=taxGet(TAX_KEY_A3,TAX_DEF_A3);
  const tax1=Math.max(0,np1)*b1.r,tax2=Math.max(0,np2)*b2.r,tax3=Math.max(0,np3)*b3.r;

  // Account 2 is a separate entity, so its GST threshold runs on its own turnover only —
  // nothing from account 1's entity carries across.
  const allFrom=sales.reduce((s,o)=>{const d=odObj(o.date);return s+((!d||d>=sw)?(o.lineTotal||0)-(o.creditUsed||0):0);},0);
  const basis=gstBasis(),onT=basis==="transfers";
  const counted=onT?a2:allFrom;
  const toGo=GST_THRESHOLD-counted;
  const pct=Math.min(100,Math.max(0,counted/GST_THRESHOLD*100));

  // Projection: at the rate this entity has been selling since it started, when does it hit $75k?
  const gstNow=new Date();gstNow.setHours(0,0,0,0);
  const gstDays=Math.max(1,Math.round((gstNow-sw)/86400000)+1);   // days trading so far (today counts)
  const gstPerDay=counted/gstDays;
  const gstPerMonth=gstPerDay*30.44;
  let projLine="";
  if(counted>=GST_THRESHOLD){
    projLine='<div class="gst-proj" style="color:var(--red)">Already over the $75,000 threshold.</div>';
  }else if(gstPerDay>0){
    const daysLeft=toGo/gstPerDay;
    const hit=new Date(gstNow.getTime()+daysLeft*86400000);
    const yrs=daysLeft/365.25;
    const when=yrs>=3
      ? "not for years at this rate"
      : "around "+hit.toLocaleDateString("en-AU",{month:"long",year:"numeric"});
    const mLeft=daysLeft/30.44;
    const howLong=mLeft>=12?(Math.round(mLeft/12*10)/10)+" years away":Math.round(mLeft)+" months away";
    projLine='<div class="gst-proj">On track to reach $75,000 <b>'+when+'</b>'+
      (yrs<3?', about '+howLong:'')+'. Selling <b>'+fuMoney(gstPerMonth)+'</b> a month so far'+
      (gstDays<45?' (only '+gstDays+' days in, so this will settle down)':'')+'.</div>';
  }else{
    projLine='<div class="gst-proj">No sales counted yet, so there is nothing to project from.</div>';
  }
  const mkBtns=(cur,fn)=>TAX_BRACKETS.map(x=>'<button class="gst-t'+(x.l===cur.l?" on":"")+'" onclick="'+fn+'(\''+x.l+'\')" title="'+x.band+'">'+x.l+'</button>').join("");
  const bandRef=TAX_BRACKETS.map(x=>'<div class="gst-band'+((x.l===b1.l||x.l===b2.l||x.l===b3.l)?" on":"")+'"><span class="gst-band-r">'+x.l+'</span><span class="gst-band-b">'+x.band+'</span></div>').join("");
  const before=new Date(sw.getTime()-86400000);

  // Working — every step from money in to money set aside, so none of it is a black box.
  const wr=(lbl,v1,v2,v3,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td>'+lbl+'</td><td>'+fuMoney(v1)+'</td><td>'+fuMoney(v2)+'</td><td>'+fuMoney(v3)+'</td><td>'+fuMoney(v1+v2+v3)+'</td></tr>';
  const wd=(lbl,v1,v2,v3)=>'<tr><td>'+lbl+'</td><td class="neg">-'+fuMoney(v1)+'</td><td class="neg">-'+fuMoney(v2)+'</td><td class="neg">-'+fuMoney(v3)+'</td><td class="neg">-'+fuMoney(v1+v2+v3)+'</td></tr>';
  const working=
    '<div class="gst-scroll"><table class="gst-work"><thead><tr><th></th><th>Account 1</th><th>Account 2</th><th>Account 3</th><th>All</th></tr></thead><tbody>'+
      wr("Transfers in",a1,a2,a3)+
      wd("Less lab cost",lab1,lab2,lab3)+
      wd("Less packaging"+(perVial?' &middot; '+fuMoney(perVial)+'/vial':''),pk1,pk2,pk3)+
      '<tr class="gap"><td>Less running costs</td><td colspan="4">not deducted &middot; not tracked in the sheet</td></tr>'+
      wr("Taxable profit",np1,np2,np3,"sum")+
      '<tr class="rate"><td>Bracket</td><td>'+b1.l+'</td><td>'+b2.l+'</td><td>'+b3.l+'</td><td>—</td></tr>'+
      wr("Set aside",tax1,tax2,tax3,"fin")+
    '</tbody></table></div>';

  document.getElementById("sec-gst").innerHTML=
    '<div class="sh"><h2>GST &amp; Bank</h2><span class="badge">'+banked.length+' transfers</span></div>'+
    '<div class="mg mg4 gst-cards" style="margin-bottom:14px">'+
      '<div class="mc"><div class="mc-l">Account 1 · closed</div><div class="mc-v cm">'+fuMoney(a1)+'</div><div class="mc-s">'+n1+' transfers up to '+gstDayLabel(before)+' · profit '+fuMoney(np1)+' · tax '+b1.l+' = <b style="color:var(--amber)">'+fuMoney(tax1)+'</b></div></div>'+
      '<div class="mc" style="border-color:var(--green)"><div class="mc-l">Account 2 · live</div><div class="mc-v cm" style="color:var(--green)">'+fuMoney(a2)+'</div><div class="mc-s">'+n2+' transfers from '+gstDayLabel(sw)+' · profit '+fuMoney(np2)+' · tax '+b2.l+' = <b style="color:var(--amber)">'+fuMoney(tax2)+'</b></div></div>'+
      '<div class="mc" style="border-color:var(--purple)"><div class="mc-l">Account 3</div><div class="mc-v cm" style="color:var(--purple)">'+fuMoney(a3)+'</div><div class="mc-s">'+n3+' transfers marked Account 3 on the sheet · profit '+fuMoney(np3)+' · tax '+b3.l+' = <b style="color:var(--amber)">'+fuMoney(tax3)+'</b></div></div>'+
      '<div class="mc" style="border-color:var(--amber)"><div class="mc-l">Tax set aside · all</div><div class="mc-v cm" style="color:var(--amber)">'+fuMoney(tax1+tax2+tax3)+'</div><div class="mc-s">on '+fuMoney(np1+np2+np3)+' of profit, off '+fuMoney(tAmt)+' of transfers</div></div>'+
    '</div>'+
    '<div class="gst-reg"><span>Account 2 opened:</span>'+
      '<input type="date" class="gst-date" value="'+gstSwitchISO()+'" onchange="gstSetSwitch(this.value)">'+
      '<span class="gst-owed">Anything dated before this sits in account 1, unless the Account column on the sheet says otherwise.</span></div>'+
    '<div class="gst-reg" style="margin-top:8px"><span style="min-width:150px">Account 1 bracket:</span>'+mkBtns(b1,"taxSetA1")+
      '<span class="gst-owed">'+fuMoney(np1)+' profit × '+b1.l+' = <b>'+fuMoney(tax1)+'</b></span></div>'+
    '<div class="gst-reg" style="margin-top:8px"><span style="min-width:150px">Account 2 bracket:</span>'+mkBtns(b2,"taxSetA2")+
      '<span class="gst-owed">'+fuMoney(np2)+' profit × '+b2.l+' = <b>'+fuMoney(tax2)+'</b></span></div>'+
    '<div class="gst-reg" style="margin-top:8px"><span style="min-width:150px">Account 3 bracket:</span>'+mkBtns(b3,"taxSetA3")+
      '<span class="gst-owed">'+fuMoney(np3)+' profit × '+b3.l+' = <b>'+fuMoney(tax3)+'</b></span></div>'+
    '<div class="gst-thresh" style="margin-top:12px">'+
      '<div class="gst-th-h">How the set-aside is built</div>'+
      working+
      '<div class="gst-note">On <b>profit</b>, not turnover. Completed and Paid orders only, owner purchases out. Reads a little high - deductibles like running costs and postage aren\'t taken out.</div>'+
    '</div>'+
    '<div class="gst-thresh" style="margin-top:12px">'+
      '<div class="gst-th-h">Where the brackets kick in - FY2026-27 (1 Jul 2026 - 30 Jun 2027)</div>'+
      '<div class="gst-bands">'+bandRef+'</div>'+
      '<div class="gst-note">Set by hand - pick the rate your <i>next</i> dollar of profit is taxed at, across all your income. +2% Medicare.</div>'+
    '</div>'+
    '<div class="gst-thresh" style="margin-top:12px">'+
      '<div class="gst-th-h">GST threshold - $75,000 · new entity, from '+gstDayLabel(sw)+'</div>'+
      '<div class="gst-reg" style="border:0;background:transparent;padding:0 0 10px 0">'+
        '<span>Count:</span>'+
        '<button class="gst-t'+(onT?" on":"")+'" onclick="gstSetBasis(\'transfers\')">Transfers only</button>'+
        '<button class="gst-t'+(!onT?" on":"")+'" onclick="gstSetBasis(\'all\')">All sales</button>'+
      '</div>'+
      '<div class="gst-bar-l">'+(onT?"Bank transfers":"All sales")+': <b>'+fuMoney(counted)+'</b> of $75,000 ('+pct.toFixed(0)+'%), '+
        (toGo>0?'<b style="color:var(--blue)">'+fuMoney(toGo)+'</b> to go':'<b style="color:var(--red)">'+fuMoney(-toGo)+'</b> over')+'</div>'+
      '<div class="gst-bar"><div class="gst-fill" style="width:'+pct+'%;background:'+(counted>=GST_THRESHOLD?"var(--red)":"var(--blue)")+'"></div></div>'+
      projLine+
      '<div class="gst-note">Account 2\'s own $75k, from '+gstDayLabel(sw)+'. Gross turnover, separate from Account 1.'+
        (onT?' All sales here total <b>'+fuMoney(allFrom)+'</b>.'+(a3?' Account 3\'s <b>'+fuMoney(a3)+'</b> isn\'t counted in this.':''):' Bank transfers are <b>'+fuMoney(a2)+'</b>.')+'</div>'+
    '</div>';
}

function rFollowups(){
  const today=new Date();today.setHours(0,0,0,0);
  const DAY=86400000;
  const baseOverride=fuGetBase();
  const owners=fuGetOwners();
  // Sell prices by SKU and by product name (for the reorder cost summary)
  // Two price lists, same as the Order Calculator: transfer uses "Customer Cost",
  // cash uses the cheaper "Cash Price". Which one a client is quoted depends on how
  // they actually pay us.
  const priceBySku={},priceByName={},cashBySku={},cashByName={};
  (D.products||[]).forEach(p=>{
    const sk=String(p.sku||"").trim().toLowerCase(), nm=String(p.name||"").trim().toLowerCase();
    if(sk){priceBySku[sk]=p.netPrice;cashBySku[sk]=p.cashPrice||p.netPrice;}
    if(nm){priceByName[nm]=p.netPrice;cashByName[nm]=p.cashPrice||p.netPrice;}
  });
  // Bac water for the upsell (always shown as "Bac Water" — the sheet name is too clunky for a text)
  let bacPrice=0,bacCash=0;const bacName="Bac Water";
  (D.products||[]).forEach(p=>{if(/bacteriostatic|bac\s*water/i.test(String(p.name||""))){if(p.netPrice)bacPrice=p.netPrice;if(p.cashPrice||p.netPrice)bacCash=p.cashPrice||p.netPrice;}});
  const POSTAGE=12;        // express postage on transfer orders
  const POST_FREE_AT=199;  // transfer orders at or above this get free postage

  // How each client usually pays. Most recent order wins, since that's how they pay now.
  const payByCust={};
  (function(){
    const seen={};
    D.orders.forEach(o=>{
      const nm=String(o.customer||"").trim();if(!nm)return;
      const m=String(o.payMethod||"").trim();if(!m)return;
      const od=odObj(o.date);
      if(!seen[nm]||(od&&od>=seen[nm])){seen[nm]=od||seen[nm];payByCust[nm]=m;}
    });
  })();
  const isCashClient=n=>/^cash$/i.test(String(payByCust[String(n||"").trim()]||"").trim());
  // ---- Rewards context, mirroring what the client sees on their EARN page ----
  // Store credit comes off the Dashboard tab (same source the Points tab reads).
  const creditMap={};
  (function(){
    const dash=D.rawDashboard||[];
    let hr=-1,creditCol=-1,personCol=0;
    for(let i=0;i<dash.length;i++){
      const row=dash[i]||[];
      const ci=row.findIndex(c=>String(c||"").trim().toLowerCase()==="credit balance ($)");
      if(ci>=0){hr=i;creditCol=ci;const pi=row.findIndex(c=>String(c||"").trim().toLowerCase().startsWith("person"));personCol=pi>=0?pi:0;break;}
    }
    if(hr<0)return;

// Tiers off lifetime completed spend. Points double as $ store credit. Edit here if tiers change.
const PTS_TIERS=[{min:100,pts:10},{min:300,pts:25},{min:500,pts:40}]; // ascending
function ptsFor(spend){let p=0;for(const t of PTS_TIERS){if(spend>=t.min)p=t.pts;}return p;}
function ptsNext(spend){for(const t of PTS_TIERS){if(spend<t.min)return t;}return null;} // null = top tier
function ptsYM(y,m){return y+"-"+String(m+1).padStart(2,"0");}
function ptsMoney0(n){return "$"+Math.round(n).toLocaleString("en-AU");}

// Names kept out of the Points tab and the calculator list: the partners and placeholder rows.
// The list lives in the hub script, HIDE_FROM_POINTS, so no names sit in this public file.
// Curly vs straight apostrophes get typed interchangeably, so flatten them before comparing.
function ptsKey(n){return String(n||"").replace(/[\u2018\u2019\u02BC]/g,"'").replace(/\s+/g," ").trim().toLowerCase();}
function ptsHidden(name){return ((D&&D.hidePoints)||[]).map(ptsKey).indexOf(ptsKey(name))>=0;}

function rPoints(){
  const now=new Date();
  const curY=now.getFullYear(), curM=now.getMonth(); // 0-based month
  // The sheet's points block is what each customer's rewards page shows, so this tab shows the
  // same total spend, this month, streak and heads up. The same person under two spellings is
  // one person here. Orders are real orders, one per customer per day, not product lines.
  const block={};
  (function(){
    const dash=D.rawDashboard||[];const col={};let hr=-1;
    for(let i=0;i<dash.length;i++){
      const row=(dash[i]||[]).map(c=>String(c||"").trim().toLowerCase());
      const ci=row.indexOf("credit balance ($)");if(ci<0)continue;
      hr=i;col.bal=ci;col.person=Math.max(0,row.findIndex(c=>c.indexOf("person")===0));
      col.spend=row.findIndex(c=>c.indexOf("total spend")===0);col.month=row.findIndex(c=>c.indexOf("this month spend")===0);
      col.streak=row.findIndex(c=>c.indexOf("streak")===0);col.heads=row.findIndex(c=>c.indexOf("heads")===0);
      break;
    }
    if(hr<0)return;
    for(let i=hr+1;i<dash.length;i++){
      const row=dash[i]||[];const nm=String(row[col.person]||"").trim();if(!nm)continue;
      const k=fuNorm(nm);if(block[k])continue;
      block[k]={bal:num(row[col.bal]),spend:col.spend>=0?num(row[col.spend]):null,month:col.month>=0?num(row[col.month]):null,
                streak:col.streak>=0?num(row[col.streak]):null,heads:col.heads>=0?String(row[col.heads]||"").trim():""};
    }
  })();
  const byCust={};
  D.orders.forEach(o=>{
    const raw=String(o.customer||"").trim();if(!raw||ptsHidden(raw))return;
    const k=fuNorm(raw);
    const c=byCust[k]||(byCust[k]={k,names:{},spend:0,monthSpend:0,months:new Set(),creditUsed:0,days:{}});
    c.names[raw]=(c.names[raw]||0)+1;
    c.creditUsed+=o.creditUsed||0;
    const ps=String(o.payStatus||"").trim().toLowerCase();
    if(ps==="unpaid"||ps.indexOf("refund")>=0||/cancel/i.test(String(o.fulfilment||"")))return;
    c.spend+=o.lineTotal;c.days[String(o.date||"").trim()]=1;
    const d=odObj(o.date);
    if(d){c.months.add(ptsYM(d.getFullYear(),d.getMonth()));if(d.getFullYear()===curY&&d.getMonth()===curM)c.monthSpend+=o.lineTotal;}
  });
  const rows=Object.values(byCust).map(c=>{
    const name=Object.keys(c.names).sort((a,b)=>c.names[b]-c.names[a])[0];
    const s=block[c.k]||null;
    const spend=s&&s.spend!=null?s.spend:c.spend,monthSpend=s&&s.month!=null?s.month:c.monthSpend;
    let streak=s&&s.streak!=null?s.streak:0;
    if(!s||s.streak==null){let y=curY,m=curM;for(let i=0;i<12;i++){if(c.months.has(ptsYM(y,m))){streak++;m--;if(m<0){m=11;y--;}}else break;}}
    const t=ptsNext(monthSpend);               // the next monthly credit tier, off this month's spend
    let heads=s&&s.heads?s.heads:"";
    if(!heads)heads=monthSpend<=0?"No order this month yet":(!t?"Maxed this month at $"+ptsFor(monthSpend):"Spend "+ptsMoney0(t.min-monthSpend)+" more this month to reach $"+t.pts);
    const hc=/^no order/i.test(heads)?"c-warn":(/maxed/i.test(heads)?"c-pos":"c-neut");
    const cr=creditFor(name,s?s.bal:0,c.creditUsed);
    return {name,spend,orders:Object.keys(c.days).length,monthSpend,points:ptsFor(monthSpend),streak,heads,hc,maxed:!t&&monthSpend>0,
            credit:cr.available,earned:cr.earned,used:cr.used,refCredit:cr.referral,refs:refCountFor(name)};
  });
  rows.sort((a,b)=>b.spend-a.spend||a.name.localeCompare(b.name));
  const totPoints=rows.reduce((s,r)=>s+r.points,0);
  const totalCredit=rows.reduce((s,r)=>s+r.credit,0);
  const withCredit=rows.filter(r=>r.credit>0).length;
  // Days left in the current month (counts today)

  // Next monthly credit tier above a given this-month spend

  const push=rows.filter(r=>r.orders>0&&nextTier(r.monthSpend)).map(r=>{
    const t=nextTier(r.monthSpend);
    return {name:r.name,need:t.need,credit:t.credit,streak:r.streak,noBuy:r.monthSpend<=0};
  }).sort((a,b)=> a.need-b.need || b.streak-a.streak || a.name.localeCompare(b.name)).slice(0,7);
  const topTier=rows.filter(r=>r.maxed).length;
  const monthSpend=rows.reduce((s,r)=>s+r.monthSpend,0);
  const active=rows.filter(r=>r.orders>0).length;
  const body=rows.length?rows.map((r,i)=>{
    const streakCell=r.streak>0?('<span class="cm">'+r.streak+(r.streak>=2?' 🔥':'')+'</span>'):'<span class="c-mut cm">0</span>';
    const monthCell=r.monthSpend>0?'<span class="c-pos cm">'+fmt(r.monthSpend)+'</span>':'<span class="c-mut cm">$0.00</span>';
    const usedNote=r.used>0?'<span class="c-mut" style="font-size:12px"> · '+fmt(r.used)+' used</span>':'';
    const creditCell=(r.credit>0?'<span class="c-pos cm" style="font-weight:600">'+fmt(r.credit)+'</span>':'<span class="c-mut cm">$0.00</span>')+usedNote;
    return '<tr><td class="cm" style="color:var(--mut)">'+(i+1)+'</td>'+
      '<td>'+esc(r.name)+'</td>'+
      '<td class="cm" style="text-align:right">'+fmt(r.spend)+'</td>'+
      '<td class="cm" style="text-align:center">'+r.orders+'</td>'+
      '<td style="text-align:right">'+creditCell+'</td>'+

      '<td class="'+r.hc+'" style="font-size:14px">'+esc(r.heads)+'</td></tr>';
  }).join(""):'<tr><td colspan="8" style="text-align:center;color:var(--dim);padding:24px">No customers yet</td></tr>';
  const top5Body=top5.length?top5.map((r,i)=>
    '<tr><td class="cm" style="color:var(--mut);width:16px">'+(i+1)+'</td>'+
    '<td>'+esc(r.name)+'</td>'+
    '<td class="cm" style="text-align:right">'+fmt(r.spend)+'</td>'+
    '<td class="cm" style="text-align:center">'+(r.streak>0?(r.streak+(r.streak>=2?' 🔥':'')):'<span class="c-mut">0</span>')+'</td></tr>'
  ).join(""):'<tr><td colspan="4" style="color:var(--dim);text-align:center;padding:14px">No clients yet</td></tr>';
  const pushBody=push.length?push.map(r=>
    '<tr><td>'+esc(r.name)+'</td>'+
    '<td class="cm" style="text-align:right;color:var(--amber)">'+fmt(r.need)+'</td>'+
    '<td class="cm" style="text-align:right;color:var(--dim)">$'+r.credit+'</td></tr>'
  ).join(""):'<tr><td colspan="3" style="color:var(--green);text-align:center;padding:14px">Everyone\u2019s on track this month</td></tr>';
  document.getElementById("sec-points").innerHTML=
    '<div class="sh"><h2>Client Points</h2><span class="badge">'+active+' active</span></div>'+
    '<div class="mg" style="grid-template-columns:1fr;margin-bottom:14px">'+

    '</div>'+
    '<div class="mg mg2" style="margin-bottom:14px">'+
      '<div class="mc">'+
        '<div class="mc-l" style="margin-bottom:8px">Top 5 Clients</div>'+
        '<table><thead><tr><th style="width:16px">#</th><th>Client</th><th style="text-align:right">Spend</th><th style="text-align:center">Streak</th></tr></thead><tbody>'+top5Body+'</tbody></table>'+
      '</div>'+
      '<div class="mc">'+
        '<div class="mc-l">Needs a Push</div>'+

// Find the Product that matches an Inventory_Summary row (reverse of invStockFor):
// exact SKU (trim + case), else prefix match disambiguated by the strength digits
// in the product SKU appearing in the inventory row's name.
function prodForInv(invRow, products){
  const is=String(invRow.sku||"").trim().toLowerCase();
  if(!is)return null;
  let p=products.find(pp=>String(pp.sku||"").trim().toLowerCase()===is);
  if(!p){
    const cand=products.filter(pp=>{const ps=String(pp.sku||"").trim().toLowerCase();return ps&&(ps.startsWith(is)||is.startsWith(ps));});
    if(cand.length>1){
      const nm=String(invRow.name||"").toLowerCase();
      p=cand.find(pp=>{const m=String(pp.sku||"").toLowerCase().match(/(\d+)\s*$/);return m&&nm.includes(m[1]);})||cand[0];
    } else p=cand[0]||null;
  }
  return p||null;
}
// Match a product to its Inventory_Summary stock, resilient to SKU mismatches:
//  - trims + lowercases SKUs (fixes "Klow " trailing-space vs "Klow")
//  - if no exact SKU match, falls back to prefix match and disambiguates by the
//    strength digits in the product SKU (fixes Products "RETAT20"/"RETAT15" vs
//    Inventory "RETAT" on rows named "Retatrutide 20mg"/"Retatrutide 15mg")
function invStockFor(p, inv){
  const ps=String(p.sku||"").trim().toLowerCase();
  let rows=inv.filter(i=>String(i.sku||"").trim().toLowerCase()===ps);
  if(!rows.length && ps){
    const cand=inv.filter(i=>{const is=String(i.sku||"").trim().toLowerCase();return is&&(ps.startsWith(is)||is.startsWith(ps));});
    if(cand.length>1){
      const m=ps.match(/(\d+)\s*$/);
      const narrowed=m?cand.filter(i=>String(i.name||"").toLowerCase().includes(m[1])):[];
      rows=narrowed.length?narrowed:cand;
    } else rows=cand;
  }
  let total=0,storage=0,duds=0;
  rows.forEach(i=>{total+=i.total;storage+=i.storage;duds+=(i.duds||0);});
  return {total,storage,duds};
}
function rProducts(){
  /* One card per product with just what matters: stock, cost, sell price, profit per unit and
     margin. Active products first in sheet order, paused and discontinued ones faded last. */
  const act=p=>String(p.status||"").trim().toLowerCase()==="active";
  const list=D.products.filter(act).concat(D.products.filter(p=>!act(p)));
  const cards=list.map(p=>{
    const si=invStockFor(p,D.inventory),stock=si.total,duds=si.duds||0,mismatch=stockMismatch(p);
    const cost=p.cost||0,sell=p.netPrice||0,profit=sell-cost,mPct=sell>0?Math.round(profit/sell*100):0;
    const n=ocName(p),st=ocStrength(p),on=act(p);
    const sc=stock<=0?"pr-out":stock<10?"pr-low":"pr-ok";
    const fig=(l,v,c)=>'<div><div class="pr-fl">'+l+'</div><div class="pr-fv'+(c?' '+c:'')+'">'+v+'</div></div>';
    return '<div class="mc pr'+(on?'':' pr-off')+'">'+
      '<div class="pr-top"><div style="min-width:0"><div class="pr-n">'+esc(n.main)+(st?' <span class="pr-st">'+esc(st)+'</span>':'')+'</div>'+
        '<div class="pr-sku">'+esc(p.sku)+(on?'':', '+esc(String(p.status||"").toLowerCase()))+'</div></div>'+
        '<div class="pr-stock '+sc+'"><b>'+stock+'</b> in stock</div></div>'+
      '<div class="pr-figs">'+fig('Cost',fmt(cost))+fig('Sell price',fmt(sell))+fig('Profit per unit',fmt(profit),profit>=0?'c-pos':'c-neg')+'</div>'+

/* ---------- Cold Storage ----------
   What is in the freezer, straight off the Cold_Storage tab. Spare rows with no proper name yet
   are left out. The + and - buttons change the count on the sheet for everyone; the number moves
   straight away here and is put back if the save fails. */
const CS=Object.create(null);   // counts changed here and still on their way to the sheet
function csRows(){
  const raw=(D&&D.rawCold)||[];
  const hr=findRow(raw,0,"SKU");if(hr<0)return[];
  const m=headerMap(raw,hr),c=n=>colIdx(m,n);
  const out=[];
  for(let i=hr+1;i<raw.length;i++){
    const r=raw[i]||[],sku=String(r[c("SKU")]||"").trim();
    if(!sku||/^\(?\s*add more\s*\)?$/i.test(sku))continue;   // a spare row, not named yet
    const st=String(r[c("Status")]||"").trim();
    out.push({sku,strength:String(r[c("Strength")]||"").trim(),unit:String(r[c("Unit")]||"").trim(),
      stock:Math.max(0,Math.round(num(r[c("In stock")]))),active:st.toLowerCase()==="active",status:st});
  }
  return out;
}
function rCold(){
  const rows=csRows();
  const act=rows.filter(r=>r.active),off=rows.filter(r=>!r.active);
  const total=act.reduce((s,r)=>s+r.stock,0);
  const card=r=>{
    const n=CS[r.sku]!=null?CS[r.sku]:r.stock;
    const sc=n<=0?"pr-out":n<10?"pr-low":"pr-ok";
    return '<div class="mc pr'+(r.active?'':' pr-off cs-off')+'" data-cs="'+esc(r.sku)+'">'+
      '<div class="pr-top"><div style="min-width:0"><div class="pr-n">'+esc(r.sku)+(r.strength?' <span class="pr-st">'+esc(r.strength+(r.unit?' '+r.unit:''))+'</span>':'')+'</div>'+
        '<div class="pr-sku">'+(r.active?'In the freezer':esc(r.status||'Not active'))+'</div></div>'+
        '<div class="pr-stock '+sc+'"><b data-csn>'+n+'</b>in stock</div></div>'+
      '<div class="cs-row"><span class="c-dim" style="font-size:14px">'+(r.active?'Tap to change the count':'')+'</span>'+
        '<div class="cs-step"><button type="button" onclick="csAdj(\''+esc(r.sku).replace(/'/g,"\\'")+'\',-1)" aria-label="One fewer"'+(n<=0?' disabled':'')+'>&minus;</button>'+
        '<span class="cs-n" data-csn>'+n+'</span>'+
        '<button type="button" onclick="csAdj(\''+esc(r.sku).replace(/'/g,"\\'")+'\',1)" aria-label="One more">+</button></div></div>'+
    '</div>';
  };
  const body=rows.length?'<div class="mg mg3">'+act.map(card).join("")+off.map(card).join("")+'</div>'
    :'<div class="mc">Nothing in the Cold_Storage tab yet. Run setupColdStorage in the script once, or add rows to the tab.</div>';
  document.getElementById("sec-cold").innerHTML='<div class="sh"><h2>Cold Storage</h2><span class="badge">'+total+' in stock · '+act.length+' active</span></div>'+
    '<div class="cs-note">Counts save to the sheet for everyone. Add a product by naming one of the spare rows in the Cold_Storage tab.</div>'+body;

function csAdj(sku,delta){
  if(!D||!SCRIPT_URL||!SCRIPT_KEY)return;
  const row=csRows().find(r=>r.sku===sku);if(!row||!row.active)return;
  const was=CS[sku]!=null?CS[sku]:row.stock,now=Math.max(0,was+delta);
  if(now===was)return;
  CS[sku]=now;csPaint(sku,now);
  const u=SCRIPT_URL+(SCRIPT_URL.indexOf("?")>=0?"&":"?")+"key="+encodeURIComponent(SCRIPT_KEY)+"&action=cold&sku="+encodeURIComponent(sku)+"&delta="+delta+"&t="+Date.now();
  (async function(){
    for(let i=0;i<3;i++){
      try{
        const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);
        const resp=await fetch(u,{signal:ctrl.signal});clearTimeout(timer);
        const j=await resp.json().catch(()=>null);
        if(j&&j.error==="unauthorized"){dashOut("");return;}
        if(j&&j.ok){
          // the sheet's number wins, in case someone else tapped at the same time
          const r=((D&&D.rawCold)||[]).find(x=>String(x[0]||"").trim()===j.sku);if(r)r[3]=String(j.stock);
          delete CS[sku];csPaint(sku,j.stock);return;
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,1500));
    }
    delete CS[sku];csPaint(sku,row.stock);
    bannerWarn("Couldn't save that count. Check your connection and try again.");
  })();
}
function csPaint(sku,n){
  const card=document.querySelector('[data-cs="'+(window.CSS&&CSS.escape?CSS.escape(sku):sku)+'"]');if(!card)return;
  card.querySelectorAll("[data-csn]").forEach(e=>e.textContent=n);
  const pill=card.querySelector(".pr-stock");if(pill)pill.className="pr-stock "+(n<=0?"pr-out":n<10?"pr-low":"pr-ok");
  const minus=card.querySelector('[aria-label="One fewer"]');if(minus)minus.disabled=n<=0;
}
